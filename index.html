  appId: "1:462390983896:web:a43c8acf2d236203c36bad",
  measurementId: "G-82RR7G869R",
};
const FB_DATA     = "facil/data";      // 학교 데이터 (ID로 키잉 → 부분 저장)
const FB_META     = "facil/meta";      // 마지막 수정자/시각
const FB_PRESENCE = "facil/presence";  // 동시 접속자

/* 객체-키 ↔ 배열 변환 */
const toArr = v => Array.isArray(v) ? v : (v && typeof v==="object" ? Object.values(v) : []);

/* Firebase(키잉 객체) → 화면용 배열 db */
function fbToDb(raw) {
  if (!raw || typeof raw !== "object") return null;
  const out = {};
  Object.entries(raw).forEach(([yr, halves]) => {
    out[yr] = {};
    Object.entries(halves||{}).forEach(([half, schoolsObj]) => {
      out[yr][half] = toArr(schoolsObj).filter(Boolean).map(s => ({
        ...s,
        assignees: toArr(s.assignees),
        buildings: toArr(s.buildings).filter(Boolean),
      })).sort((a,b) => {
        const na = parseInt(a.no,10), nb = parseInt(b.no,10);
        if (!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
        return String(a.id).localeCompare(String(b.id));
      });
    });
  });
  return out;
}

/* 화면용 배열 db → Firebase(키잉 객체) — 초기 시드용 */
function dbToFb(db) {
  const out = {};
  Object.entries(db).forEach(([yr, halves]) => {
    out[yr] = {};
    Object.entries(halves).forEach(([half, schools]) => {
      out[yr][half] = {};
      schools.forEach(s => { out[yr][half][s.id] = s; });
    });
  });
  return out;
}

/* 두 db를 학교 단위로 비교 → 변경된 경로만 추출 (부분 저장용)
   결과: { "2026/상반기/26u1": {school} | null(삭제) } */
function diffDb(prev, next) {
  const updates = {};
  const pv = prev || {};
  Object.entries(next).forEach(([yr, halves]) => {
    Object.entries(halves).forEach(([half, schools]) => {
      const prevArr = pv[yr]?.[half] || [];
      const prevById = {};
      prevArr.forEach(s => { prevById[s.id] = s; });
      schools.forEach(s => {
        const before = prevById[s.id];
        if (!before || JSON.stringify(before) !== JSON.stringify(s)) {
          updates[`${yr}/${half}/${s.id}`] = s;
        }
        delete prevById[s.id];
      });
      Object.keys(prevById).forEach(id => { updates[`${yr}/${half}/${id}`] = null; });
    });
  });
  return updates;
}

/* ══════════════════════════════════════════════════════════════
   메인 앱 — 사이드바 + 라우팅
══════════════════════════════════════════════════════════════ */
function App() {
  const isMobile = useIsMobile();
  const [db, setDb] = useState(DB);
  const [sideOpen, setSideOpen] = useState(typeof window!=="undefined" ? window.innerWidth>=820 : true);
  const [menu, setMenuRaw] = useState("schedule");
  const [globalTeam, setGlobalTeam] = useState("전체");
  // 모바일에서 메뉴 선택 시 사이드바 자동 닫힘
  const setMenu = (m) => { setMenuRaw(m); if (window.innerWidth < 820) setSideOpen(false); };

  /* ── Firebase 상태 ── */
  const [fbStatus, setFbStatus] = useState("연결 중...");
  const [online,   setOnline]   = useState(false);   // .info/connected
  const [syncing,  setSyncing]  = useState(false);    // 저장 중 표시
  const [loaded,   setLoaded]   = useState(false);    // 첫 데이터 도착
  const [users,    setUsers]    = useState(0);        // 동시 접속자
  const [meta,     setMeta]     = useState(null);     // { at, by }
  const [editor,   setEditor]   = useState(() => {
    try { return localStorage.getItem("facil_editor") || ""; } catch { return ""; }
  });
  const saveName = n => { setEditor(n); try { localStorage.setItem("facil_editor", n); } catch {} };

  const dataRef    = useRef(null);
  const metaRef    = useRef(null);
  const lastSynced = useRef(null);    // 마지막으로 FB와 일치한 db
  const skipWrite  = useRef(false);   // 원격 반영분 재저장 차단
  const fbReady    = useRef(false);
  const editorRef  = useRef(editor);
  editorRef.current = editor;
  const saveTimer  = useRef(null);

  /* 1) 초기화 + 실시간 구독 + 접속 상태 + presence */
  useEffect(() => {
    let offData=null, offConn=null, offPres=null, offMeta=null, presNode=null, offAuth=null;
    try {
      if (typeof firebase === "undefined") { setFbStatus("오프라인 (SDK 없음)"); return; }
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      const rootDb = firebase.database();

      /* 접속 상태 (인증 불필요) */
      const connRef = rootDb.ref(".info/connected");
      const onConn = (s) => {
        const c = s.val()===true;
        setOnline(c);
        setFbStatus(c ? "실시간 연결됨" : "재연결 중...");
      };
      connRef.on("value", onConn);
      offConn = () => connRef.off("value", onConn);

      /* 인증 완료 후 데이터/메타/presence 구독 */
      const attach = () => {
        const dRef = rootDb.ref(FB_DATA);
        const mRef = rootDb.ref(FB_META);
        dataRef.current = dRef;
        metaRef.current = mRef;

        const onData = (snap) => {
          const val = fbToDb(snap.val());
          if (val && Object.keys(val).length) {
            skipWrite.current = true;
            lastSynced.current = val;
            setDb(val);
          } else {
            dRef.set(dbToFb(DB)).catch(()=>{});   // 비어있으면 시드
            lastSynced.current = DB;
          }
          fbReady.current = true;
          setLoaded(true);
        };
        const onErr = (err) => { console.error("[Firebase] 구독 오류:", err); setFbStatus("오프라인 (권한 확인)"); setLoaded(true); };
        dRef.on("value", onData, onErr);
        offData = () => dRef.off("value", onData);

        const onMeta = (s) => { const m=s.val(); if(m) setMeta(m); };
        mRef.on("value", onMeta);
        offMeta = () => mRef.off("value", onMeta);

        const presRef = rootDb.ref(FB_PRESENCE);
        presNode = presRef.push();
        presNode.set({ name: editorRef.current || "익명", ts: Date.now() });
        presNode.onDisconnect().remove();
        const onPres = (s) => setUsers(s.numChildren());
        presRef.on("value", onPres);
        offPres = () => presRef.off("value", onPres);
      };

      /* 익명 인증 — 앱을 거친 사용자만 DB 접근 가능 */
      if (firebase.auth) {
        let attached = false;
        offAuth = firebase.auth().onAuthStateChanged((user) => {
          if (user && !attached) { attached = true; attach(); }
        });
        firebase.auth().signInAnonymously().catch((e) => {
          console.error("[Firebase] 익명 로그인 실패:", e);
          // 익명 인증 미설정 시 → 인증 없이라도 구독 시도(공개 규칙 대비)
          if (!offData) attach();
          setFbStatus("오프라인 (인증 확인)");
        });
      } else {
        attach();   // auth SDK 없으면 바로 구독 (공개 규칙)
      }
    } catch (e) {
      console.error("[Firebase] 초기화 실패:", e);
      setFbStatus("오프라인 (로컬)");
      setLoaded(true);
    }
    return () => {
      if (offAuth) offAuth(); if (offData) offData(); if (offConn) offConn();
      if (offPres) offPres(); if (offMeta) offMeta();
      if (presNode) presNode.remove().catch(()=>{});
    };
  }, []);

  /* 2) 로컬 db 변경 → 변경된 학교만 부분 저장 (디바운스 + 에코 차단) */
  useEffect(() => {
    if (!fbReady.current || !dataRef.current) return;
    if (skipWrite.current) { skipWrite.current = false; lastSynced.current = db; return; }

    const updates = diffDb(lastSynced.current, db);
    const keys = Object.keys(updates);
    if (keys.length === 0) { lastSynced.current = db; return; }

    setSyncing(true);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      dataRef.current.update(updates)
        .then(() => {
          metaRef.current?.set({ at: Date.now(), by: editorRef.current || "익명",
            cnt: keys.length }).catch(()=>{});
          lastSynced.current = db;
        })
        .catch(e => console.error("[Firebase] 저장 실패:", e))
        .finally(() => setSyncing(false));
    }, 300);
  }, [db]);

  /* presence 이름 갱신 */
  useEffect(() => {
    if (!fbReady.current) return;
    try {
      const presRef = firebase.database().ref(FB_PRESENCE);
      // 이름이 바뀌면 메타에만 반영 (presence 노드는 세션 단위라 생략)
    } catch {}
  }, [editor]);

  const fmtMeta = (ts) => {
    if (!ts) return "";
    const d = new Date(ts), now = new Date();
    const sameDay = d.toDateString()===now.toDateString();
    const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
    return sameDay ? `오늘 ${hh}:${mm}` : `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
  };

  const allSchools = useMemo(() => {
    const list = [];
    Object.entries(db).forEach(([yr,halves]) =>
      Object.entries(halves).forEach(([half,schools]) =>
        schools.forEach(s => list.push({ ...s, _year:yr, _half:half }))));
    return list;
  }, [db]);

  const urgent = allSchools.filter(s => { const d=calcDday(s.end); return d!==null&&d<0&&d>=-7; });

  const pages = {
    schedule: <Calendar allSchools={allSchools} setDb={setDb} globalTeam={globalTeam} isMobile={isMobile}/>,
    sites:    <SitesManager db={db} setDb={setDb} globalTeam={globalTeam} isMobile={isMobile}/>,
    urgent: (
      <div>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,marginBottom:3,fontWeight:600 }}>URGENT</div>
        <h1 style={{ margin:"0 0 16px",fontSize:22,fontWeight:900,color:C.t1 }}>긴급 보고서 <span style={{ fontSize:14,color:C.red,fontWeight:400 }}>D-7 이내 {urgent.length}건</span></h1>
        {urgent.length===0 && <div style={{ color:C.t4,padding:32,textAlign:"center" }}>긴급 현장 없음</div>}
        {urgent.map(s=>(
          <div key={s.id} style={{ background:C.redL,border:`1.5px solid ${C.red}30`,borderLeft:`4px solid ${C.red}`,borderRadius:"0 12px 12px 0",padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12 }}>
            <div style={{ fontSize:20,fontWeight:900,color:C.red,minWidth:50 }}>{ddL(calcDday(s.end))}</div>
            <div style={{ flex:1 }}><div style={{ fontWeight:700,color:C.t1,fontSize:14 }}>{s.school}</div>
              <div style={{ fontSize:11,color:C.t2 }}>{s.region} · {s.team} · {s._year} {s._half} · {s.buildings.length}동</div></div>
            <Tag bg={TC[s.team]?.b} color={TC[s.team]?.a}>{s.team}</Tag>
          </div>
        ))}
      </div>
    ),
    done: (
      <div>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,marginBottom:3,fontWeight:600 }}>COMPLETED</div>
        <h1 style={{ margin:"0 0 16px",fontSize:22,fontWeight:900,color:C.t1 }}>완료 보고서</h1>
        {allSchools.filter(s=>s.buildings.every(b=>b.rep&&b.fmsD)).map(s=>(
          <div key={s.id} style={{ background:C.greenL,border:`1.5px solid ${C.green}30`,borderLeft:`4px solid ${C.green}`,borderRadius:"0 10px 10px 0",padding:"12px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:12 }}>
            <div style={{ fontSize:16,color:C.green }}>✓</div>
            <div style={{ flex:1 }}><div style={{ fontWeight:700,color:C.t1 }}>{s.school}</div>
              <div style={{ fontSize:11,color:C.t2 }}>{s.region} · {s.team} · {s._year} {s._half} · 완수 {fd(s.end)}</div></div>
            <Tag bg={TC[s.team]?.b} color={TC[s.team]?.a}>{s.team}</Tag>
          </div>
        ))}
      </div>
    ),
    export: <ExportImportPage db={db} setDb={setDb}/>,
  };

  return (
    <div style={{ fontFamily:F,background:C.bg,minHeight:"100vh",display:"flex",color:C.t1,fontSize:13 }}>
      <style>{`*{box-sizing:border-box}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:${C.surfaceL}}::-webkit-scrollbar-thumb{background:${C.borderD};border-radius:4px}input::placeholder,textarea::placeholder{color:${C.t4}}button{cursor:pointer;transition:all .12s}button:hover{opacity:.85}input[type="date"]{color-scheme:light}@keyframes spin{to{transform:rotate(360deg)}}`}</style>

      {!loaded && (
        <div style={{ position:"fixed",inset:0,background:C.bg,zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16 }}>
          <div style={{ fontSize:26,fontWeight:900,color:C.t1 }}><span style={{ color:C.blue }}>◈</span> FACIL</div>
          <div style={{ width:30,height:30,border:`3px solid ${C.border}`,borderTopColor:C.blue,borderRadius:"50%",animation:"spin .8s linear infinite" }}/>
          <div style={{ fontSize:12,color:C.t3 }}>Firebase 실시간 데이터 불러오는 중…</div>
        </div>
      )}

      {/* 모바일 사이드바 배경 딤 */}
      {isMobile && sideOpen && (
        <div onClick={()=>setSideOpen(false)}
          style={{ position:"fixed",inset:0,background:"rgba(20,25,40,.45)",zIndex:99 }}/>
      )}

      <aside style={{ width:sideOpen?(isMobile?280:214):0,minWidth:sideOpen?(isMobile?280:214):0,maxWidth:"85vw",
        background:C.surface,borderRight:BD,overflow:"hidden",
        transition:"width .22s,min-width .22s",position:"fixed",top:0,left:0,height:"100vh",zIndex:100,display:"flex",flexDirection:"column",boxShadow:sideOpen?"2px 0 16px rgba(0,0,0,.12)":"none" }}>
      <div style={{ width:isMobile?280:214,maxWidth:"85vw",height:"100%",display:"flex",flexDirection:"column",overflowY:"auto" }}>
        <div style={{ padding:"20px 18px 14px",borderBottom:BD,whiteSpace:"nowrap" }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
            <div><div style={{ fontSize:18,fontWeight:900,color:C.t1,letterSpacing:-.5 }}><span style={{ color:C.blue }}>◈</span> FACIL</div>
              <div style={{ fontSize:9,color:C.t4,marginTop:2,letterSpacing:2,fontWeight:600 }}>현장조사팀</div></div>
            <button onClick={()=>setSideOpen(false)} style={{ background:"transparent",border:"none",color:C.t4,fontSize:18,padding:"2px 4px" }}>☰</button>
          </div>

          {/* 연결 상태 + 저장 표시 */}
          <div style={{ display:"flex",alignItems:"center",gap:6,marginTop:11 }}>
            <div style={{ display:"flex",alignItems:"center",gap:5,fontSize:10,fontWeight:700,
              color:online?C.green:fbStatus==="연결 중..."?C.orange:C.t3 }}>
              <div style={{ width:7,height:7,borderRadius:"50%",
                background:online?C.green:fbStatus==="연결 중..."?C.orange:C.t4,
                boxShadow:online?`0 0 6px ${C.green}`:"none" }}/>
              {online ? "실시간 연결됨" : fbStatus}
            </div>
            {syncing && <span style={{ fontSize:9,color:C.blue,fontWeight:600,marginLeft:"auto" }}>저장 중…</span>}
            {!syncing && online && <span style={{ fontSize:9,color:C.t4,marginLeft:"auto" }}>✓ 저장됨</span>}
          </div>

          {/* 동시 접속자 + 마지막 수정 */}
          <div style={{ marginTop:8,padding:"7px 9px",background:C.surfaceL,borderRadius:7,border:BD }}>
            <div style={{ display:"flex",alignItems:"center",gap:5,fontSize:9,color:C.t2,fontWeight:600 }}>
              <span style={{ width:5,height:5,borderRadius:"50%",background:users>0?C.green:C.t4 }}/>
              동시 접속 {users}명
            </div>
            {meta?.at && (
              <div style={{ fontSize:9,color:C.t3,marginTop:4,whiteSpace:"normal",lineHeight:1.4 }}>
                마지막 수정 · <b style={{ color:C.t2 }}>{meta.by||"익명"}</b>님 {fmtMeta(meta.at)}
              </div>
            )}
          </div>

          {/* 내 이름 */}
          <div style={{ marginTop:8 }}>
            <select value={editor} onChange={e=>saveName(e.target.value)}
              style={{ width:"100%",padding:"6px 8px",background:C.surface,border:BD,borderRadius:6,
                color:editor?C.t1:C.t4,fontSize:11,outline:"none",fontWeight:600 }}>
              <option value="">내 이름 선택 (수정 기록용)</option>
              {Object.entries(TEAM_MEMBERS).map(([t,arr])=>(
                <optgroup key={t} label={t}>
                  {arr.map(n=><option key={n} value={n}>{n}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
        </div>

        <div style={{ padding:"10px 16px 8px",borderBottom:BD }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7 }}>
            <span style={{ fontSize:9,color:C.t4,letterSpacing:1,fontWeight:700 }}>팀 구분 (클릭 필터)</span>
            {globalTeam!=="전체" && <button onClick={()=>setGlobalTeam("전체")} style={{ fontSize:9,color:C.t3,background:"transparent",border:"none",cursor:"pointer",textDecoration:"underline",padding:0 }}>전체</button>}
          </div>
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:6 }}>
            {Object.entries(TC).map(([t,v])=>{
              const active=globalTeam===t;
              return (
                <button key={t} onClick={()=>setGlobalTeam(active?"전체":t)} style={{ padding:"7px 0",borderRadius:7,textAlign:"center",cursor:"pointer",
                  background:active?v.a:v.b,border:`1.5px solid ${active?v.a:v.a+"40"}`,boxShadow:active?`0 2px 8px ${v.a}50`:"none",transition:"all .15s" }}>
                  <div style={{ display:"flex",alignItems:"center",justifyContent:"center",gap:5 }}>
                    <div style={{ width:7,height:7,borderRadius:"50%",background:active?"#fff":v.a }}/>
                    <span style={{ fontSize:11,fontWeight:700,color:active?"#fff":v.a }}>{t}</span>
                    <span style={{ fontSize:9,color:active?"rgba(255,255,255,.7)":v.c }}>{allSchools.filter(s=>s.team===t).length}</span>
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <nav style={{ flex:1,padding:"8px 0",overflowY:"auto" }}>
          <div style={{ padding:"8px 16px 3px",fontSize:9,color:C.t4,letterSpacing:1.5,fontWeight:700 }}>MAIN</div>
          {MENUS.slice(0,2).map(m=>(
            <button key={m.id} onClick={()=>setMenu(m.id)} style={{ width:"100%",display:"flex",alignItems:"center",gap:10,padding:"12px 18px",
              background:menu===m.id?C.blueL:"transparent",borderLeft:`3px solid ${menu===m.id?C.blue:"transparent"}`,border:"none",
              color:menu===m.id?C.blue:C.t2,fontSize:13,fontWeight:menu===m.id?700:500,textAlign:"left",whiteSpace:"nowrap" }}>
              <span style={{ fontSize:15 }}>{m.icon}</span><span style={{ flex:1 }}>{m.label}</span>
            </button>
          ))}
          <div style={{ height:1,background:C.border,margin:"8px 14px" }}/>
          <div style={{ padding:"6px 16px 3px",fontSize:9,color:C.t4,letterSpacing:1.5,fontWeight:700 }}>REPORT</div>
          {MENUS.slice(2).map(m=>(
            <button key={m.id} onClick={()=>setMenu(m.id)} style={{ width:"100%",display:"flex",alignItems:"center",gap:10,padding:"10px 18px",
              background:menu===m.id?C.blueL:"transparent",borderLeft:`3px solid ${menu===m.id?C.blue:"transparent"}`,border:"none",
              color:menu===m.id?C.blue:C.t3,fontSize:12,fontWeight:menu===m.id?700:400,textAlign:"left",whiteSpace:"nowrap" }}>
              <span style={{ fontSize:13 }}>{m.icon}</span><span style={{ flex:1 }}>{m.label}</span>
              {m.id==="urgent"&&urgent.length>0 && <span style={{ background:C.red,color:"#fff",fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:10 }}>{urgent.length}</span>}
            </button>
          ))}
        </nav>

        <div style={{ padding:"12px 16px",borderTop:BD }}>
          <div style={{ fontSize:9,color:C.t4,marginBottom:8,letterSpacing:1,fontWeight:700 }}>연도별 현장</div>
          {Object.entries(db).sort((a,b)=>b[0]-a[0]).map(([y,hs])=>(
            <div key={y} style={{ marginBottom:6 }}>
              <div style={{ fontSize:11,fontWeight:700,color:C.t2,marginBottom:3 }}>{y}년</div>
              <div style={{ display:"flex",gap:5 }}>
                {Object.entries(hs).map(([h,ss])=>(
                  <div key={h} style={{ fontSize:10,color:h==="상반기"?C.blue:C.orange,background:h==="상반기"?C.blueL:C.orangeL,padding:"2px 7px",borderRadius:5,fontWeight:600 }}>
                    {h==="상반기"?"🌱":"🍂"} {ss.length}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
      </aside>

      <main style={{ marginLeft:isMobile?0:(sideOpen?214:0),flex:1,transition:"margin .22s",display:"flex",flexDirection:"column",minWidth:0 }}>
        <header style={{ height:52,background:C.surface,borderBottom:`1.5px solid ${C.borderD}`,display:"flex",alignItems:"center",padding:isMobile?"0 14px":"0 22px",gap:12,position:"sticky",top:0,zIndex:50,boxShadow:"0 1px 6px rgba(0,0,0,.06)" }}>
          <button onClick={()=>setSideOpen(v=>!v)} style={{ width:34,height:34,borderRadius:8,background:C.surfaceL,border:BD,color:C.t2,fontSize:17,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",flexShrink:0 }}>
            ☰{!sideOpen&&urgent.length>0 && <span style={{ position:"absolute",top:-4,right:-4,background:C.red,color:"#fff",fontSize:8,fontWeight:700,padding:"1px 4px",borderRadius:8 }}>{urgent.length}</span>}
          </button>
          <div style={{ fontSize:14,fontWeight:800,color:C.t1 }}>{MENUS.find(m=>m.id===menu)?.icon} {MENUS.find(m=>m.id===menu)?.label}</div>
          <div style={{ flex:1 }}/>
          {!isMobile && <div style={{ fontSize:10,color:C.t3 }}>기준일 {BASE_DATE} · 연도/반기별 분리</div>}
          {!isMobile && <button onClick={()=>setMenu("schedule")} style={{ padding:"6px 13px",background:menu==="schedule"?C.blueL:"transparent",border:`1.5px solid ${menu==="schedule"?C.blue:C.border}`,borderRadius:8,color:menu==="schedule"?C.blue:C.t3,fontSize:11,fontWeight:700 }}>📅 현장일정</button>}
          {!isMobile && <button onClick={()=>setMenu("sites")} style={{ padding:"6px 13px",background:menu==="sites"?C.greenL:"transparent",border:`1.5px solid ${menu==="sites"?C.green:C.border}`,borderRadius:8,color:menu==="sites"?C.green:C.t3,fontSize:11,fontWeight:700 }}>🏫 현장관리</button>}
        </header>
        <div style={{ padding:isMobile?14:22,overflowY:"auto",flex:1 }}>{pages[menu]}</div>
      </main>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

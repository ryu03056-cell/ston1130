          <button onClick={onClose} style={{ marginLeft:"auto",padding:"11px 18px",borderRadius:9,border:BD,background:"transparent",color:C.t3,fontSize:13,cursor:"pointer" }}>취소</button>
          <button onClick={doCopy} disabled={selCount===0} style={{ padding:"11px 22px",borderRadius:9,border:"none",
            background:selCount===0?C.surfaceD:C.blue,color:selCount===0?C.t4:"#fff",fontSize:13,fontWeight:700,cursor:selCount===0?"default":"pointer" }}>
            {toHalf}로 복사 ({selCount})
          </button>
        </div>
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════
   현장 관리 — 연도/반기 탭 + 테이블
══════════════════════════════════════════════════════════════ */
function SitesManager({ db, setDb, isMobile }) {
  const [yr, setYr] = useState(String(new Date().getFullYear()));
  const [half, setHalf] = useState((new Date().getMonth()+1) <= 6 ? "상반기" : "하반기");
  /* 데이터가 들어왔는데 현재 탭이 비어 있으면, 데이터 있는 연/반기로 자동 이동 (최초 1회) */
  const didInit = useRef(false);
  useEffect(() => {
    if (didInit.current) return;
    const anyData = Object.values(db).some(hs => Object.values(hs||{}).some(a => (a||[]).length));
    if (!anyData) return;                              // 아직 데이터 없음 → 대기
    if ((db[yr]?.[half]||[]).length) { didInit.current = true; return; }   // 현재 탭에 데이터 있음
    const years = Object.keys(db).sort((a,b)=>b-a);
    for (const y of years) for (const h of Object.keys(db[y]||{})) {
      if ((db[y]?.[h]||[]).length) { setYr(y); setHalf(h); didInit.current = true; return; }
    }
  }, [db]);
  const [stF, setStF] = useState("전체");
  const [search, setSearch] = useState("");
  const [open, setOpen] = useState(new Set());
  const [copied, setCopied] = useState(null);
  const [editId, setEditId] = useState(null);
  const [copyOpen, setCopyOpen] = useState(false);
  const [toast, setToast] = useState(null);


  const showToast = m => { setToast(m); setTimeout(()=>setToast(null), 2000); };
  const copy = (t,id) => { navigator.clipboard?.writeText(t).catch(()=>{}); setCopied(id); setTimeout(()=>setCopied(null),1500); };

  /* 새 현장 추가 → 현재 연/반기에 빈 학교 생성 후 편집창 열기 */
  const addNewSite = () => {
    const id = `new-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`;
    const newSc = { id, school:"새 현장", no:"",
      region:"", kind:"정기점검", field:"", start:"", end:"", headcount:1, assignees:[], progress:{},
      buildings:[{ b:"본관", floor:null, area:null, fms:null, flag:null, note:null, rep:false, fmsD:false, delivery:null }] };
    setDb(prev => { const n={...prev}; n[yr]={...(prev[yr]||{})}; n[yr][half]=[...(prev[yr]?.[half]||[]), newSc]; return n; });
    setEditId(id);
    showToast("새 현장 추가됨 · 내용을 입력하세요");
  };

  const schools = useMemo(()=>db[yr]?.[half]||[], [db,yr,half]);

  const updDate = (sid,field,v) => {
    const sc = schools.find(s=>s.id===sid);
    const lbl = field==="field"?"현장조사일":field==="start"?"착수일":"완수일";
    setDb(prev=>{ const n={...prev}; n[yr]={...prev[yr]};
      n[yr][half]=prev[yr][half].map(s=>s.id!==sid?s:{...s,[field]:v}); return n; });
    logAction("수정", `${sc?.school} · ${lbl}`, sc?.[field]||"-", v||"-");
    showToast("날짜 변경됨 · 캘린더 자동 반영");
  };
  const toggleB = (sid,bi,field) => {
    const sc = schools.find(s=>s.id===sid); const b = sc?.buildings[bi];
    const fl = field==="rep"?"보고서":field==="fmsD"?"FMS등록":field;
    setDb(prev=>{ const n={...prev}; n[yr]={...prev[yr]};
      n[yr][half]=prev[yr][half].map(s=>s.id!==sid?s:{...s,buildings:s.buildings.map((x,j)=>j!==bi?x:{...x,[field]:!x[field]})}); return n; });
    logAction("수정", `${sc?.school} · ${b?.b||""} ${fl}`, b?.[field]?"완료":"미완료", b?.[field]?"미완료":"완료");
  };
  const setDel = (sid,bi,v) => {
    const sc = schools.find(s=>s.id===sid); const b = sc?.buildings[bi];
    setDb(prev=>{ const n={...prev}; n[yr]={...prev[yr]};
      n[yr][half]=prev[yr][half].map(s=>s.id!==sid?s:{...s,buildings:s.buildings.map((x,j)=>j!==bi?x:{...x,delivery:x.delivery===v?null:v})}); return n; });
    logAction("수정", `${sc?.school} · ${b?.b||""} 납품`, b?.delivery||"-", b?.delivery===v?"-":v);
  };

  const filtered = useMemo(()=>schools.filter(s=>{
    if (search && !s.school.includes(search) && !(s.region||"").includes(search)) return false;
    if (stF==="보고서 미완") return s.buildings.some(b=>!b.rep);
    if (stF==="FMS 미완")   return s.buildings.some(b=>!b.fmsD);
    if (stF==="납품 미정")  return s.buildings.some(b=>b.rep&&!b.delivery);
    if (stF==="완료")       return s.buildings.every(b=>b.rep&&b.fmsD);
    return true;
  }).sort((a,b)=>{
    const da=calcDday(a.end)??9999, dbb=calcDday(b.end)??9999;
    if(da<0&&dbb>=0)return -1; if(da>=0&&dbb<0)return 1;
    if(da<0&&dbb<0)return dbb-da; return da-dbb;
  }), [schools,stF,search]);

  const allB = filtered.flatMap(s=>s.buildings);
  const st = { total:allB.length, rep:allB.filter(b=>b.rep).length, fms:allB.filter(b=>b.fmsD).length, noD:allB.filter(b=>b.rep&&!b.delivery).length };
  const years = Object.keys(db).sort((a,b)=>b-a);
  const editSc = editId ? schools.find(s=>s.id===editId) : null;

  return (
    <div style={{ display:"flex",flexDirection:"column",gap:14 }}>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
        <div>
          <div style={{ fontSize:11,color:C.t3,letterSpacing:2,marginBottom:3,fontWeight:600 }}>SITES MANAGEMENT</div>
          <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>현장 관리</h1>
        </div>
      </div>

      {/* 연도/반기 탭 */}
      <div style={{ display:"flex",alignItems:"center",background:C.surface,border:BD,borderRadius:12,overflow:isMobile?"auto":"hidden",overflowX:isMobile?"auto":"hidden",boxShadow:"0 1px 6px rgba(0,0,0,.05)" }}>
        <div style={{ display:"flex",borderRight:`2px solid ${C.border}`,flexShrink:0 }}>
          {years.map(y=>(
            <button key={y} onClick={()=>{ setYr(y); setHalf(Object.keys(db[y]||{})[0]||"상반기"); }}
              style={{ padding:isMobile?"11px 14px":"12px 20px",border:"none",borderBottom:`3px solid ${yr===y?C.blue:"transparent"}`,
                background:yr===y?C.blueL:"transparent",color:yr===y?C.blue:C.t3,fontSize:14,fontWeight:yr===y?800:500,cursor:"pointer",whiteSpace:"nowrap" }}>
              {isLH(y)?"🏢 LH":`${y}년`} {yr===y && <span style={{ fontSize:10,marginLeft:5,color:C.t4 }}>{Object.values(db[y]||{}).reduce((a,arr)=>a+(arr||[]).length,0)}건</span>}
            </button>
          ))}
        </div>
        <div style={{ display:"flex",padding:"0 8px",flexShrink:0 }}>
          {(isLH(yr)?["정밀"]:["상반기","하반기"]).map(h=>{
            const cnt=(db[yr]?.[h]||[]).length, on=half===h, hc=h==="상반기"?C.blue:h==="정밀"?C.purple:C.orange;
            return <button key={h} onClick={()=>setHalf(h)} style={{ padding:isMobile?"11px 12px":"12px 18px",border:"none",borderBottom:`3px solid ${on?hc:"transparent"}`,
              background:on?hc+"12":"transparent",color:on?hc:C.t3,fontSize:13,fontWeight:on?700:500,cursor:"pointer",display:"flex",alignItems:"center",gap:7,whiteSpace:"nowrap" }}>
              <span style={{ fontSize:15 }}>{h==="상반기"?"🌱":h==="정밀"?"🏢":"🍂"}</span>{h}
              <span style={{ fontSize:10,padding:"1px 6px",borderRadius:10,background:on?hc+"20":C.surfaceL,color:on?hc:C.t4,fontWeight:700 }}>{cnt}</span>
            </button>;
          })}
        </div>
        {!isMobile && (
          <div style={{ marginLeft:"auto",padding:"0 16px",fontSize:11,color:C.t3,fontWeight:600,whiteSpace:"nowrap" }}>
            {isLH(yr)?"LH 정밀":`${yr}년 ${half}`} · {filtered.length}개 / {filtered.flatMap(s=>s.buildings).length}동
          </div>
        )}
      </div>

      {/* 통계 카드 */}
      <div style={{ display:"grid",gridTemplateColumns:isMobile?"repeat(2,1fr)":"repeat(4,1fr)",gap:10 }}>
        {[{label:"전체 동",val:st.total,c:C.t2,f:"전체"},
          {label:"📄 보고서 완료",val:`${st.rep}/${st.total}`,c:C.purple,f:"보고서 미완"},
          {label:"🖥 FMS 완료",val:`${st.fms}/${st.total}`,c:C.blue,f:"FMS 미완"},
          {label:"📦 납품 미정",val:st.noD,c:C.orange,f:"납품 미정"}].map(x=>(
          <button key={x.label} onClick={()=>setStF(x.f)} style={{ padding:"12px 14px",background:stF===x.f?x.c+"08":C.surface,
            border:`1.5px solid ${stF===x.f?x.c+"60":C.border}`,borderTop:`3px solid ${x.c}`,borderRadius:10,textAlign:"left",cursor:"pointer",boxShadow:"0 1px 6px rgba(0,0,0,.04)" }}>
            <div style={{ fontSize:21,fontWeight:900,color:x.c,lineHeight:1 }}>{x.val}</div>
            <div style={{ fontSize:10,color:C.t3,marginTop:5,fontWeight:600 }}>{x.label}</div>
          </button>
        ))}
      </div>

      {/* 필터 */}
      <div style={{ display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",padding:"10px 14px",background:C.surface,border:BD,borderRadius:10 }}>
        <div style={{ display:"flex",background:C.surfaceL,border:BD,borderRadius:7,padding:"6px 11px",gap:7,alignItems:"center",width:190 }}>
          <span style={{ color:C.t4 }}>⌕</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="학교명·지역"
            style={{ background:"transparent",border:"none",color:C.t1,fontSize:13,outline:"none",flex:1 }}/>
          {search && <button onClick={()=>setSearch("")} style={{ background:"transparent",border:"none",color:C.t4,fontSize:15,padding:0,cursor:"pointer" }}>×</button>}
        </div>
        <div style={{ width:1,height:18,background:C.border }}/>
        {["전체","보고서 미완","FMS 미완","납품 미정","완료"].map(ff=>(
          <Pill key={ff} active={stF===ff} ac={C.purple} onClick={()=>setStF(ff)} style={{ fontSize:11 }}>{ff}</Pill>
        ))}
        <div style={{ marginLeft:"auto",display:"flex",gap:8 }}>
          <button onClick={()=>setCopyOpen(true)} style={{ padding:"8px 14px",borderRadius:8,border:`1.5px solid ${C.blue}40`,
            background:C.blueL,color:C.blue,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap" }}>📋 다른 반기에서 복사</button>
          <button onClick={addNewSite} style={{ padding:"8px 16px",borderRadius:8,border:"none",
            background:C.blue,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",boxShadow:`0 3px 10px ${C.blue}33` }}>+ 현장 추가</button>
        </div>
      </div>

      {/* 테이블 */}
      <div style={{ background:C.surface,border:BD,borderRadius:12,overflowX:isMobile?"auto":"hidden",overflowY:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.05)",WebkitOverflowScrolling:"touch" }}>
        <div style={{ minWidth:isMobile?660:"auto" }}>
        <div style={{ display:"grid",gridTemplateColumns:"2fr 110px 110px 70px 116px 50px",background:C.surfaceL,borderBottom:`1.5px solid ${C.borderD}`,padding:"10px 16px",gap:8 }}>
          {["학교 · 시설명","현장조사일","완수일","D-day","보고서·FMS·납품","수정"].map((h,i)=>(
            <div key={i} style={{ fontSize:10,color:C.t3,fontWeight:700,letterSpacing:.5,textAlign:i>=1?"center":"left" }}>{h}</div>
          ))}
        </div>

        {filtered.map((s,si)=>{
          const isOpen=open.has(s.id);
          const repAll=s.buildings.every(b=>b.rep), fmsAll=s.buildings.every(b=>b.fmsD);
          const allDone=repAll&&fmsAll&&s.buildings.every(b=>b.delivery);
          const dd=calcDday(s.end), urgent=dd!==null&&dd<0&&dd>=-7;
          return (
            <div key={s.id} style={{ borderBottom:BD }}>
              <div onClick={()=>setOpen(p=>{const n=new Set(p);n.has(s.id)?n.delete(s.id):n.add(s.id);return n;})}
                style={{ display:"grid",gridTemplateColumns:"2fr 110px 110px 70px 116px 50px",gap:8,padding:"12px 16px",cursor:"pointer",userSelect:"none",
                  background:urgent?C.redL+"80":allDone?C.greenL+"50":si%2===0?C.surface:C.surfaceL,
                  borderLeft:`3px solid ${urgent?C.red:allDone?C.green:"transparent"}` }}>
                <div style={{ display:"flex",flexDirection:"column",gap:5,minWidth:0 }}>
                  <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap" }}>
                    <span style={{ color:C.t4,fontSize:11,display:"inline-block",transform:isOpen?"rotate(90deg)":"none",transition:"transform .2s" }}>›</span>
                    <span style={{ fontWeight:800,fontSize:14,color:C.t1 }}>{s.school}</span>
                    {s.carried && <Tag bg={C.orange+"18"} color={C.orange} border={`1px solid ${C.orange}40`}>🍂 이월</Tag>}
                    <span style={{ fontSize:10,color:C.t3 }}>{s.region}</span>
                    {(()=>{ const tel=siteTel(s); return tel ? (
                      <a href={`tel:${tel.replace(/[^0-9+]/g,"")}`} onClick={e=>e.stopPropagation()} title={`${tel} 로 전화`}
                        style={{ padding:"2px 8px",borderRadius:5,fontSize:10,fontWeight:800,textDecoration:"none",
                          border:`1px solid ${C.green}55`,background:C.greenL,color:C.green,whiteSpace:"nowrap" }}>📞 {tel}</a>) : null; })()}
                    {urgent && <Tag bg={C.redL} color={C.red} border={`1px solid ${C.red}30`}>⚡긴급</Tag>}
                    {getFlags(s).map(fv=>{ const o=FLAG_OPTS.find(x=>x.v===fv); return o? <span key={fv} style={{ fontSize:10,fontWeight:700,color:o.color }}>{o.label}</span> : null; })}
                    {(s.assignees||[]).length>0 && <span style={{ fontSize:9,color:C.t2 }}>👤 {s.assignees.join("·")}</span>}
                    <span style={{ fontSize:10,color:C.t4 }}>{s.buildings.length}동</span>
                  </div>
                  {/* 8단계 진행바 + 강조 */}
                  <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",paddingLeft:19 }} onClick={e=>e.stopPropagation()}>
                    <StepBar progress={s.progress} compact/>
                    {(() => {
                      const p = (s.progress)||{};
                      const chip = (label, on, col) => (
                        <span style={{ fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,
                          background:on?col+"18":C.surfaceL, color:on?col:C.t4,
                          border:`1px solid ${on?col+"50":C.border}` }}>
                          {on?"✓ ":""}{label}
                        </span>
                      );
                      return <>
                        {chip("착수계", !!p["착수계"], C.blue)}
                        {chip("검토", !!p["검토"], C.purple)}
                        {chip("제본", !!p["제본"], C.purple)}
                        {chip("완수", !!p["완수"], C.green)}
                      </>;
                    })()}
                  </div>
                </div>
                <div onClick={e=>e.stopPropagation()} style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                  <input type="date" value={s.field||""} onChange={e=>updDate(s.id,"field",e.target.value)}
                    style={{ background:"transparent",border:`1px solid ${C.border}`,borderRadius:5,color:C.blue,fontSize:11,padding:"3px 5px",outline:"none",width:"100%",textAlign:"center",fontWeight:600 }}/>
                </div>
                <div onClick={e=>e.stopPropagation()} style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                  <input type="date" value={s.end||""} onChange={e=>updDate(s.id,"end",e.target.value)}
                    style={{ background:"transparent",border:`1px solid ${C.border}`,borderRadius:5,color:C.orange,fontSize:11,padding:"3px 5px",outline:"none",width:"100%",textAlign:"center",fontWeight:600 }}/>
                </div>
                <div style={{ fontSize:13,fontWeight:800,color:ddC(dd),textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center" }}>{ddL(dd)}</div>
                <div style={{ display:"flex",gap:4,alignItems:"center",justifyContent:"center" }}>
                  {[{k:"보",v:repAll,c:C.purple},{k:"F",v:fmsAll,c:C.blue},{k:"납",v:s.buildings.every(b=>b.delivery),c:C.green}].map(x=>(
                    <div key={x.k} style={{ width:26,height:20,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",
                      background:x.v?x.c+"18":C.surfaceL,border:`1px solid ${x.v?x.c+"50":C.border}`,fontSize:9,fontWeight:700,color:x.v?x.c:C.t4 }}>{x.v?"✓":x.k}</div>
                  ))}
                </div>
                <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                  <button onClick={e=>{e.stopPropagation();setEditId(s.id);}} style={{ padding:"3px 9px",borderRadius:5,fontSize:9,fontWeight:700,background:C.blueL,border:`1px solid ${C.blue}40`,color:C.blue,cursor:"pointer" }}>✏</button>
                </div>
              </div>

              {isOpen && s.buildings.map((b,bi)=>{
                const iid=`${s.id}-${bi}`;
                return (
                  <div key={bi} style={{ display:"grid",gridTemplateColumns:"2fr 110px 110px 70px 116px 50px",gap:8,padding:"8px 16px 8px 38px",background:C.surfaceL,borderTop:`1px solid ${C.border}`,
                    borderLeft:`3px solid ${b.rep&&b.fmsD&&b.delivery?C.green+"40":"transparent"}` }}>
                    <div>
                      <div style={{ display:"flex",alignItems:"center",gap:7,flexWrap:"wrap" }}>
                        <span style={{ fontSize:13,color:C.t1,fontWeight:600 }}>{b.b}</span>
                        {b.floor && <span style={{ fontSize:10,color:C.t4 }}>{b.floor}층</span>}
                        {b.area && <span style={{ fontSize:10,color:C.t4 }}>{b.area.toLocaleString()}㎡</span>}
                      </div>
                      {b.note && <div style={{ fontSize:10,color:C.t2,marginTop:3,padding:"3px 9px",background:C.yellowL,borderRadius:4,borderLeft:`2px solid ${C.yellow}`,maxWidth:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }} title={b.note}>{b.note}</div>}
                    </div>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                      {b.fms ? <button onClick={()=>copy(b.fms,`f-${iid}`)} style={{ padding:"4px 8px",borderRadius:5,fontSize:9,fontWeight:700,
                        border:`1px solid ${copied===`f-${iid}`?C.green:C.border}`,background:copied===`f-${iid}`?C.greenL:C.surfaceL,color:copied===`f-${iid}`?C.green:C.blue,cursor:"pointer" }}>{copied===`f-${iid}`?"✓ 복사":"🔐 FMS"}</button>
                        : <span style={{ fontSize:10,color:C.t4 }}>-</span>}
                    </div>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}><span style={{ fontSize:10,color:C.t3 }}>{fd(s.end)}</span></div>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}><span style={{ fontSize:11,fontWeight:700,color:ddC(dd) }}>{ddL(dd)}</span></div>
                    <div style={{ display:"flex",gap:3,alignItems:"center",justifyContent:"center" }}>
                      {[{v:b.rep,f:"rep",l:"보",ac:C.purple,bc:C.purpleL},{v:b.fmsD,f:"fmsD",l:"F",ac:C.blue,bc:C.blueL}].map(x=>(
                        <button key={x.f} onClick={()=>toggleB(s.id,bi,x.f)} style={{ width:26,height:22,borderRadius:4,fontSize:9,fontWeight:700,
                          border:`1px solid ${x.v?x.ac+"60":C.border}`,background:x.v?x.bc:C.surfaceL,color:x.v?x.ac:C.t4,cursor:"pointer" }}>{x.v?"✓":x.l}</button>
                      ))}
                      {["직납","우편"].map(dv=>(
                        <button key={dv} onClick={()=>setDel(s.id,bi,dv)} style={{ height:22,padding:"0 5px",borderRadius:4,fontSize:9,fontWeight:700,
                          border:`1px solid ${b.delivery===dv?C.green+"60":C.border}`,background:b.delivery===dv?C.greenL:C.surfaceL,color:b.delivery===dv?C.green:C.t4,cursor:"pointer" }}>{dv[0]}</button>
                      ))}
                    </div>
                    <div/>
                  </div>
                );
              })}
            </div>
          );
        })}
        {filtered.length===0 && (()=>{
          const totalDb = Object.values(db).reduce((a,hs)=>a+Object.values(hs||{}).reduce((b,arr)=>b+(arr||[]).length,0),0);
          const filterOn = stF!=="전체" || !!search;
          const bucketEmpty = schools.length===0;
          const firstFull = (()=>{ for(const y of Object.keys(db).sort((a,b)=>b-a)) for(const h of Object.keys(db[y]||{})) if((db[y]?.[h]||[]).length) return {y,h}; return null; })();
          return (
            <div style={{ textAlign:"center",padding:"40px 20px",color:C.t4 }}>
              <div style={{ fontSize:13,fontWeight:600,color:C.t3,marginBottom:6 }}>
                {bucketEmpty
                  ? `이 기간(${yr} ${half})에 등록된 현장이 없습니다.`
                  : `필터에 맞는 현장이 없습니다. (${yr} ${half} 전체 ${schools.length}개)`}
              </div>
              <div style={{ fontSize:11,color:C.t4,marginBottom:14 }}>
                전체 저장된 학교: {totalDb}개{firstFull && bucketEmpty ? ` · 데이터가 있는 기간: ${firstFull.y} ${firstFull.h}` : ""}
              </div>
              <div style={{ display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap" }}>
                {filterOn && (
                  <button onClick={()=>{ setTeamF("전체"); setStF("전체"); setSearch(""); }}
                    style={{ padding:"10px 18px",borderRadius:9,background:C.blue,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer" }}>
                    필터 모두 해제
                  </button>
                )}
                {bucketEmpty && firstFull && (
                  <button onClick={()=>{ setYr(firstFull.y); setHalf(firstFull.h); setTeamF("전체"); setStF("전체"); setSearch(""); }}
                    style={{ padding:"10px 18px",borderRadius:9,background:C.blue,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer" }}>
                    데이터 있는 기간으로 이동 ({firstFull.y} {firstFull.h})
                  </button>
                )}
              </div>
            </div>
          );
        })()}
        </div>
      </div>

      {editSc && <EditPanel sc={editSc} yr={yr} half={half} setDb={setDb} onClose={()=>setEditId(null)}/>}
      {copyOpen && <CopyHalfModal db={db} setDb={setDb} toYr={yr} toHalf={half} onClose={()=>setCopyOpen(false)} onDone={(n)=>{ setCopyOpen(false); showToast(`${n}개 현장 복사됨`); }} isMobile={isMobile}/>}
      <Toast msg={toast}/>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   엑셀 가져오기 / 내보내기 페이지
══════════════════════════════════════════════════════════════ */
function ExportImportPage({ db, setDb, saveNow }) {
  const [dragOver, setDragOver] = useState(false);
  const [parsed, setParsed] = useState(null);
  const [importing, setImporting] = useState(false);
  const [done, setDone] = useState(false);
  const [err, setErr] = useState(null);
  const [autoCarry, setAutoCarry] = useState(true);   // 상반기 완수일 7월+ → 하반기 자동 추가
  const [carryInfo, setCarryInfo] = useState(null);
  const [saveResult, setSaveResult] = useState(null); // 가져오기 후 서버 저장 결과 {ok,err,total}
  const fileRef = useRef();

  const processFile = (file) => {
    setErr(null); setParsed(null); setDone(false);
    if (!file) return;
    const r = new FileReader();
    r.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type:"array", cellDates:true });
        /* 1) 예산 시트 → 연도별 { 학교명: 금액(원) } */
        const budgetByYear = {};
        wb.SheetNames.forEach(name => {
          const ym = name.match(/(\d{2})\s*년/);
          if (!/예산/.test(name) || !ym) return;
          const yr = `20${ym[1]}`;
          const bud = parseBudget(wb.Sheets[name]);
          if (Object.keys(bud).length) budgetByYear[yr] = { ...(budgetByYear[yr]||{}), ...bud };
        });
        /* 2) 특이사항 시트 → 연도/반기별 노트 목록 */
        const notesByHalf = {};
        wb.SheetNames.forEach(name => {
          const m = name.match(/(\d{2})년\s*\(\s*([상하])\s*\)\s*특이사항/);
          if (!m) return;
          const yr=`20${m[1]}`, hf=m[2]==="상"?"상반기":"하반기";
          const ns = parseNotes(wb.Sheets[name]);
          if (ns.length) { (notesByHalf[yr] = notesByHalf[yr]||{})[hf] = ns; }
        });
        /* 3) 반기 시트 → 학교 목록 (+ 예산 매칭 + 특이사항 병합) */
        const sheets = [];
        wb.SheetNames.forEach(name => {
          const info = parseSheetName(name); if (!info) return;
          const schools = parseSheet(wb.Sheets[name]); if (!schools.length) return;
          const bud = budgetByYear[info.year] || {};
          let budHit = 0;
          schools.forEach(s => {
            const bd = bud[s.school];
            if (bd) {
              s.contract = bd.total; budHit++;
              (s.buildings||[]).forEach((b,bi) => { if (bd.items[bi]!=null && bd.items[bi]>0) b.budget = bd.items[bi]; });  // 시설별 금액(순서 매칭)
            }
          });
          const noteHit = applyNotes(schools, notesByHalf[info.year] && notesByHalf[info.year][info.half]);
          sheets.push({ name, year:info.year, half:info.half, schools, count:schools.length,
            bCount:schools.reduce((a,s)=>a+s.buildings.length,0), budHit, noteHit });
        });
        /* 4) LH 정밀 시트 → LH 전용 구분으로 (학교와 따로 관리) */
        wb.SheetNames.forEach(name => {
          if (!/lh/i.test(name)) return;
          if (/예산|특이|메모/.test(name)) return;
          const lhs = parseLHSheet(wb.Sheets[name]);
          if (!lhs.length) return;
          sheets.push({ name, year:CAT_LH, half:"정밀", schools:lhs, count:lhs.length,
            bCount:lhs.reduce((a,s)=>a+s.buildings.length,0), budHit:0, noteHit:0, isLH:true });
        });
        if (!sheets.length) { setErr('인식된 시트가 없어요. 시트 이름이 "26년(상)", "26년(하)", "26년 하반기" 같은 형식이거나, LH 시트에 "단지명" 열이 있는지 확인해주세요.'); return; }
        setParsed({ sheets, fileName:file.name, budYears:Object.keys(budgetByYear) });
      } catch(e) { setErr("파일 읽기 오류: "+e.message); }
    };
    r.readAsArrayBuffer(file);
  };

  /* 기존 학교에 가져온 학교를 병합 — 학교명+No 기준으로 매칭.
     엑셀 값(일정·학교정보·동·예산)은 갱신, 웹 전용 값(진행단계·투입인원)은 보존.
     매칭 안 되는 기존 학교는 그대로 유지 → 중복/꼬임 없이 '바뀐 부분만' 반영. */
  const mergeHalf = (existing, incoming) => {
    const ex = existing || [];
    const keyOf  = s => `${(s.school||"").trim()}|${(s.no||"").toString().trim()}`;
    const nameOf = s => (s.school||"").replace(/\s+/g,"").trim();
    const exMap = new Map(); ex.forEach(s => { if(!exMap.has(keyOf(s))) exMap.set(keyOf(s), s); });
    const usedIds = new Set();
    /* 기존 기록 찾기 — No는 반기마다 새로 매겨지므로 1순위 실패 시 학교명으로 재시도.
       (이월본이 하반기 엑셀 데이터와 중복되던 원인) */
    const takeOld = ins => {
      const exact = exMap.get(keyOf(ins));
      if (exact && !usedIds.has(exact.id)) return exact;
      const cands = ex.filter(s => nameOf(s)===nameOf(ins) && !usedIds.has(s.id));
      if (!cands.length) return null;
      return cands.find(s => s.carried) || cands[0];      // 이월본을 먼저 소진 → 실제 데이터로 대체
    };
    const merged = incoming.map(ins => {
      const old = takeOld(ins);
      if (old) {
        usedIds.add(old.id);
        return {
          ...ins,
          id: old.id,                                   // 안정적 ID 유지
          progress: old.progress || {},                 // 진행단계(웹 전용) 보존
          assignees: (ins.assignees && ins.assignees.length) ? ins.assignees : (old.assignees || []),
          headcount: old.headcount || ins.headcount || 2,
          contract: (ins.contract!=null && ins.contract>0) ? ins.contract : (old.contract ?? null),  // 예산 갱신/보존
          tel: (ins.tel||"").trim() || old.tel || "",    // 연락처(웹에서 입력) 보존
          flags: (ins.flags && ins.flags.length) ? ins.flags : (old.flags || []),
        };
      }
      return ins;                                       // 신규 학교
    });
    const leftovers = ex.filter(s => !usedIds.has(s.id));   // 엑셀에 없던 기존 학교 → 유지
    return { merged: merged.concat(leftovers), matched: usedIds.size, added: incoming.length - usedIds.size, kept: leftovers.length };
  };

  const doImport = () => {
    if (!parsed) return;
    setImporting(true);
    setTimeout(() => {
      let carryReport = [];
      /* 현재 db 기준으로 최종 결과(next) 계산 */
      const next = { ...(db||{}) };
      parsed.sheets.forEach(sh => {
        next[sh.year] = { ...(next[sh.year]||{}) };
        const { merged } = mergeHalf(next[sh.year][sh.half], sh.schools);
        next[sh.year][sh.half] = merged;
      });
      /* 상반기 완수일이 7월 이후(같은 해 하반기)인 현장 → 하반기에 자동 추가 (날짜·진행 그대로 이월) */
      if (autoCarry) {
        Object.keys(next).forEach(yr => {
          const first = next[yr]?.["상반기"] || [];
          if (!first.length) return;
          const carry = first.filter(s => {
            if (!s.end) return false;
            const ey = String(s.end).slice(0,4); const mo = parseInt(String(s.end).slice(5,7),10);
            return ey===String(yr) && mo>=7 && mo<=12;
          });
          if (!carry.length) return;
          /* No는 반기마다 새로 매겨지므로 학교명(표기 차이 무시)으로 대조해야 이월본과 실제 데이터가 안 겹친다 */
          const nameOf = normSchool;
          let dest = dedupeBucket(next[yr]["하반기"] || []);
          const realNames    = new Set(dest.filter(d=>!d.carried).map(nameOf));
          const carriedByName = new Map(dest.filter(d=>d.carried).map(d=>[nameOf(d), d]));
          let n = 0, ci = 0;
          carry.forEach(s => {
            const nm = nameOf(s);
            if (realNames.has(nm)) return;                    // 하반기에 실제 데이터가 있으면 이월하지 않음
            const fresh = {
              ...s,
              carried: true,
              progress: {},                                                                   // 진행단계 초기화
              buildings: (s.buildings||[]).map(b=>({ ...b, rep:false, fmsD:false, delivery:null })),  // 보고서·FMS·납품 미완으로
            };
            const prev = carriedByName.get(nm);
            if (prev) { carriedByName.set(nm, { ...fresh, id: prev.id, assignees: prev.assignees || fresh.assignees }); n++; }   // 기존 이월본 갱신(id·인원 유지)
            else {
              const add = { ...fresh, id: `carry-${Date.now().toString(36)}-${(ci++).toString(36)}-${Math.random().toString(36).slice(2,6)}` };
              carriedByName.set(nm, add); n++;
            }
          });
          if (n) {
            next[yr]["하반기"] = dest.filter(d=>!d.carried).concat(Array.from(carriedByName.values()));
            carryReport.push({ yr, n });
          } else if (dest.length !== (next[yr]["하반기"]||[]).length) {
            next[yr]["하반기"] = dest;                        // 중복 이월본만 정리된 경우
          }
        });
      }

      /* 가져온 결과 전체를 자동 중복 정리 (같은 현장이 두 번 올라가지 않게) */
      const beforeCnt = countSchools(next);
      Object.keys(next).forEach(yr => {
        next[yr] = { ...next[yr] };
        Object.keys(next[yr]||{}).forEach(hf => { next[yr][hf] = dedupeBucket(next[yr][hf] || []); });
      });
      const dedupRemoved = beforeCnt - countSchools(next);

      setDb(next);                                  // 화면 반영
      parsed.sheets.forEach(sh => logAction("수정", `엑셀 병합 · ${sh.year} ${sh.half}`, null, `${sh.count}개 학교 / ${sh.bCount}개 동${sh.budHit?` / 예산 ${sh.budHit}건`:""}${sh.noteHit?` / 특이사항 ${sh.noteHit}건`:""}`));
      carryReport.forEach(c => logAction("추가", `하반기 자동 이월 · ${c.yr}`, null, `상반기 완수일 7월 이후 ${c.n}개 → 하반기`));
      setCarryInfo(carryReport.length ? carryReport : null);

      /* 자동 effect에 의존하지 않고, 여기서 직접 서버에 저장하고 결과 확인 */
      const finish = (ok, err) => { setImporting(false); setDone(true); setParsed(null); setSaveResult({ ok, err, total:countSchools(next), dedup:dedupRemoved }); };
      if (saveNow) {
        Promise.resolve(saveNow(next)).then(()=>finish(true)).catch(e=>finish(false,(e&&e.message)||String(e)));
      } else { finish(true); }
    }, 400);
  };

  const doExport = (yr, half) => {
    const schools = db[yr]?.[half]; if (!schools) return;
    const wb = XLSX.utils.book_new();
    const sn = `${yr.slice(2)}년(${half==="상반기"?"상":"하"})`;
    const entries = [{ yr, half, schools }];
    XLSX.utils.book_append_sheet(wb, buildSheet(schools), sn);                       // 시설물 리스트
    XLSX.utils.book_append_sheet(wb, buildCalendarSheet(entries), "현장일정");          // 현장일정(달력)
    XLSX.utils.book_append_sheet(wb, buildScheduleSheet(entries), "현장일정(목록)");     // 현장일정(목록)
    XLSX.utils.book_append_sheet(wb, buildBudgetSheet(entries), "예산표");             // 예산표
    XLSX.utils.book_append_sheet(wb, buildNotesSheet(entries), "특이사항");            // 특이사항
    XLSX.writeFile(wb, `시설물_리스트_${yr}_${half}.xlsx`);
  };
  const doExportAll = () => {
    const wb = XLSX.utils.book_new();
    const entries = [];
    Object.entries(db).forEach(([yr,hs]) => Object.entries(hs).forEach(([half,schools]) => {
      XLSX.utils.book_append_sheet(wb, buildSheet(schools), `${yr.slice(2)}년(${half==="상반기"?"상":"하"})`);
      entries.push({ yr, half, schools });
    }));
    if (!entries.length) return;
    XLSX.utils.book_append_sheet(wb, buildCalendarSheet(entries), "현장일정");          // 전체 현장일정(달력)
    XLSX.utils.book_append_sheet(wb, buildScheduleSheet(entries), "현장일정(목록)");     // 전체 현장일정(목록)
    XLSX.utils.book_append_sheet(wb, buildBudgetSheet(entries), "예산표");             // 전체 예산표
    XLSX.utils.book_append_sheet(wb, buildNotesSheet(entries), "특이사항");            // 전체 특이사항
    XLSX.writeFile(wb, "시설물_리스트_전체.xlsx");
  };

  const totalS = Object.values(db).flatMap(h=>Object.values(h)).flatMap(s=>s).length;
  const totalB = Object.values(db).flatMap(h=>Object.values(h)).flatMap(s=>s).flatMap(s=>s.buildings).length;

  return (
    <div style={{ maxWidth:720,margin:"0 auto" }}>
      <div style={{ marginBottom:24 }}>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,fontWeight:600,marginBottom:3 }}>IMPORT / EXPORT</div>
        <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>엑셀 가져오기 · 내보내기</h1>
        <div style={{ fontSize:12,color:C.t3,marginTop:4 }}>기존 엑셀을 올리면 팀·연도·상하반기를 자동 인식해서 반영해요</div>
      </div>

      <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:24 }}>
        {[{l:"저장된 학교",v:totalS,c:C.blue},{l:"저장된 동",v:totalB,c:C.green},{l:"관리 기간",v:Object.values(db).flatMap(h=>Object.keys(h)).length,c:C.orange}].map(x=>(
          <div key={x.l} style={{ padding:"14px 16px",background:C.surface,border:BD,borderTop:`2px solid ${x.c}`,borderRadius:10 }}>
            <div style={{ fontSize:22,fontWeight:900,color:x.c }}>{x.v}</div>
            <div style={{ fontSize:11,color:C.t3,marginTop:4 }}>{x.l}</div>
          </div>
        ))}
      </div>

      <div style={{ background:C.surface,border:BD,borderRadius:14,overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.05)",marginBottom:18 }}>
        <div style={{ padding:"16px 20px",borderBottom:BD,display:"flex",alignItems:"center",gap:10 }}>
          <span style={{ fontSize:20 }}>📥</span>
          <div><div style={{ fontSize:14,fontWeight:800,color:C.t1 }}>엑셀 업로드</div>
            <div style={{ fontSize:11,color:C.t3,marginTop:1 }}>시트 이름이 "26년(상)" 형식이면 자동 인식</div></div>
        </div>
        <div style={{ padding:20 }}>
          {!parsed && !done && (
            <div onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
              onDrop={e=>{e.preventDefault();setDragOver(false);processFile(e.dataTransfer.files[0]);}}
              onClick={()=>fileRef.current?.click()}
              style={{ padding:"36px 20px",borderRadius:12,cursor:"pointer",textAlign:"center",
                border:`2px dashed ${dragOver?C.blue:C.borderD}`,background:dragOver?C.blueL:C.surfaceL,transition:"all .15s" }}>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{ display:"none" }} onChange={e=>processFile(e.target.files[0])}/>
              <div style={{ fontSize:36,marginBottom:10 }}>📂</div>

/* Firebase config → 인원 명단(MEMBERS) 갱신 */
function applyConfig(cfg) {
  if (!cfg || !cfg.members) return;
  /* members 는 배열이거나, 예전 형식({팀:[이름]})일 수 있음 — 모두 평탄화 */
  const flat = [];
  const push = n => { const nm = String(n||"").trim(); if (nm && !flat.includes(nm)) flat.push(nm); };
  if (Array.isArray(cfg.members)) cfg.members.forEach(push);
  else if (typeof cfg.members === "object") Object.values(cfg.members).forEach(v => toArr(v).forEach(push));
  if (flat.length) { MEMBERS.length = 0; flat.forEach(n => MEMBERS.push(n)); }
}

/* 객체-키 ↔ 배열 변환 */
const toArr = v => Array.isArray(v) ? v : (v && typeof v==="object" ? Object.values(v) : []);

/* Firebase(키잉 객체) → 화면용 배열 db */
function fbToDb(raw) {
  if (!raw || typeof raw !== "object") return null;
  const out = {};
  Object.entries(raw).forEach(([yr, halves]) => {
    out[yr] = {};
    Object.entries(halves||{}).forEach(([half, schoolsObj]) => {
      out[yr][half] = toArr(schoolsObj).filter(Boolean).map(s => ({
        ...s,
        assignees: toArr(s.assignees),
        buildings: toArr(s.buildings).filter(Boolean),
      })).sort((a,b) => {
        const na = parseInt(a.no,10), nb = parseInt(b.no,10);
        if (!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
        return String(a.id).localeCompare(String(b.id));
      });
    });
  });
  return out;
}

/* 화면용 배열 db → Firebase(키잉 객체) — 초기 시드용 */
function dbToFb(db) {
  const out = {};
  Object.entries(db).forEach(([yr, halves]) => {
    out[yr] = {};
    Object.entries(halves).forEach(([half, schools]) => {
      out[yr][half] = {};
      schools.forEach(s => { out[yr][half][s.id] = stripUndefined(s); });
    });
  });
  return out;
}

/* 두 db를 학교 단위로 비교 → 변경된 경로만 추출 (부분 저장용)
   결과: { "2026/상반기/26u1": {school} | null(삭제) } */
/* Firebase는 undefined 값을 거부(전체 저장 실패) → 재귀적으로 제거 */
function stripUndefined(v) {
  if (Array.isArray(v)) return v.map(stripUndefined);
  if (v && typeof v === "object") {
    const o = {};
    for (const k in v) {
      if (v[k] === undefined) continue;
      /* Firebase 키 금지 문자(. $ # [ ] / 와 제어문자) → _ 로 치환해야 저장이 거부되지 않음 */
      const safeK = String(k).replace(/[.$#\[\]\/\u0000-\u001F\u007F]/g, "_");
      o[safeK] = stripUndefined(v[k]);
    }
    return o;
  }
  if (typeof v === "number" && !isFinite(v)) return null;   // NaN/Infinity → null (Firebase가 거부 → 전체 저장 실패 방지)
  return v;
}
function countSchools(db) {
  let n = 0;
  Object.values(db||{}).forEach(hs => Object.values(hs||{}).forEach(a => { n += (a||[]).length; }));
  return n;
}

/* 두 db를 학교 단위로 비교 → 바뀐 경로만 추출 (부분 저장).
   - 추가/수정된 학교: "yr/half/id" → 학교객체
   - 삭제된 학교(이전엔 있었는데 지금 없음): "yr/half/id" → null (명시적 삭제)
   전체 트리를 .set()으로 덮어쓰지 않으므로, 다른 기기가 모르는 데이터(예: 다른 기기가 추가한 하반기)를
   실수로 지우는 일이 없음. 삭제는 null로 명시 → 되살아나지 않음. */
function flatMapDb(db) {
  const m = {};
  const safe = s => String(s).replace(/[.$#\[\]\/\u0000-\u001F\u007F]/g, "_");
  Object.entries(db||{}).forEach(([yr,hs]) => Object.entries(hs||{}).forEach(([half,arr]) => {
    (arr||[]).forEach(s => { if (s && s.id != null) m[`${safe(yr)}/${safe(half)}/${safe(s.id)}`] = s; });
  }));
  return m;
}
function diffPaths(prev, next) {
  const updates = {};
  const pm = flatMapDb(prev), nm = flatMapDb(next);
  for (const k in nm) {
    const cur = stripUndefined(nm[k]);
    if (!(k in pm) || JSON.stringify(stripUndefined(pm[k])) !== JSON.stringify(cur)) updates[k] = cur;
  }
  for (const k in pm) { if (!(k in nm)) updates[k] = null; }   // 삭제 → null
  return updates;
}
/* 원격(Firebase) db를 로컬에 병합 — 로컬 학교를 절대 삭제하지 않고, 같은 ID는 원격으로 갱신,
   원격에만 있는 학교는 추가. → 어떤 echo가 와도 화면에서 학교가 사라지지 않음. */
function mergeRemote(local, remote) {
  const out = {};
  Object.entries(local || {}).forEach(([yr, hs]) => {
    out[yr] = {}; Object.entries(hs || {}).forEach(([h, arr]) => { out[yr][h] = (arr||[]).slice(); });
  });
  let changed = false;
  Object.entries(remote || {}).forEach(([yr, hs]) => {
    out[yr] = out[yr] || {};
    Object.entries(hs || {}).forEach(([h, rArr]) => {
      const cur = out[yr][h] || [];
      const idx = {}; cur.forEach((s,i) => { idx[s.id] = i; });
      const merged = cur.slice();
      (rArr || []).forEach(rs => {
        if (idx[rs.id] != null) {
          if (JSON.stringify(merged[idx[rs.id]]) !== JSON.stringify(rs)) { merged[idx[rs.id]] = rs; changed = true; }
        } else { merged.push(rs); changed = true; }
      });
      out[yr][h] = merged;
    });
  });
  return { db: out, changed };
}
function diffDb(prev, next) {
  const updates = {};
  const pv = prev || {};
  Object.entries(next).forEach(([yr, halves]) => {
    Object.entries(halves).forEach(([half, schools]) => {
      const prevArr = pv[yr]?.[half] || [];
      const prevById = {};
      prevArr.forEach(s => { prevById[s.id] = s; });
      schools.forEach(s => {
        const before = prevById[s.id];
        if (!before || JSON.stringify(before) !== JSON.stringify(s)) {
          updates[`${yr}/${half}/${s.id}`] = stripUndefined(s);    // undefined 제거 후 저장
        }
        delete prevById[s.id];
      });
      Object.keys(prevById).forEach(id => { updates[`${yr}/${half}/${id}`] = null; });
    });
  });
  return updates;
}

              <div style={{ fontSize:13,fontWeight:800,color:C.t1 }}>📝 최근 수정 내역</div>
              <span style={{ marginLeft:8,fontSize:10,color:C.t4 }}>{logs.length}건</span>
            </div>
            {logs.length===0 && <div style={{ fontSize:12,color:C.t4,padding:"20px 0",textAlign:"center" }}>아직 기록된 수정 내역이 없습니다.</div>}
            <div style={{ display:"flex",flexDirection:"column",gap:6,maxHeight:420,overflowY:"auto" }}>
              {logs.map(l=>(
                <div key={l.id} style={{ display:"flex",alignItems:"flex-start",gap:10,padding:"9px 11px",background:C.surfaceL,borderRadius:8,border:BD }}>
                  <span style={{ fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:4,flexShrink:0,
                    background:actColor(l.action)+"18",color:actColor(l.action),border:`1px solid ${actColor(l.action)}30` }}>{l.action}</span>
                  <div style={{ flex:1,minWidth:0 }}>
                    <div style={{ fontSize:12,fontWeight:700,color:C.t1 }}>{l.target}</div>
                    {(l.before || l.after) && (
                      <div style={{ fontSize:10,color:C.t3,marginTop:2,wordBreak:"break-all" }}>
                        {l.before && <span style={{ color:C.t4 }}>{l.before}</span>}
                        {l.before && l.after && <span style={{ color:C.t4 }}> → </span>}
                        {l.after && <span style={{ color:C.t2 }}>{l.after}</span>}
                      </div>
                    )}
                    <div style={{ fontSize:9,color:C.t4,marginTop:3 }}>{l.by}{l.email?` (${l.email})`:""} · {fmtTs(l.ts)}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ fontSize:9,color:C.t4,marginTop:10 }}>* 로그는 표시 전용이며 일반 사용자는 수정·삭제할 수 없습니다.</div>
          </div>

          {/* 매출 관리 (관리자 전용) */}
          <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"16px 18px",marginTop:14 }}>
            <div style={{ fontSize:13,fontWeight:800,color:C.t1,marginBottom:4 }}>💰 매출 관리</div>
            <div style={{ fontSize:11,color:C.t3,marginBottom:12 }}>학교별 계약금액을 입력하면 자동 집계됩니다. (관리자 전용)</div>
            <div style={{ display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14 }}>
              {[{l:"총 계약금액",v:revTotal,c:C.blue},{l:"완료 금액",v:revDone,c:C.green},
                {l:"진행중",v:revIng,c:C.purple},{l:"미착수",v:revNone,c:C.t3}].map(k=>(
                <div key={k.l} style={{ background:C.surfaceL,borderRadius:10,padding:"12px 14px",borderTop:`3px solid ${k.c}` }}>
                  <div style={{ fontSize:10,color:C.t3,marginBottom:5 }}>{k.l}</div>
                  <div style={{ fontSize:16,fontWeight:800,color:k.c }}>{won(k.v)}</div>
                </div>
              ))}
            </div>
            <div style={{ maxHeight:340,overflowY:"auto",display:"flex",flexDirection:"column",gap:5 }}>
              {allSchools.map(s=>{
                      return (
                  <div key={s.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"8px 11px",background:C.surfaceL,borderRadius:8,border:BD }}>
                    <span style={{ fontSize:12,fontWeight:700,color:C.t1,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{s.school}</span>
                    <span style={{ fontSize:9,color:C.t4 }}>{s._year} {s._half}</span>
                    {revEdit===s.id ? (
                      <>
                        <input autoFocus value={revVal} onChange={e=>setRevVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveRev(s.id)}
                          placeholder="금액" style={{ width:110,padding:"5px 8px",border:BD,borderRadius:6,fontSize:12,textAlign:"right",outline:"none" }}/>
                        <button onClick={()=>saveRev(s.id)} style={{ padding:"5px 10px",borderRadius:6,background:C.green,border:"none",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer" }}>저장</button>
                      </>
                    ) : (
                      <button onClick={()=>{ setRevEdit(s.id); setRevVal(s.contract||""); }}
                        style={{ minWidth:96,textAlign:"right",padding:"5px 10px",borderRadius:6,border:`1px solid ${s.contract?C.blue+"40":C.border}`,
                          background:s.contract?C.blueL:C.surface,color:s.contract?C.blue:C.t4,fontSize:12,fontWeight:700,cursor:"pointer" }}>
                        {won(s.contract)}
                      </button>
                    )}
                  </div>
                );
              })}
              {allSchools.length===0 && <div style={{ textAlign:"center",color:C.t4,fontSize:12,padding:16 }}>학교가 없습니다.</div>}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   전체 현황 (대시보드 요약)
══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   지도 — 현장 위치를 지도에 찍어 근방에 몰린 현장 확인
   · 카카오맵 키가 있으면 학교명/주소로 실제 위치를 찾아 표시(한 번 찾은 위치는 서버에 저장)
   · 키가 없어도 지역 기준 대략 위치로 분포를 볼 수 있음
   ══════════════════════════════════════════════════════════════ */
function MapPage({ db, setDb, allSchools, kakaoKey, isMobile }) {
  /* 최근 시기가 앞으로 — 지금이 26년 하반기면 26하 → 26상 → 25하 … 순, LH는 맨 뒤 */
  const buckets = useMemo(() => {
    const out = [];
    Object.keys(db||{}).forEach(y => Object.keys(db[y]||{}).forEach(h => {
      if ((db[y][h]||[]).length) out.push({ y, h });
    }));
    const rank = b => isLH(b.y) ? -1 : (parseInt(b.y,10)||0)*2 + (b.h==="하반기" ? 1 : 0);
    return out.sort((a,b) => rank(b) - rank(a));
  }, [db]);
  const [sel, setSel] = useState(null);
  const cur = sel || buckets[0] || null;
  const [geo, setGeo] = useState({});            // 학교키 → {lat,lng}
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [picked, setPicked] = useState(null);    // 마커 클릭한 현장
  const [onlySoon, setOnlySoon] = useState(false);
  const [showLabels, setShowLabels] = useState(true);   // 핀 위에 날짜 라벨 표시
  const [undoStack, setUndoStack] = useState([]);       // 핀 이동 되돌리기
  const [editId, setEditId] = useState(null);           // 지도에서 바로 수정
  const [placeQ, setPlaceQ] = useState("");             // 위치 지정용 장소 검색어
  const [placeHits, setPlaceHits] = useState(null);     // 장소 검색 결과
  const [pickMode, setPickMode] = useState(false);      // 지도 눌러서 위치 찍기
  const [ready, setReady] = useState(false);     // 지도 생성 완료 여부
  const [q, setQ] = useState("");                // 현장 검색어
  const [focusId, setFocusId] = useState(null);  // 검색으로 이동할 현장
  const [diag, setDiag] = useState({ step:"대기 중", markers:0 });
  const mapRef = useRef(null), boxRef = useRef(null), clRef = useRef(null), kkRef = useRef(null);
  const stopRef = useRef(false), fitRef = useRef(false), autoRef = useRef({});
  const ovRef = useRef([]), labelOnRef = useRef(true), zoomBoundRef = useRef(false);
  const pickRef = useRef(null), clickBoundRef = useRef(false);

  const sites = useMemo(() => {
    if (!cur) return [];
    let list = (db[cur.y] && db[cur.y][cur.h]) || [];
    if (onlySoon) list = list.filter(s => { const d = calcDday(s.end); return d!==null && d<=30; });
    return list;
  }, [db, cur, onlySoon]);

  /* 이름으로 현장 찾기 — 반기를 몰라도 전체에서 찾아준다 */
  const matches = useMemo(() => {
    const key = normSchool(q);
    if (!key || key.length < 1) return [];
    const out = [];
    Object.keys(db||{}).forEach(y => Object.keys(db[y]||{}).forEach(h => {
      (db[y][h]||[]).forEach(s2 => {
        const nm = normSchool(s2.school);
        if (!nm.includes(key)) return;
        out.push({ s:s2, y, h, score: nm.startsWith(key) ? 0 : 1 });
      });
    }));
    return out.sort((a,b)=> a.score-b.score || a.s.school.length-b.s.school.length).slice(0, 8);
  }, [db, q]);

  /* 검색 결과 선택 → 그 반기로 옮기고 지도 확대 */
  const goTo = (m) => {
    setQ("");
    if (!cur || cur.y!==m.y || cur.h!==m.h) setSel({ y:m.y, h:m.h });
    fitRef.current = true;              // 전체보기로 되돌아가지 않게
    setFocusId(m.s.id);
    setPicked(m.s);
  };

  /* 저장된 좌표 불러오기 */
  useEffect(() => {
    try {
      const r = firebase.database().ref(FB_GEO);
      const cb = r.on("value", sn => setGeo(sn.val() || {}));
      return () => r.off("value", cb);
    } catch { return undefined; }
  }, []);

  /* 지도 띄우기 */
  useEffect(() => {
    if (!kakaoKey) { setDiag({ step:"키 없음", markers:0 }); return; }
    let dead = false;
    setDiag(d => ({ ...d, step:"지도 파일 불러오는 중…" }));
    loadKakao(kakaoKey).then(kakao => {
      if (dead) return;
      kkRef.current = kakao;
      setDiag(d => ({ ...d, step:"지도 만드는 중…" }));
      /* 지도 넣을 자리가 아직 안 그려졌을 수 있어 준비될 때까지 기다린다 */
      const make = () => {
        if (dead) return;
        if (!boxRef.current) { setTimeout(make, 60); return; }
        try {
          if (!mapRef.current) {
            mapRef.current = new kakao.maps.Map(boxRef.current, {
              center: new kakao.maps.LatLng(37.4138, 127.0180), level: 10,
            });
          }
          setTimeout(() => { try { mapRef.current.relayout(); } catch {} }, 120);   // 크기 잡히면 다시 그리기
          /* 지도를 눌러 위치를 직접 찍는 모드 */
          if (!clickBoundRef.current) {
            kakao.maps.event.addListener(mapRef.current, "click", (me) => {
              const target = pickRef.current;
              if (!target) return;
              const ll = me.latLng;
              saveGeo(target.school, { lat:ll.getLat(), lng:ll.getLng(), src:"manual", at:Date.now() });
              setStatus(`${target.school} 위치를 지도에서 지정했어요.`);
              pickRef.current = null; setPickMode(false);
            });
            clickBoundRef.current = true;
          }
          setReady(true); setErr(null);
          setDiag(d => ({ ...d, step:"지도 준비 완료" }));
        } catch(e) {
          setErr((e&&e.message)||String(e));
          setDiag(d => ({ ...d, step:"지도 생성 실패" }));
        }
      };
      make();
    }).catch(e => { setErr((e&&e.message)||String(e)); setDiag(d => ({ ...d, step:"불러오기 실패" })); });
    return () => { dead = true; };
  }, [kakaoKey]);

  /* 위치 저장 — 되돌릴 수 있게 이전 값을 기억해 둔다 */
  const saveGeo = (school, val, { remember = true } = {}) => {
    const k = normSchool(school);
    if (remember) setUndoStack(st => [{ k, school, prev: geo[k] || null }, ...st].slice(0, 20));
    setGeo(prev => { const n = { ...prev }; if (val) n[k] = val; else delete n[k]; return n; });
    try {
      const ref = firebase.database().ref(FB_GEO).child(k);
      if (val) ref.set(stripUndefined(val)).catch(()=>{}); else ref.remove().catch(()=>{});
    } catch {}
  };
  const undoMove = () => {
    const top = undoStack[0]; if (!top) return;
    setUndoStack(st => st.slice(1));
    saveGeo(top.school, top.prev, { remember:false });
    setStatus(`${top.school} 위치를 되돌렸어요.`);
  };

  const posOf = useCallback((s) => {
    const g = geo[normSchool(s.school)];
    if (g && g.lat && g.lng) return { lat:g.lat, lng:g.lng, exact:true, manual:g.src==="manual" };
    const rx = regionXY(s.region);
    if (!rx) return null;
    const [dy,dx] = jitter(s.school);
    return { lat:rx[0]+dy, lng:rx[1]+dx, exact:false };
  }, [geo]);

  /* 이동 대상이 정해지면 그 위치로 확대 (반기 전환 후 마커가 다시 그려진 뒤 실행) */
  useEffect(() => {
    if (!focusId || !ready) return;
    const map = mapRef.current, kakao = kkRef.current;
    if (!map || !kakao) return;
    const target = sites.find(x => x.id === focusId);
    if (!target) return;               // 아직 반기 전환 중
    const p = posOf(target);
    if (p) {
      const ll = new kakao.maps.LatLng(p.lat, p.lng);
      try { map.setLevel(p.exact ? 3 : 6); map.panTo(ll); } catch {}
      setPicked({ ...target, _exact:p.exact });
      setStatus(p.exact ? `${target.school} 위치로 이동했어요.`
                        : `${target.school} — 정확한 위치를 못 찾아 지역 기준으로 이동했어요. 핀을 끌어 맞춰 주세요.`);
    }
    setFocusId(null);
  }, [focusId, ready, sites, posOf]);


  /* 라벨(현장조사일·완수일)은 확대했을 때만 보이게 — 멀리서 보면 글자가 겹쳐 지저분해짐 */
  const LABEL_LEVEL = 6;
  const applyLabels = useCallback(() => {
    const map = mapRef.current; if (!map) return;
    const on = labelOnRef.current && map.getLevel() <= LABEL_LEVEL;
    ovRef.current.forEach(ov => { try { ov.setMap(on ? map : null); } catch {} });
  }, []);
  useEffect(() => { labelOnRef.current = showLabels; applyLabels(); }, [showLabels, applyLabels]);

  /* 마커 그리기 — 파란 핀=정확한 위치, 회색 핀=지역 기준 대략 위치. 핀을 끌어서 직접 고칠 수 있음 */
  useEffect(() => {
    const kakao = kkRef.current, map = mapRef.current;
    if (!ready || !kakao || !map) return;
    if (clRef.current) clRef.current.clear();
    ovRef.current.forEach(ov => { try { ov.setMap(null); } catch {} });
    ovRef.current = [];

    const pin = (color) => new kakao.maps.MarkerImage(
      "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
           <path d="M13 0C5.8 0 0 5.8 0 13c0 9.3 13 21 13 21s13-11.7 13-21C26 5.8 20.2 0 13 0z" fill="${color}"/>
           <circle cx="13" cy="12.5" r="4.6" fill="#fff"/></svg>`),
      new kakao.maps.Size(26, 34), { offset: new kakao.maps.Point(13, 34) }
    );
    const exactPin = pin("#1D6FF2"), roughPin = pin("#9AA5B4"), manualPin = pin("#0D9B6C");
    const esc = t => String(t==null?"":t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const md = v => { const a=String(v||"").split("-"); return a.length===3 ? `${a[1]}-${a[2]}` : ""; };

    const markers = [];
    const bounds = new kakao.maps.LatLngBounds();
    let any = false, nExact = 0;
    sites.forEach(s => {
      const p = posOf(s); if (!p) return;
      any = true; if (p.exact) nExact++;
      const ll = new kakao.maps.LatLng(p.lat, p.lng);
      bounds.extend(ll);
      const mk = new kakao.maps.Marker({ position: ll, title: s.school,
        image: p.manual ? manualPin : p.exact ? exactPin : roughPin, draggable: true });
      kakao.maps.event.addListener(mk, "click", () => setPicked({ ...s, _exact:p.exact, _manual:p.manual }));
      kakao.maps.event.addListener(mk, "dragend", () => {
        const q2 = mk.getPosition();
        saveGeo(s.school, { lat:q2.getLat(), lng:q2.getLng(), src:"manual", at:Date.now() });
        setStatus(`${s.school} 위치를 직접 지정했어요. 되돌리려면 아래 '되돌리기'를 누르세요.`);
      });
      markers.push(mk);

      /* 핀 위 라벨 — 현장명 + 현장조사일 · 완수일(D-day) */
      const dd = calcDday(s.end);
      const parts = [];
      if (s.field) parts.push(`조사 ${md(s.field)}`);
      if (s.end)   parts.push(`완수 ${md(s.end)}${dd!==null?` (${dd>=0?`D-${dd}`:`D+${-dd}`})`:""}`);
      const urgent = dd!==null && dd<=7;
      const sub = parts.join(" · ") || "일정 미정";
      const html =
        `<div style="transform:translateY(-38px);white-space:nowrap;background:#fff;` +
        `border:1px solid ${urgent?"#D64545":"#D5DEEA"};border-radius:6px;padding:3px 8px;` +
        `box-shadow:0 2px 7px rgba(20,30,50,.16);font-family:Pretendard,'맑은 고딕',sans-serif;pointer-events:none">` +
        `<div style="font-size:11px;font-weight:800;color:#1A2332">${esc(s.school)}</div>` +
        `<div style="font-size:10px;font-weight:600;color:${urgent?"#D64545":"#5A6478"};margin-top:1px">${esc(sub)}</div>` +
        `</div>`;
      const ov = new kakao.maps.CustomOverlay({ position: ll, content: html, yAnchor: 1, zIndex: 3, clickable: false });
      ovRef.current.push(ov);
    });

    if (!clRef.current) {
      clRef.current = new kakao.maps.MarkerClusterer({ map, averageCenter:true, minLevel:7, gridSize:70 });
    }
    clRef.current.addMarkers(markers);
    setDiag(d => ({ ...d, markers: markers.length, exact: nExact }));

    /* 확대/축소할 때 라벨 표시 여부 갱신 (한 번만 등록) */
    if (!zoomBoundRef.current) {
      kakao.maps.event.addListener(map, "zoom_changed", () => applyLabels());
      zoomBoundRef.current = true;
    }
    applyLabels();

    if (any && !fitRef.current) { try { map.setBounds(bounds); fitRef.current = true; } catch {} }
  }, [sites, posOf, ready, applyLabels]);

  /* 정확한 위치 찾기
     · 그 현장의 '지역'을 중심으로 반경 안에서만 검색 → 같은 이름의 다른 도시 학교를 잡지 않음
     · 결과가 지역에서 너무 멀면 버림
     · 이름을 여러 형태로 바꿔가며 시도 (괄호/외 N개소 등 제거) */
  const runGeocode = async (onlyIds, opts = {}) => {
    const kakao = kkRef.current;
    if (!kakao) { setErr("지도가 아직 준비되지 않았어요."); return; }
    let todo;
    if (onlyIds) {
      todo = sites.filter(s => onlyIds.includes(s.id));          // 특정 현장만 강제 재검색
    } else if (opts.includeFailed) {
      todo = sites.filter(s => { const g = geo[normSchool(s.school)]; return !(g && g.lat); });   // 못 찾은 것 재시도
    } else {
      todo = sites.filter(s => !geo[normSchool(s.school)]);      // 한 번도 시도 안 한 것만 (자동)
    }
    if (!todo.length) { setStatus("찾을 대상이 없어요. 모든 현장의 위치가 정해져 있습니다."); return; }
    setBusy(true); setErr(null); stopRef.current = false;
    const places = new kakao.maps.services.Places();
    const coder  = new kakao.maps.services.Geocoder();

    /* 이름에서 검색을 방해하는 부분 제거 */
    const variants = (name) => {
      const raw = String(name||"").trim();
      const v = [raw];
      const cut = raw
        .replace(/\s*외\s*\d+\s*개?소.*$/,"")     // "오산대교 외 3개소" → "오산대교"
        .replace(/\([^)]*\)/g,"")                  // 괄호 내용 제거
        .replace(/\[[^\]]*\]/g,"")
        .replace(/\s*\d+\s*동$/,"")                // 끝의 "3동"
        .trim();
      if (cut && cut!==raw) v.push(cut);
      const noSuffix = cut.replace(/(초|중|고)$/,"");
      if (noSuffix && noSuffix!==cut && noSuffix.length>=2) v.push(noSuffix);
      return [...new Set(v.filter(Boolean))];
    };

    const lookup = (site) => new Promise(res => {
      const rx = regionXY(site.region);
      const center = rx ? new kakao.maps.LatLng(rx[0], rx[1]) : null;
      const okNear = (lat,lng) => !rx || distKm([lat,lng], rx) <= 35;   // 지역에서 35km 넘으면 오검색으로 간주

      const tryNames = (list, i) => {
        if (i >= list.length) return res(null);
        const opt = center ? { location:center, radius:20000, sort:kakao.maps.services.SortBy.DISTANCE } : {};
        places.keywordSearch(list[i], (r, st) => {
          if (st === kakao.maps.services.Status.OK && r && r.length) {
            const hit = r.find(x => okNear(+x.y, +x.x)) || null;
            if (hit) return res({ lat:+hit.y, lng:+hit.x });
          }
          tryNames(list, i+1);
        }, opt);
      };

      /* 주소가 있으면 주소 우선 (LH 단지) */
      if (site.addr) {
        coder.addressSearch(site.addr, (r, st) => {
          if (st === kakao.maps.services.Status.OK && r && r[0] && okNear(+r[0].y, +r[0].x)) {
            return res({ lat:+r[0].y, lng:+r[0].x });
          }
          tryNames(variants(site.school).map(n => `${n} ${site.region||""}`.trim()), 0);
        });
        return;
      }
      /* 지역명을 붙인 형태와 안 붙인 형태를 모두 시도 */
      const names = variants(site.school);
      const queries = [...names.map(n => `${n} ${site.region||""}`.trim()), ...names];
      tryNames([...new Set(queries)], 0);
    });

    const found = {};
    let ok = 0;
    for (let i=0; i<todo.length; i++) {
      if (stopRef.current) { setStatus(`중단했어요 (${i}/${todo.length} 진행)`); break; }
      const s2 = todo[i];
      const k2 = normSchool(s2.school);
      /* 직접 옮겨 둔 위치는 덮어쓰지 않음 (특정 현장을 콕 집어 다시 찾을 때만 예외) */
      if (!onlyIds && geo[k2] && geo[k2].src === "manual") continue;
      setStatus(`위치 찾는 중… ${i+1}/${todo.length} · ${s2.school}`);
      try {
        const hit = await lookup(s2);
        if (hit) { found[k2] = { ...hit, src:"search", at:Date.now() }; ok++; }
        else     { found[k2] = { fail:true, at:Date.now() }; }    // 못 찾음도 기록 → 매번 다시 찾지 않음
      } catch { found[k2] = { fail:true, at:Date.now() }; }
      await new Promise(r => setTimeout(r, 80));
    }
    if (Object.keys(found).length) {
      try { await firebase.database().ref(FB_GEO).update(stripUndefined(found)); }
      catch(e){ setErr("위치 저장 실패: "+((e&&e.message)||e)); }
      setGeo(p => ({ ...p, ...found }));
    }
    setBusy(false);
    if (!stopRef.current) {
      const failN = todo.length - ok;
      setStatus(`완료 — ${ok}개 정확한 위치를 찾았어요${failN?` · ${failN}개는 이름으로 못 찾아 지역 기준(회색 핀)으로 표시` : ""}`);
    }
  };

  /* 지도가 준비되면 좌표 없는 현장을 자동으로 찾아준다 (반기별 1회) */
  useEffect(() => {
    if (!ready || busy || !cur) return;
    const key = `${cur.y}-${cur.h}`;
    if (autoRef.current[key]) return;
    const missing = sites.filter(s => !geo[normSchool(s.school)]).length;
    if (!missing) return;
    autoRef.current[key] = true;
    const t = setTimeout(() => runGeocode(), 600);
    return () => clearTimeout(t);
  }, [ready, busy, cur, sites, geo]);

  /* 이름이나 주소로 위치 찾아 지정 — 못 찾은 현장을 손으로 잡아줄 때 */
  const searchPlace = () => {
    const kakao = kkRef.current; const q2 = (placeQ||"").trim();
    if (!kakao || !q2) return;
    const rx = picked ? regionXY(picked.region) : null;
    const center = rx ? new kakao.maps.LatLng(rx[0], rx[1]) : null;
    const places = new kakao.maps.services.Places();
    const coder  = new kakao.maps.services.Geocoder();
    setPlaceHits("loading");
    const opt = center ? { location:center, radius:20000, sort:kakao.maps.services.SortBy.DISTANCE } : {};
    places.keywordSearch(q2, (r, st) => {
      let list = (st === kakao.maps.services.Status.OK && r) ? r.slice(0,6).map(x=>({
        name:x.place_name, addr:x.road_address_name || x.address_name, lat:+x.y, lng:+x.x
      })) : [];
      /* 장소로 못 찾으면 주소로 한 번 더 */
      if (!list.length) {
        coder.addressSearch(q2, (r2, st2) => {
          if (st2 === kakao.maps.services.Status.OK && r2 && r2.length) {
            list = r2.slice(0,6).map(x=>({ name:x.address_name, addr:x.road_address ? x.road_address.address_name : "", lat:+x.y, lng:+x.x }));
          }
          setPlaceHits(list);
        });
      } else setPlaceHits(list);
    }, opt);
  };
  const applyPlace = (hit) => {
    if (!picked) return;
    saveGeo(picked.school, { lat:hit.lat, lng:hit.lng, src:"manual", at:Date.now() });
    setPlaceQ(""); setPlaceHits(null);
    setStatus(`${picked.school} 위치를 '${hit.name}'(으)로 지정했어요.`);
    const kakao = kkRef.current, map = mapRef.current;
    if (kakao && map) { try { map.setLevel(3); map.panTo(new kakao.maps.LatLng(hit.lat, hit.lng)); } catch {} }
  };

  const exactCnt  = sites.filter(s => { const g=geo[normSchool(s.school)]; return g && g.lat; }).length;
  const manualCnt = sites.filter(s => { const g=geo[normSchool(s.school)]; return g && g.lat && g.src==="manual"; }).length;
  const noPos    = sites.filter(s => !posOf(s)).length;

  /* 지역별 집계 — 키가 없어도 어디에 몰려 있는지 볼 수 있게 */
  const byRegion = useMemo(() => {
    const m = {};
    sites.forEach(s => { const r=(s.region||"미지정").trim()||"미지정"; m[r]=(m[r]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [sites]);

  return (
    <div>
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,fontWeight:600,marginBottom:3 }}>MAP</div>
        <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>현장 지도</h1>
        <div style={{ fontSize:12,color:C.t3,marginTop:4 }}>가까이 몰려 있는 현장을 묶어서 볼 수 있어요. 지도를 확대하면 개별 현장으로 나뉩니다.</div>
      </div>

      {/* 현장 이름으로 찾기 */}
      <div style={{ position:"relative",marginBottom:12 }}>
        <div style={{ display:"flex",gap:6 }}>
          <input value={q} onChange={e=>setQ(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter" && matches.length) goTo(matches[0]); if(e.key==="Escape") setQ(""); }}
            placeholder="현장 이름으로 찾기 (예: 용문고, 시온고)"
            style={{ flex:1,padding:"11px 13px",background:C.surface,border:`1.5px solid ${q?C.blue:C.border}`,
              borderRadius:9,color:C.t1,fontSize:14,outline:"none" }}/>
          {q && <button onClick={()=>setQ("")} style={{ padding:"0 14px",borderRadius:9,border:`1px solid ${C.border}`,
            background:C.surface,color:C.t3,fontSize:13,fontWeight:700,cursor:"pointer" }}>지우기</button>}
        </div>
        {q && (
          <div style={{ position:"absolute",top:"100%",left:0,right:0,marginTop:4,background:C.surface,
            border:`1px solid ${C.border}`,borderRadius:10,boxShadow:"0 8px 24px rgba(20,30,50,.14)",zIndex:40,overflow:"hidden" }}>
            {matches.length===0 && <div style={{ padding:"12px 14px",fontSize:12,color:C.t4 }}>일치하는 현장이 없어요.</div>}
            {matches.map(m => {
              const has = !!geo[normSchool(m.s.school)];
              return (
                <button key={`${m.y}-${m.h}-${m.s.id}`} onClick={()=>goTo(m)}
                  style={{ width:"100%",display:"flex",alignItems:"center",gap:8,padding:"10px 13px",background:"transparent",
                    border:"none",borderBottom:`1px solid ${C.surfaceD}`,cursor:"pointer",textAlign:"left" }}>
                  <span style={{ fontSize:13 }}>{has ? "🔵" : "⚪"}</span>
                  <span style={{ flex:1,minWidth:0,overflow:"hidden" }}>
                    <span style={{ display:"block",fontSize:13,fontWeight:700,color:C.t1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{m.s.school}</span>
                    <span style={{ display:"block",fontSize:10,color:C.t4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>
                      {(m.s.buildings||[]).map(b=>b.b).filter(Boolean).slice(0,3).join(" · ")||"동 정보 없음"}
                      {m.s.end ? ` · 완수 ${fd(m.s.end)}` : ""}
                    </span>
                  </span>
                  <span style={{ fontSize:10,color:C.t3,whiteSpace:"nowrap" }}>{m.s.region}</span>
                  <span style={{ fontSize:10,color:C.t4,whiteSpace:"nowrap" }}>
                    {isLH(m.y) ? "LH" : `${String(m.y).slice(2)}년 ${m.h==="상반기"?"상":"하"}`}
                  </span>
                </button>
              );
            })}
          </div>
        )}
      </div>

      {/* 반기 선택 + 필터 */}
      <div style={{ display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:12 }}>
        {buckets.map(b => {
          const on = cur && cur.y===b.y && cur.h===b.h;
          return (
            <button key={`${b.y}-${b.h}`} onClick={()=>{ setSel(b); setPicked(null); fitRef.current=false; }}
              style={{ padding:"7px 13px",borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",
                border:`1.5px solid ${on?C.blue:C.border}`,background:on?C.blueL:C.surface,color:on?C.blue:C.t3 }}>
              {isLH(b.y) ? "🏢 LH 정밀" : `${String(b.y).slice(2)}년 ${b.h==="상반기"?"상":"하"}`}
              <span style={{ marginLeft:5,fontSize:10,color:C.t4 }}>{(db[b.y][b.h]||[]).length}</span>
            </button>
          );
        })}
        <button onClick={()=>setOnlySoon(v=>!v)}
          style={{ padding:"7px 13px",borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",
            border:`1.5px solid ${onlySoon?C.red:C.border}`,background:onlySoon?C.redL:C.surface,color:onlySoon?C.red:C.t3 }}>
          🚨 완수 30일 이내
        </button>
        <button onClick={()=>setShowLabels(v=>!v)}
          style={{ padding:"7px 13px",borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",
            border:`1.5px solid ${showLabels?C.blue:C.border}`,background:showLabels?C.blueL:C.surface,color:showLabels?C.blue:C.t3 }}>
          📅 날짜 표시 {showLabels?"켜짐":"꺼짐"}
        </button>
      </div>

      {!kakaoKey ? (
        <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"18px 20px",marginBottom:14 }}>
          <div style={{ fontSize:13,fontWeight:800,color:C.t1,marginBottom:6 }}>🗺 지도를 켜려면 카카오맵 키가 한 번 필요해요</div>
          <div style={{ fontSize:12,color:C.t2,lineHeight:1.8,marginBottom:10 }}>
            무료입니다. <b>설정 → 지도(카카오맵) 설정</b>에서 키를 넣으면 바로 켜져요.<br/>
            ① developers.kakao.com 로그인 → 내 애플리케이션 → 애플리케이션 추가하기<br/>
            ② 만든 앱 → <b>[카카오맵] → [사용 설정] → 상태 ON</b> <span style={{color:C.orange,fontWeight:700}}>(꼭 필요)</span><br/>
            ③ <b>앱 키 → JavaScript 키 → JavaScript SDK 도메인</b>에 이 사이트 주소 등록<br/>
            ④ <b>JavaScript 키</b> 복사 → 설정에 붙여넣기
          </div>
          <div style={{ fontSize:12,fontWeight:700,color:C.t1,marginBottom:8 }}>지금은 지역별 분포로 볼 수 있어요</div>
          <div style={{ display:"flex",flexDirection:"column",gap:6 }}>
            {byRegion.map(([r,n])=>{
              const top = byRegion[0][1]||1;
              return (
                <div key={r} style={{ display:"flex",alignItems:"center",gap:10 }}>
                  <span style={{ width:70,fontSize:12,fontWeight:700,color:C.t1 }}>{r}</span>
                  <div style={{ flex:1,height:10,background:C.surfaceD,borderRadius:5,overflow:"hidden" }}>
                    <div style={{ width:`${Math.round(n/top*100)}%`,height:"100%",background:C.blue,borderRadius:5 }}/>
                  </div>
                  <span style={{ width:40,textAlign:"right",fontSize:12,fontWeight:700,color:C.t2 }}>{n}개</span>
                </div>
              );
            })}
            {!byRegion.length && <span style={{ fontSize:12,color:C.t4 }}>표시할 현장이 없습니다.</span>}
          </div>
        </div>
      ) : (
        <>
          <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:10 }}>
            {busy ? (
              <button onClick={()=>{ stopRef.current = true; }}
                style={{ padding:"9px 16px",borderRadius:9,border:`1.5px solid ${C.red}`,background:C.redL,color:C.red,
                  fontSize:13,fontWeight:700,cursor:"pointer" }}>■ 중지</button>
            ) : (
              <button onClick={()=>runGeocode(null,{ includeFailed:true })}
                style={{ padding:"9px 16px",borderRadius:9,border:`1.5px solid ${C.blue}`,background:C.blueL,color:C.blue,
                  fontSize:13,fontWeight:700,cursor:"pointer" }}>🔄 못 찾은 위치만 다시 찾기</button>
            )}
            {undoStack.length>0 && !busy && (
              <button onClick={undoMove}
                style={{ padding:"9px 16px",borderRadius:9,border:`1.5px solid ${C.orange}`,background:C.orangeL,color:C.orange,
                  fontSize:13,fontWeight:700,cursor:"pointer" }}>
                ↩ 되돌리기 ({undoStack.length})
              </button>
            )}
            <span style={{ fontSize:11,color:C.t3 }}>
              🟢 직접 지정 <b style={{color:C.green}}>{manualCnt}</b> · 🔵 찾은 위치 <b style={{color:C.blue}}>{exactCnt-manualCnt}</b> · ⚪ 대략 <b>{sites.length-exactCnt-noPos}</b>
              {noPos>0 && <span style={{ color:C.orange,marginLeft:6 }}>· 미표시 {noPos}</span>}
            </span>
          </div>
          <div style={{ fontSize:11,color:C.t3,background:C.blueL,border:`1px solid ${C.blue}25`,borderRadius:8,padding:"8px 11px",marginBottom:10,lineHeight:1.7 }}>
            🟢 <b>초록 핀</b> = 직접 지정 · 🔵 <b>파란 핀</b> = 찾은 위치 · ⚪ <b>회색 핀</b> = 못 찾아 시(市) 중심에 임시 표시<br/>
            핀을 <b>끌어다 놓으면</b> 그 자리로 저장되고, 잘못 옮겼으면 <b>↩ 되돌리기</b>로 복구할 수 있어요.
            한 번 정해진 위치는 <b>그대로 고정</b>되고 다시 검색하지 않습니다 — 갱신이 필요할 때만 위 버튼이나 현장별 '위치 다시 찾기'를 쓰세요.
            <br/><b style={{color:C.blue}}>날짜 라벨</b>은 지도를 <b>확대하면</b> 핀 위에 나타나요 (현장조사일 · 완수일 · D-day). 완수 7일 이내는 <b style={{color:C.red}}>빨간 테두리</b>로 표시됩니다.
          </div>
          {/* 진단 — 어디까지 됐는지 바로 보이게 */}
          <div style={{ fontSize:11,color:C.t2,background:C.surfaceL,border:BD,borderRadius:8,padding:"8px 11px",marginBottom:10,display:"flex",gap:12,flexWrap:"wrap" }}>
            <span>상태 <b style={{ color: err ? C.red : ready ? C.green : C.orange }}>{diag.step}</b></span>
            <span>현장 <b>{sites.length}</b></span>
            <span>지도에 찍힌 핀 <b style={{ color: diag.markers>0 ? C.green : C.orange }}>{diag.markers}</b></span>
          </div>
          {status && <div style={{ fontSize:11,color:C.t2,background:C.surfaceL,border:BD,borderRadius:8,padding:"8px 11px",marginBottom:10 }}>{status}</div>}
          {err && (
            <div style={{ fontSize:11,color:C.red,background:C.redL,border:`1px solid ${C.red}35`,borderRadius:8,padding:"10px 12px",marginBottom:10,whiteSpace:"pre-wrap",lineHeight:1.7 }}>
              ⚠ {err}
              {"\n\n"}<b>확인할 것 (2026년 7월 21일부터 절차가 바뀌었어요)</b>
              {"\n"}① 카카오디벨로퍼스 → 내 앱 → <b>[카카오맵] → [사용 설정] → 상태 ON</b>
              {"\n"}② <b>앱 키 → JavaScript 키 → 'JavaScript SDK 도메인'</b>에 아래 주소 등록
              {"\n"}　 {typeof window!=="undefined" ? window.location.origin : ""}
              {"\n"}③ 넣은 키가 <b>JavaScript 키</b>가 맞는지 (REST API 키 아님)
            </div>
          )}
          <div ref={boxRef} style={{ width:"100%",height:isMobile?380:560,borderRadius:12,border:BD,overflow:"hidden",background:C.surfaceL }}/>
        </>
      )}

      {/* 선택한 현장 */}
      {picked && (() => {
        const tel = siteTel(picked);
        const dial = tel.replace(/[^0-9+]/g,"");
        const needPos = !picked._exact;
        return (
          <div style={{ marginTop:12,background:C.surface,border:BD,borderRadius:12,padding:"14px 16px" }}>
            <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8 }}>
              <span style={{ fontSize:15,fontWeight:800,color:C.t1,flex:1,minWidth:100 }}>{picked.school}</span>
              {tel
                ? <a href={`tel:${dial}`} style={{ padding:"6px 13px",borderRadius:7,fontSize:13,fontWeight:800,textDecoration:"none",
                    border:`1px solid ${C.green}55`,background:C.greenL,color:C.green,whiteSpace:"nowrap" }}>📞 {tel}</a>
                : <span style={{ fontSize:11,color:C.t4 }}>전화번호 없음</span>}
              <button onClick={()=>setEditId(picked.id)} style={{ padding:"6px 13px",borderRadius:7,fontSize:13,fontWeight:700,
                border:`1px solid ${C.blue}40`,background:C.blueL,color:C.blue,cursor:"pointer",whiteSpace:"nowrap" }}>✏ 수정</button>
            </div>
            <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6 }}>
              {picked._manual ? <span style={{ fontSize:10,color:C.green,fontWeight:700 }}>🟢 직접 지정한 위치</span>
                : picked._exact ? <span style={{ fontSize:10,color:C.blue,fontWeight:700 }}>🔵 찾은 위치</span>
                : <span style={{ fontSize:10,color:C.orange,fontWeight:700 }}>⚪ 위치 못 찾음 — 아래에서 지정해 주세요</span>}
              <span style={{ fontSize:12,color:C.t2 }}>
                {picked.region||"지역 미지정"} · {picked.buildings.length}개 동
                {picked.field && ` · 현장조사 ${fd(picked.field)}`}
                {picked.end && ` · 완수 ${fd(picked.end)} (${ddL(calcDday(picked.end))})`}
              </span>
            </div>
            {(picked.assignees||[]).length>0 && <div style={{ fontSize:12,color:C.t3,marginBottom:8 }}>👤 {picked.assignees.join(", ")}</div>}

            {/* 위치 지정 도구 */}
            <div style={{ marginTop:8,padding:"10px 12px",borderRadius:9,
              background:needPos?C.orangeL:C.surfaceL, border:`1px solid ${needPos?C.orange+"35":C.border}` }}>
              <div style={{ fontSize:11,fontWeight:800,color:needPos?"#9A5B0A":C.t2,marginBottom:7 }}>
                📍 위치 지정 {needPos && "— 이름이나 주소를 넣으면 그 자리로 옮겨요"}
              </div>
              <div style={{ display:"flex",gap:6,flexWrap:"wrap",marginBottom:7 }}>
                <input value={placeQ} onChange={e=>setPlaceQ(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter") searchPlace(); }}
                  placeholder={`예: ${picked.school} 또는 도로명 주소`}
                  style={{ flex:1,minWidth:170,padding:"9px 11px",background:C.surface,border:`1.5px solid ${C.border}`,
                    borderRadius:8,color:C.t1,fontSize:13,outline:"none" }}/>
                <button onClick={searchPlace} style={{ padding:"9px 15px",borderRadius:8,border:"none",background:C.blue,

                      <div style={{ fontSize:12,fontWeight:700,color:C.t1 }}>{h.name}</div>

      {editId && (() => {

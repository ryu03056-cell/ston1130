        <div style={{ width:40,height:40,borderRadius:"50%",background:C.blueL,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18 }}>👤</div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:14,fontWeight:800,color:C.t1 }}>{editor || "이름 미설정"}</div>
          <div style={{ fontSize:11,color:C.t3 }}>{authUser?.email}</div>
        </div>
        <button onClick={onLogout} style={{ padding:"8px 16px",borderRadius:8,border:`1.5px solid ${C.red}40`,
          background:C.redL,color:C.red,fontSize:12,fontWeight:700,cursor:"pointer" }}>로그아웃</button>
      </div>

      {/* 관리자 모드 */}
      {!admin ? (
        <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"18px",marginBottom:14 }}>
          <div style={{ fontSize:13,fontWeight:800,color:C.t1,marginBottom:4 }}>🔒 관리자 모드</div>
          <div style={{ fontSize:11,color:C.t3,marginBottom:12 }}>팀·인원 관리와 수정 내역 조회는 관리자 비밀번호가 필요합니다.</div>
          <div style={{ display:"flex",gap:8 }}>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryAdmin()}
              placeholder="관리자 비밀번호" style={{ flex:1,padding:"10px 12px",background:C.surfaceL,border:BD,borderRadius:8,color:C.t1,fontSize:13,outline:"none" }}/>
            <button onClick={tryAdmin} style={{ padding:"10px 20px",borderRadius:8,background:C.t1,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer" }}>진입</button>
          </div>
          {pwErr && <div style={{ fontSize:11,color:C.red,marginTop:8 }}>{pwErr}</div>}
        </div>
      ) : (
        <>
          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"10px 14px",
            background:C.t1,borderRadius:10,color:"#fff" }}>
            <span style={{ fontSize:14 }}>🔓</span>
            <span style={{ fontSize:13,fontWeight:700 }}>관리자 모드</span>
            <button onClick={()=>setAdmin(false)} style={{ marginLeft:"auto",padding:"5px 12px",borderRadius:7,
              border:"1px solid rgba(255,255,255,.3)",background:"transparent",color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer" }}>나가기</button>
          </div>

          {/* 팀 · 인원 관리 */}
          <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"16px 18px",marginBottom:14 }}>
            <div style={{ fontSize:13,fontWeight:800,color:C.t1,marginBottom:12 }}>👥 팀 · 인원 관리</div>
            {TEAM_LIST.map(team => {
              const tc = TC[team]||{a:C.t3,b:C.surfaceL};
              return (
                <div key={team} style={{ marginBottom:12,padding:"12px",background:C.surfaceL,borderRadius:10,border:`1px solid ${tc.a}25`,borderLeft:`3px solid ${tc.a}` }}>
                  <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8 }}>
                    <div style={{ width:12,height:12,borderRadius:"50%",background:tc.a }}/>
                    <span style={{ fontSize:13,fontWeight:800,color:tc.a }}>{team}</span>
                    <span style={{ fontSize:10,color:C.t4 }}>{(TEAM_MEMBERS[team]||[]).length}명</span>
                    {/* 색상 변경 */}
                    <div style={{ display:"flex",gap:3,marginLeft:8 }}>
                      {TEAM_PALETTE.slice(0,6).map(col=>(
                        <button key={col} onClick={()=>setTeamColor(team,col)} title="색상 변경"
                          style={{ width:14,height:14,borderRadius:"50%",background:col,border:tc.a===col?`2px solid ${C.t1}`:"1px solid #0001",cursor:"pointer",padding:0 }}/>
                      ))}
                    </div>
                    <button onClick={()=>{ if(confirm(`'${team}' 팀을 삭제할까요?`)) delTeam(team); }}
                      style={{ marginLeft:"auto",padding:"3px 8px",borderRadius:5,fontSize:10,fontWeight:700,border:`1px solid ${C.red}30`,background:C.redL,color:C.red,cursor:"pointer" }}>팀 삭제</button>
                  </div>
                  <div style={{ display:"flex",flexWrap:"wrap",gap:5,marginBottom:8 }}>
                    {(TEAM_MEMBERS[team]||[]).map(nm=>(
                      <span key={nm} style={{ display:"inline-flex",alignItems:"center",gap:5,fontSize:12,fontWeight:700,
                        color:tc.a,background:tc.b,padding:"5px 10px",borderRadius:20,border:`1px solid ${tc.a}30` }}>
                        {nm}
                        <button onClick={()=>delMember(team,nm)} style={{ width:15,height:15,borderRadius:"50%",border:"none",
                          background:tc.a,color:"#fff",fontSize:10,fontWeight:900,cursor:"pointer",lineHeight:1,padding:0 }}>×</button>
                      </span>
                    ))}
                    {(TEAM_MEMBERS[team]||[]).length===0 && <span style={{ fontSize:11,color:C.t4 }}>인원 없음</span>}
                  </div>
                  <div style={{ display:"flex",gap:6 }}>
                    <input value={newName[team]||""} onChange={e=>setNewName(p=>({...p,[team]:e.target.value}))}
                      onKeyDown={e=>e.key==="Enter"&&addMember(team)} placeholder="새 인원 이름"
                      style={{ flex:1,padding:"7px 10px",background:C.surface,border:BD,borderRadius:7,color:C.t1,fontSize:12,outline:"none" }}/>
                    <button onClick={()=>addMember(team)} style={{ padding:"7px 14px",borderRadius:7,background:tc.a,border:"none",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer" }}>+ 추가</button>
                  </div>
                </div>
              );
            })}
            {/* 팀 추가 */}
            <div style={{ display:"flex",gap:6,marginTop:8 }}>
              <input value={newTeam} onChange={e=>setNewTeam(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTeam()}
                placeholder="새 팀 이름 (예: 5팀)" style={{ flex:1,padding:"9px 11px",background:C.surfaceL,border:`1.5px dashed ${C.border}`,borderRadius:8,color:C.t1,fontSize:13,outline:"none" }}/>
              <button onClick={addTeam} style={{ padding:"9px 18px",borderRadius:8,background:C.blue,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer" }}>+ 팀 추가</button>
            </div>
          </div>

          {/* 수정 로그 */}
          <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"16px 18px" }}>
            <div style={{ display:"flex",alignItems:"center",marginBottom:12 }}>
              <div style={{ fontSize:13,fontWeight:800,color:C.t1 }}>📝 최근 수정 내역</div>
              <span style={{ marginLeft:8,fontSize:10,color:C.t4 }}>{logs.length}건</span>
            </div>
            {logs.length===0 && <div style={{ fontSize:12,color:C.t4,padding:"20px 0",textAlign:"center" }}>아직 기록된 수정 내역이 없습니다.</div>}
            <div style={{ display:"flex",flexDirection:"column",gap:6,maxHeight:420,overflowY:"auto" }}>
              {logs.map(l=>(
                <div key={l.id} style={{ display:"flex",alignItems:"flex-start",gap:10,padding:"9px 11px",background:C.surfaceL,borderRadius:8,border:BD }}>
                  <span style={{ fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:4,flexShrink:0,
                    background:actColor(l.action)+"18",color:actColor(l.action),border:`1px solid ${actColor(l.action)}30` }}>{l.action}</span>
                  <div style={{ flex:1,minWidth:0 }}>
                    <div style={{ fontSize:12,fontWeight:700,color:C.t1 }}>{l.target}</div>
                    {(l.before || l.after) && (
                      <div style={{ fontSize:10,color:C.t3,marginTop:2,wordBreak:"break-all" }}>
                        {l.before && <span style={{ color:C.t4 }}>{l.before}</span>}
                        {l.before && l.after && <span style={{ color:C.t4 }}> → </span>}
                        {l.after && <span style={{ color:C.t2 }}>{l.after}</span>}
                      </div>
                    )}
                    <div style={{ fontSize:9,color:C.t4,marginTop:3 }}>{l.by}{l.email?` (${l.email})`:""} · {fmtTs(l.ts)}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ fontSize:9,color:C.t4,marginTop:10 }}>* 로그는 표시 전용이며 일반 사용자는 수정·삭제할 수 없습니다.</div>
          </div>

          {/* 매출 관리 (관리자 전용) */}
          <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"16px 18px",marginTop:14 }}>
            <div style={{ fontSize:13,fontWeight:800,color:C.t1,marginBottom:4 }}>💰 매출 관리</div>
            <div style={{ fontSize:11,color:C.t3,marginBottom:12 }}>학교별 계약금액을 입력하면 자동 집계됩니다. (관리자 전용)</div>
            <div style={{ display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14 }}>
              {[{l:"총 계약금액",v:revTotal,c:C.blue},{l:"완료 금액",v:revDone,c:C.green},
                {l:"진행중",v:revIng,c:C.purple},{l:"미착수",v:revNone,c:C.t3}].map(k=>(
                <div key={k.l} style={{ background:C.surfaceL,borderRadius:10,padding:"12px 14px",borderTop:`3px solid ${k.c}` }}>
                  <div style={{ fontSize:10,color:C.t3,marginBottom:5 }}>{k.l}</div>
                  <div style={{ fontSize:16,fontWeight:800,color:k.c }}>{won(k.v)}</div>
                </div>
              ))}
            </div>
            <div style={{ maxHeight:340,overflowY:"auto",display:"flex",flexDirection:"column",gap:5 }}>
              {allSchools.map(s=>{
                const tc=TC[s.team]||{a:C.t3,b:C.surfaceL};
                return (
                  <div key={s.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"8px 11px",background:C.surfaceL,borderRadius:8,border:BD }}>
                    <span style={{ fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4,background:tc.b,color:tc.a,flexShrink:0 }}>{s.team}</span>
                    <span style={{ fontSize:12,fontWeight:700,color:C.t1,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{s.school}</span>
                    <span style={{ fontSize:9,color:C.t4 }}>{s._year} {s._half}</span>
                    {revEdit===s.id ? (
                      <>
                        <input autoFocus value={revVal} onChange={e=>setRevVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveRev(s.id)}
                          placeholder="금액" style={{ width:110,padding:"5px 8px",border:BD,borderRadius:6,fontSize:12,textAlign:"right",outline:"none" }}/>
                        <button onClick={()=>saveRev(s.id)} style={{ padding:"5px 10px",borderRadius:6,background:C.green,border:"none",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer" }}>저장</button>
                      </>
                    ) : (
                      <button onClick={()=>{ setRevEdit(s.id); setRevVal(s.contract||""); }}
                        style={{ minWidth:96,textAlign:"right",padding:"5px 10px",borderRadius:6,border:`1px solid ${s.contract?C.blue+"40":C.border}`,
                          background:s.contract?C.blueL:C.surface,color:s.contract?C.blue:C.t4,fontSize:12,fontWeight:700,cursor:"pointer" }}>
                        {won(s.contract)}
                      </button>
                    )}
                  </div>
                );
              })}
              {allSchools.length===0 && <div style={{ textAlign:"center",color:C.t4,fontSize:12,padding:16 }}>학교가 없습니다.</div>}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   전체 현황 (대시보드 요약)
══════════════════════════════════════════════════════════════ */
function OverviewPage({ allSchools, db, isMobile, onGo }) {
  const total = allSchools.length;
  const buildings = allSchools.flatMap(s=>s.buildings);
  const urgent = allSchools.filter(s=>{ const d=calcDday(s.end); return d!==null&&d<0&&d>=-7; });
  const overdue = allSchools.filter(s=>{ const d=calcDday(s.end); return d!==null&&d<-7; });
  const doneCnt = allSchools.filter(s=>getProgress(s).done===STEPS.length).length;
  const repDone = buildings.filter(b=>b.rep).length;
  const teamCount = {};
  TEAM_LIST.forEach(t=>{ teamCount[t]=allSchools.filter(s=>s.team===t).length; });
  const stepAgg = STEPS.map(k => ({ k, n: allSchools.filter(s=>s.progress&&s.progress[k]).length }));

  const Card = ({ label, val, sub, color, go }) => (
    <button onClick={go?()=>onGo(go):undefined} style={{ textAlign:"left",cursor:go?"pointer":"default",
      background:C.surface,border:BD,borderTop:`3px solid ${color}`,borderRadius:12,padding:"16px 18px",boxShadow:"0 1px 6px rgba(0,0,0,.05)" }}>
      <div style={{ fontSize:11,color:C.t3,fontWeight:600,marginBottom:6 }}>{label}</div>
      <div style={{ fontSize:26,fontWeight:900,color }}>{val}</div>
      {sub && <div style={{ fontSize:10,color:C.t4,marginTop:4 }}>{sub}</div>}
    </button>
  );

  return (
    <div>
      <div style={{ marginBottom:18 }}>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,fontWeight:600,marginBottom:3 }}>OVERVIEW</div>
        <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>전체 현황</h1>
      </div>

      <div style={{ display:"grid",gridTemplateColumns:isMobile?"repeat(2,1fr)":"repeat(4,1fr)",gap:12,marginBottom:14 }}>
        <Card label="전체 현장" val={total} sub={`${buildings.length}개 동`} color={C.blue} go="sites"/>
        <Card label="✅ 완료" val={doneCnt} sub={`8단계 모두 완료`} color={C.green} go="done"/>
        <Card label="🚨 긴급 (D-7)" val={urgent.length} sub="완수일 임박" color={C.red} go="urgent"/>
        <Card label="⏰ 기한 초과" val={overdue.length} sub="완수일 지남" color={C.orange}/>
      </div>

      {/* 팀별 현장 수 */}
      <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"16px 18px",marginBottom:14 }}>
        <div style={{ fontSize:13,fontWeight:800,color:C.t1,marginBottom:12 }}>팀별 현장</div>
        <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
          {FIELD_TEAMS().map(t=>{
            const tc=TC[t]||{a:C.t3}; const n=teamCount[t]||0; const pct=total?Math.round(n/total*100):0;
            return (
              <div key={t} style={{ display:"flex",alignItems:"center",gap:10 }}>
                <span style={{ width:46,fontSize:12,fontWeight:700,color:tc.a }}>{t}</span>
                <div style={{ flex:1,height:10,background:C.surfaceD,borderRadius:5,overflow:"hidden" }}>
                  <div style={{ width:`${pct}%`,height:"100%",background:tc.a,borderRadius:5 }}/>
                </div>
                <span style={{ width:40,textAlign:"right",fontSize:12,fontWeight:700,color:C.t2 }}>{n}개</span>
              </div>
            );
          })}
        </div>
      </div>

      {/* 단계별 진행 집계 */}
      <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"16px 18px" }}>
        <div style={{ fontSize:13,fontWeight:800,color:C.t1,marginBottom:12 }}>단계별 완료 현장 수 <span style={{ fontSize:10,color:C.t4,fontWeight:500 }}>(전체 {total}개 중)</span></div>
        <div style={{ display:"grid",gridTemplateColumns:isMobile?"repeat(2,1fr)":"repeat(4,1fr)",gap:10 }}>
          {stepAgg.map(({k,n})=>{
            const sp=STEP_SPECIAL[k], col=sp?C.purple:C.blue, pct=total?Math.round(n/total*100):0;
            return (
              <div key={k} style={{ padding:"10px 12px",background:C.surfaceL,borderRadius:9,border:`1px solid ${sp?C.purple+"30":C.border}` }}>
                <div style={{ display:"flex",alignItems:"center",gap:5,marginBottom:6 }}>
                  <span style={{ fontSize:13 }}>{STEP_ICON[k]}</span>
                  <span style={{ fontSize:11,fontWeight:700,color:sp?C.purple:C.t2 }}>{k}</span>
                </div>
                <div style={{ fontSize:16,fontWeight:800,color:col }}>{n}<span style={{ fontSize:10,color:C.t4,fontWeight:500 }}> / {pct}%</span></div>
                <div style={{ height:4,background:C.surfaceD,borderRadius:2,marginTop:5 }}><div style={{ width:`${pct}%`,height:"100%",background:col,borderRadius:2 }}/></div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   팀 채팅 (방별 · 이미지 첨부 · 새 메시지 푸시)
══════════════════════════════════════════════════════════════ */
/* 채팅 방: 전체 · 공지 + 팀별(설정의 팀 목록 자동 반영) */
const chatRoomColor = (r) => r==="전체" ? C.blue : r==="공지사항" ? C.red : (TC[r] && TC[r].a) || C.t2;
const chatRoomIcon  = (r) => r==="전체" ? "💬 " : r==="공지사항" ? "📢 " : "👥 ";

function ChatPage({ editor, isMobile }) {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState("");
  const myTeam = TEAM_LIST.find(t => (TEAM_MEMBERS[t]||[]).includes(editor));
  const rooms = myTeam ? ["전체", myTeam] : ["전체"];   // 전체 + 본인 팀만
  const [room, setRoom] = useState(myTeam || "전체");
  const [uploading, setUploading] = useState(false);
  const imgRef = useRef();
  const bottomRef = useRef();
  const me = editor || (CURRENT_USER.email||"").split("@")[0] || "익명";

  useEffect(() => {
    if (typeof firebase==="undefined" || !firebase.apps.length) return;
    const ref = firebase.database().ref(`${FB_CHAT}/${room}`).limitToLast(200);
    const on = (snap) => {
      const v = snap.val()||{};
      setMsgs(Object.entries(v).map(([id,o])=>({id,...o})).sort((a,b)=>(a.ts||0)-(b.ts||0)));
    };
    ref.on("value", on);
    return () => ref.off("value", on);
  }, [room]);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:"smooth" }); }, [msgs]);

  const send = (text, img) => {
    if (!text && !img) return;
    if (typeof firebase==="undefined" || !firebase.apps.length) return;
    firebase.database().ref(`${FB_CHAT}/${room}`).push({
      name: me, text: text||"", img: img||"", ts: Date.now(),
    }).catch(()=>{});
    sendPush(`[${room}] ${me}`, text || "📷 사진");
    setInput("");
  };

  const onImg = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    if (typeof firebase==="undefined" || !firebase.storage) { alert("이미지 업로드를 사용하려면 Storage가 필요합니다."); return; }
    setUploading(true);
    const path = `chat/${room}/${Date.now()}_${file.name}`;
    const task = firebase.storage().ref(path).put(file);
    task.then(snap => snap.ref.getDownloadURL()).then(url => { send("", url); setUploading(false); })
      .catch(err => { console.warn("업로드 실패:", err); setUploading(false); });
  };

  const fmtT = ts => { const d=new Date(ts); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

  return (
    <div style={{ display:"flex",flexDirection:"column",height:isMobile?"calc(100vh - 120px)":"calc(100vh - 130px)" }}>
      <div style={{ marginBottom:12 }}>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,fontWeight:600,marginBottom:3 }}>TEAM CHAT</div>
        <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>팀 채팅</h1>
      </div>
      {/* 방 선택 — 전체 + 본인 팀만 */}
      <div style={{ display:"flex",gap:6,marginBottom:6,flexWrap:"wrap" }}>
        {rooms.map(r=>{
          const rc = chatRoomColor(r);
          return (
            <button key={r} onClick={()=>setRoom(r)} style={{ padding:"7px 15px",borderRadius:20,fontSize:13,fontWeight:700,cursor:"pointer",
              border:`1.5px solid ${room===r?rc:C.border}`, background:room===r?rc+"15":"transparent", color:room===r?rc:C.t3,whiteSpace:"nowrap" }}>
              {chatRoomIcon(r)}{r==="전체"?"전체 채팅":r}
            </button>
          );
        })}
      </div>
      {!myTeam && (
        <div style={{ fontSize:11,color:C.orange,background:C.orangeL,padding:"8px 11px",borderRadius:8,marginBottom:10,border:`1px solid ${C.orange}30` }}>
          사이드바에서 <b>내 이름</b>을 선택하면 우리 팀 채팅방이 나타나요.
        </div>
      )}
      {/* 메시지 영역 */}
      <div style={{ flex:1,overflowY:"auto",background:C.surface,border:BD,borderRadius:12,padding:"14px",display:"flex",flexDirection:"column",gap:8 }}>
        {msgs.length===0 && <div style={{ textAlign:"center",color:C.t4,fontSize:12,margin:"auto" }}>아직 메시지가 없어요. 첫 메시지를 보내보세요!</div>}
        {msgs.map(m=>{
          const mine = m.name===me;
          return (
            <div key={m.id} style={{ display:"flex",flexDirection:"column",alignItems:mine?"flex-end":"flex-start" }}>
              <span style={{ fontSize:10,color:mine?C.blue:C.t2,fontWeight:700,marginBottom:2,marginLeft:mine?0:4,marginRight:mine?4:0 }}>
                {m.name||"익명"}{mine?" (나)":""}
              </span>
              <div style={{ display:"flex",alignItems:"flex-end",gap:5,flexDirection:mine?"row-reverse":"row" }}>
                <div style={{ maxWidth:"72%",padding:m.img?"4px":"8px 12px",borderRadius:14,
                  background:mine?C.blue:C.surfaceD, color:mine?"#fff":C.t1,fontSize:13,lineHeight:1.5,wordBreak:"break-word" }}>
                  {m.img ? <img src={m.img} alt="" style={{ maxWidth:200,maxHeight:200,borderRadius:10,display:"block" }}/> : m.text}
                </div>
                <span style={{ fontSize:9,color:C.t4 }}>{fmtT(m.ts)}</span>
              </div>
            </div>
          );
        })}
        <div ref={bottomRef}/>
      </div>
      {/* 입력 */}
      <div style={{ display:"flex",gap:8,marginTop:10,alignItems:"center" }}>
        <input ref={imgRef} type="file" accept="image/*" style={{ display:"none" }} onChange={onImg}/>
        <button onClick={()=>imgRef.current?.click()} disabled={uploading} style={{ width:42,height:42,borderRadius:10,border:BD,background:C.surface,fontSize:18,cursor:"pointer",flexShrink:0 }}>{uploading?"⏳":"📷"}</button>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send(input)}
          placeholder={`${room} 메시지 입력…`} style={{ flex:1,padding:"11px 14px",background:C.surface,border:BD,borderRadius:10,fontSize:14,outline:"none" }}/>
        <button onClick={()=>send(input)} style={{ padding:"0 20px",height:42,borderRadius:10,background:C.blue,border:"none",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",flexShrink:0 }}>전송</button>
      </div>
      {!editor && <div style={{ fontSize:10,color:C.orange,marginTop:6 }}>※ 사이드바에서 '내 이름'을 먼저 선택하면 메시지에 이름이 표시돼요.</div>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   로그인 화면 (이메일/비밀번호)
══════════════════════════════════════════════════════════════ */
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = () => {
    if (!email || !pw) { setErr("이메일과 비밀번호를 입력하세요."); return; }
    if (typeof firebase==="undefined" || !firebase.auth) { setErr("인증 모듈을 불러오지 못했습니다."); return; }
    setBusy(true); setErr("");
    firebase.auth().signInWithEmailAndPassword(email.trim(), pw)
      .then(() => { /* onAuthStateChanged 가 처리 */ })
      .catch((e) => {
        const m = {
          "auth/invalid-email":"이메일 형식이 올바르지 않습니다.",
          "auth/user-not-found":"등록되지 않은 계정입니다.",
          "auth/wrong-password":"비밀번호가 올바르지 않습니다.",
          "auth/invalid-credential":"이메일 또는 비밀번호가 올바르지 않습니다.",
          "auth/too-many-requests":"시도가 많아 잠시 후 다시 시도하세요.",
          "auth/network-request-failed":"네트워크 연결을 확인하세요.",
        }[e.code] || ("로그인 실패: " + (e.message||e.code));
        setErr(m); setBusy(false);
      });
  };

  return (
    <div style={{ minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:F,padding:20 }}>
      <div style={{ width:"100%",maxWidth:380,background:C.surface,borderRadius:18,border:BD,
        boxShadow:"0 12px 40px rgba(0,0,0,.12)",overflow:"hidden" }}>
        <div style={{ padding:"28px 28px 20px",textAlign:"center",borderBottom:BD }}>
          <div style={{ fontSize:30,fontWeight:900,color:C.t1,letterSpacing:-.5 }}><span style={{ color:C.blue }}>◈</span> STON</div>
          <div style={{ fontSize:11,color:C.t3,marginTop:4,letterSpacing:2,fontWeight:600 }}>현장 일정·관리 시스템</div>
        </div>
        <div style={{ padding:"24px 28px" }}>
          <div style={{ fontSize:13,fontWeight:700,color:C.t1,marginBottom:14 }}>팀원 로그인</div>
          <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
            <div>
              <label style={{ fontSize:10,color:C.t3,fontWeight:700,display:"block",marginBottom:4 }}>이메일</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="name@stoneng.co.kr" autoComplete="username"
                style={{ width:"100%",padding:"11px 12px",background:C.surfaceL,border:BD,borderRadius:9,color:C.t1,fontSize:14,outline:"none" }}/>
            </div>
            <div>
              <label style={{ fontSize:10,color:C.t3,fontWeight:700,display:"block",marginBottom:4 }}>비밀번호</label>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••" autoComplete="current-password"
                style={{ width:"100%",padding:"11px 12px",background:C.surfaceL,border:BD,borderRadius:9,color:C.t1,fontSize:14,outline:"none" }}/>
            </div>
            {err && <div style={{ fontSize:11,color:C.red,background:C.redL,padding:"8px 11px",borderRadius:8,border:`1px solid ${C.red}30` }}>{err}</div>}
            <button onClick={submit} disabled={busy} style={{ marginTop:4,padding:"12px",borderRadius:10,
              background:busy?C.t4:C.blue,border:"none",color:"#fff",fontSize:14,fontWeight:700,cursor:busy?"default":"pointer",
              boxShadow:`0 4px 14px ${C.blue}40` }}>{busy?"로그인 중…":"로그인"}</button>
          </div>
          <div style={{ fontSize:10,color:C.t4,marginTop:16,lineHeight:1.6 }}>
            계정이 없으면 관리자에게 문의하세요. 계정은 Firebase 콘솔 → Authentication 에서 발급합니다.
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   메인 앱 — 사이드바 + 라우팅
══════════════════════════════════════════════════════════════ */
function App() {
  const isMobile = useIsMobile();
  const [authUser, setAuthUser] = useState(undefined); // undefined=확인중, null=미로그인, obj=로그인
  const [db, setDb] = useState(DB);
  const [sideOpen, setSideOpen] = useState(typeof window!=="undefined" ? window.innerWidth>=820 : true);
  const [menu, setMenuRaw] = useState("overview");
  const [globalTeam, setGlobalTeam] = useState("전체");
  // 모바일에서 메뉴 선택 시 사이드바 자동 닫힘
  const setMenu = (m) => { setMenuRaw(m); if (window.innerWidth < 820) setSideOpen(false); };

  /* ── Firebase 상태 ── */
  const [fbStatus, setFbStatus] = useState("연결 중...");
  const [online,   setOnline]   = useState(false);   // .info/connected
  const [syncing,  setSyncing]  = useState(false);    // 저장 중 표시
  const [loaded,   setLoaded]   = useState(false);    // 첫 데이터 도착
  const [users,    setUsers]    = useState(0);        // 동시 접속자
  const [meta,     setMeta]     = useState(null);     // { at, by }
  const [editor,   setEditor]   = useState(() => {
    try { return localStorage.getItem("ston_editor") || ""; } catch { return ""; }
  });
  const saveName = n => { setEditor(n); try { localStorage.setItem("ston_editor", n); } catch {} };

  const dataRef    = useRef(null);
  const metaRef    = useRef(null);
  const lastSynced = useRef(null);    // 마지막으로 FB와 일치한 db
  const skipWrite  = useRef(false);   // 원격 반영분 재저장 차단
  const fbReady    = useRef(false);
  const editorRef  = useRef(editor);
  editorRef.current = editor;
  const saveTimer  = useRef(null);
  const [cfgVer, setCfgVer] = useState(0);   // 팀/인원 설정 갱신 트리거
  const [logs, setLogs] = useState([]);       // 수정 로그

  /* A) Firebase 초기화 + 접속 상태 + 인증 상태 감시 */
  useEffect(() => {
    let offConn=null, offAuth=null;
    try {
      if (typeof firebase === "undefined") { setFbStatus("오프라인 (SDK 없음)"); setLoaded(true); setAuthUser(null); return; }
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      const rootDb = firebase.database();

      const connRef = rootDb.ref(".info/connected");
      const onConn = (s) => { const c=s.val()===true; setOnline(c); setFbStatus(c?"실시간 연결됨":"재연결 중..."); };
      connRef.on("value", onConn);
      offConn = () => connRef.off("value", onConn);

      if (firebase.auth) {
        offAuth = firebase.auth().onAuthStateChanged((user) => {
          if (user) {
            CURRENT_USER = { uid:user.uid, email:user.email, name:(editorRef.current||user.email||"") };
            setAuthUser(user);
          } else {
            CURRENT_USER = { uid:null, email:null, name:"" };
            setAuthUser(null);
          }
        });
      } else { setAuthUser(null); setFbStatus("오프라인 (인증 SDK 없음)"); }
    } catch (e) {
      console.error("[Firebase] 초기화 실패:", e);
      setFbStatus("오프라인 (로컬)"); setLoaded(true); setAuthUser(null);
    }
    return () => { if (offConn) offConn(); if (offAuth) offAuth(); };
  }, []);

  /* B) 로그인 후에만 데이터/메타/설정/로그/presence 구독 */
  useEffect(() => {
    if (!authUser || typeof firebase==="undefined" || !firebase.apps.length) return;
    const rootDb = firebase.database();
    const dRef = rootDb.ref(FB_DATA), mRef = rootDb.ref(FB_META);
    const cRef = rootDb.ref(FB_CONFIG), presRef = rootDb.ref(FB_PRESENCE);
    const lRef = rootDb.ref(FB_LOGS).limitToLast(200);
    dataRef.current = dRef; metaRef.current = mRef;

    const onData = (snap) => {
      const val = fbToDb(snap.val());
      if (val && Object.keys(val).length) { skipWrite.current=true; lastSynced.current=val; setDb(val); }
      else { dRef.set(dbToFb(DB)).catch(()=>{}); lastSynced.current = DB; }
      fbReady.current = true; setLoaded(true);
    };
    const onErr = (err) => { console.error("[Firebase] 구독 오류:", err); setFbStatus("오프라인 (권한 확인)"); setLoaded(true); };
    dRef.on("value", onData, onErr);

    const onMeta = (s) => { const m=s.val(); if(m) setMeta(m); };
    mRef.on("value", onMeta);

    const onCfg = (s) => {
      const cfg = s.val();
      if (cfg) { applyConfig(cfg); setCfgVer(v=>v+1); }
      else { cRef.set({ teams: TEAM_LIST.map(n=>({name:n,color:(TC[n]&&TC[n].a)||C.t3})), members: TEAM_MEMBERS }).catch(()=>{}); }
    };
    cRef.on("value", onCfg);

    const onLogs = (s) => {
      const v = s.val()||{};
      setLogs(Object.entries(v).map(([id,o])=>({id,...o})).sort((a,b)=>(b.ts||0)-(a.ts||0)));
    };
    lRef.on("value", onLogs);

    const presNode = presRef.push();
    presNode.set({ name: editorRef.current || CURRENT_USER.email || "익명", ts: Date.now() });
    presNode.onDisconnect().remove();
    const onPres = (s) => setUsers(s.numChildren());
    presRef.on("value", onPres);

    return () => {
      dRef.off("value", onData); mRef.off("value", onMeta);
      cRef.off("value", onCfg); lRef.off("value", onLogs); presRef.off("value", onPres);
      presNode.remove().catch(()=>{});
    };
  }, [authUser]);

  /* 2) 로컬 db 변경 → 변경된 학교만 부분 저장 (디바운스 + 에코 차단) */
  useEffect(() => {
    if (!fbReady.current || !dataRef.current) return;
    if (skipWrite.current) { skipWrite.current = false; lastSynced.current = db; return; }

    const updates = diffDb(lastSynced.current, db);
    const keys = Object.keys(updates);
    if (keys.length === 0) { lastSynced.current = db; return; }

    setSyncing(true);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      dataRef.current.update(updates)
        .then(() => {
          metaRef.current?.set({ at: Date.now(), by: editorRef.current || "익명",
            cnt: keys.length }).catch(()=>{});
          lastSynced.current = db;
        })
        .catch(e => console.error("[Firebase] 저장 실패:", e))
        .finally(() => setSyncing(false));
    }, 300);
  }, [db]);

  /* 내 이름 변경 시 로그 기록용 사용자명 갱신 + 푸시 등록 */
  useEffect(() => {
    CURRENT_USER = { ...CURRENT_USER, name: editor || CURRENT_USER.email || "" };
  }, [editor]);

  const logout = () => {
    try { firebase.auth().signOut(); } catch {}
  };

  /* 푸시 알림 켜기 */
  const enablePush = () => {
    registerOneSignal(editor || (authUser && authUser.email) || "익명");
    alert("알림 권한을 허용해 주세요. 아이폰은 홈 화면에 추가한 앱 아이콘에서 열어야 알림이 옵니다.");
  };

  const fmtMeta = (ts) => {
    if (!ts) return "";
    const d = new Date(ts), now = new Date();
    const sameDay = d.toDateString()===now.toDateString();
    const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
    return sameDay ? `오늘 ${hh}:${mm}` : `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
  };

  const allSchools = useMemo(() => {
    const list = [];
    Object.entries(db).forEach(([yr,halves]) =>
      Object.entries(halves).forEach(([half,schools]) =>
        schools.forEach(s => list.push({ ...s, _year:yr, _half:half }))));
    return list;
  }, [db]);

  const urgent = allSchools.filter(s => { const d=calcDday(s.end); return d!==null&&d<0&&d>=-7; });

  const pages = {
    overview: <OverviewPage allSchools={allSchools} db={db} isMobile={isMobile} onGo={setMenu}/>,
    schedule: <Calendar allSchools={allSchools} setDb={setDb} globalTeam={globalTeam} isMobile={isMobile}/>,
    sites:    <SitesManager db={db} setDb={setDb} globalTeam={globalTeam} isMobile={isMobile}/>,
    chat:     <ChatPage editor={editor} isMobile={isMobile}/>,
    urgent: (
      <div>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,marginBottom:3,fontWeight:600 }}>URGENT</div>
        <h1 style={{ margin:"0 0 16px",fontSize:22,fontWeight:900,color:C.t1 }}>긴급 보고서 <span style={{ fontSize:14,color:C.red,fontWeight:400 }}>D-7 이내 {urgent.length}건</span></h1>
        {urgent.length===0 && <div style={{ color:C.t4,padding:32,textAlign:"center" }}>긴급 현장 없음</div>}
        {urgent.map(s=>(
          <div key={s.id} style={{ background:C.redL,border:`1.5px solid ${C.red}30`,borderLeft:`4px solid ${C.red}`,borderRadius:"0 12px 12px 0",padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12 }}>
            <div style={{ fontSize:20,fontWeight:900,color:C.red,minWidth:50 }}>{ddL(calcDday(s.end))}</div>
            <div style={{ flex:1 }}><div style={{ fontWeight:700,color:C.t1,fontSize:14 }}>{s.school}</div>
              <div style={{ fontSize:11,color:C.t2 }}>{s.region} · {s.team} · {s._year} {s._half} · {s.buildings.length}동</div></div>
            <Tag bg={TC[s.team]?.b} color={TC[s.team]?.a}>{s.team}</Tag>
          </div>
        ))}
      </div>
    ),
    done: (
      <div>
        <div style={{ fontSize:11,color:C.t3,letterSpacing:2,marginBottom:3,fontWeight:600 }}>COMPLETED</div>
        <h1 style={{ margin:"0 0 16px",fontSize:22,fontWeight:900,color:C.t1 }}>완료 보고서</h1>
        {allSchools.filter(s=>s.buildings.every(b=>b.rep&&b.fmsD)).map(s=>(
          <div key={s.id} style={{ background:C.greenL,border:`1.5px solid ${C.green}30`,borderLeft:`4px solid ${C.green}`,borderRadius:"0 10px 10px 0",padding:"12px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:12 }}>
            <div style={{ fontSize:16,color:C.green }}>✓</div>
            <div style={{ flex:1 }}><div style={{ fontWeight:700,color:C.t1 }}>{s.school}</div>
              <div style={{ fontSize:11,color:C.t2 }}>{s.region} · {s.team} · {s._year} {s._half} · 완수 {fd(s.end)}</div></div>
            <Tag bg={TC[s.team]?.b} color={TC[s.team]?.a}>{s.team}</Tag>
          </div>
        ))}
      </div>
    ),
    export: <ExportImportPage db={db} setDb={setDb}/>,
    settings: <SettingsPage cfgVer={cfgVer} logs={logs} editor={editor} authUser={authUser} onLogout={logout} db={db} setDb={setDb}/>,
  };

  /* 인증 게이트 */
  if (authUser === undefined) {
    return (
      <div style={{ minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,fontFamily:F }}>
        <div style={{ fontSize:26,fontWeight:900,color:C.t1 }}><span style={{ color:C.blue }}>◈</span> STON</div>
        <div style={{ width:30,height:30,border:`3px solid ${C.border}`,borderTopColor:C.blue,borderRadius:"50%",animation:"spin .8s linear infinite" }}/>
        <div style={{ fontSize:12,color:C.t3 }}>로그인 상태 확인 중…</div>
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }
  if (!authUser) return <LoginScreen/>;

  return (
    <div style={{ fontFamily:F,background:C.bg,minHeight:"100vh",display:"flex",color:C.t1,fontSize:13 }}>
      <style>{`*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:${C.surfaceL}}::-webkit-scrollbar-thumb{background:${C.borderD};border-radius:4px}input::placeholder,textarea::placeholder{color:${C.t4}}button{cursor:pointer;transition:all .12s}button:hover{opacity:.85}input,textarea,select{max-width:100%}input[type="date"]{color-scheme:light}@keyframes spin{to{transform:rotate(360deg)}}`}</style>

      {!loaded && (
        <div style={{ position:"fixed",inset:0,background:C.bg,zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16 }}>
          <div style={{ fontSize:26,fontWeight:900,color:C.t1 }}><span style={{ color:C.blue }}>◈</span> STON</div>
          <div style={{ width:30,height:30,border:`3px solid ${C.border}`,borderTopColor:C.blue,borderRadius:"50%",animation:"spin .8s linear infinite" }}/>
          <div style={{ fontSize:12,color:C.t3 }}>Firebase 실시간 데이터 불러오는 중…</div>
        </div>
      )}

      {/* 모바일 사이드바 배경 딤 */}
      {isMobile && sideOpen && (
        <div onClick={()=>setSideOpen(false)}
          style={{ position:"fixed",inset:0,background:"rgba(20,25,40,.45)",zIndex:99 }}/>
      )}

      <aside style={{ width:sideOpen?(isMobile?280:214):0,minWidth:sideOpen?(isMobile?280:214):0,maxWidth:"85vw",
        background:C.surface,borderRight:BD,overflow:"hidden",
        transition:"width .22s,min-width .22s",position:"fixed",top:0,left:0,height:"100vh",zIndex:100,display:"flex",flexDirection:"column",boxShadow:sideOpen?"2px 0 16px rgba(0,0,0,.12)":"none" }}>
      <div style={{ width:isMobile?280:214,maxWidth:"85vw",height:"100%",display:"flex",flexDirection:"column",overflowY:"auto" }}>
        <div style={{ padding:"20px 18px 14px",borderBottom:BD,whiteSpace:"nowrap" }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
            <div><div style={{ fontSize:18,fontWeight:900,color:C.t1,letterSpacing:-.5 }}><span style={{ color:C.blue }}>◈</span> STON</div>
              <div style={{ fontSize:9,color:C.t4,marginTop:2,letterSpacing:2,fontWeight:600 }}>현장조사팀</div></div>
            <button onClick={()=>setSideOpen(false)} style={{ background:"transparent",border:"none",color:C.t4,fontSize:18,padding:"2px 4px" }}>☰</button>
          </div>

          {/* 연결 상태 + 저장 표시 */}
          <div style={{ display:"flex",alignItems:"center",gap:6,marginTop:11 }}>
            <div style={{ display:"flex",alignItems:"center",gap:5,fontSize:10,fontWeight:700,
              color:online?C.green:fbStatus==="연결 중..."?C.orange:C.t3 }}>
              <div style={{ width:7,height:7,borderRadius:"50%",
                background:online?C.green:fbStatus==="연결 중..."?C.orange:C.t4,
                boxShadow:online?`0 0 6px ${C.green}`:"none" }}/>
              {online ? "실시간 연결됨" : fbStatus}
            </div>
            {syncing && <span style={{ fontSize:9,color:C.blue,fontWeight:600,marginLeft:"auto" }}>저장 중…</span>}
            {!syncing && online && <span style={{ fontSize:9,color:C.t4,marginLeft:"auto" }}>✓ 저장됨</span>}
          </div>

          {/* 동시 접속자 + 마지막 수정 */}
          <div style={{ marginTop:8,padding:"7px 9px",background:C.surfaceL,borderRadius:7,border:BD }}>
            <div style={{ display:"flex",alignItems:"center",gap:5,fontSize:9,color:C.t2,fontWeight:600 }}>
              <span style={{ width:5,height:5,borderRadius:"50%",background:users>0?C.green:C.t4 }}/>
              동시 접속 {users}명
            </div>
            {meta?.at && (
              <div style={{ fontSize:9,color:C.t3,marginTop:4,whiteSpace:"normal",lineHeight:1.4 }}>
                마지막 수정 · <b style={{ color:C.t2 }}>{meta.by||"익명"}</b>님 {fmtMeta(meta.at)}
              </div>
            )}
          </div>

          {/* 내 이름 */}
          <div style={{ marginTop:8 }}>
            <select value={editor} onChange={e=>saveName(e.target.value)}
              style={{ width:"100%",padding:"6px 8px",background:C.surface,border:BD,borderRadius:6,
                color:editor?C.t1:C.t4,fontSize:11,outline:"none",fontWeight:600 }}>
              <option value="">내 이름 선택 (수정 기록용)</option>
              {Object.entries(TEAM_MEMBERS).map(([t,arr])=>(
                <optgroup key={t} label={t}>
                  {arr.map(n=><option key={n} value={n}>{n}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
          <button onClick={enablePush} style={{ width:"100%",marginTop:7,padding:"7px 8px",borderRadius:7,
            border:`1.5px solid ${C.blue}40`,background:C.blueL,color:C.blue,fontSize:11,fontWeight:700,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",gap:5 }}>🔔 알림 켜기</button>
        </div>

        <div style={{ padding:"10px 16px 8px",borderBottom:BD }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7 }}>
            <span style={{ fontSize:9,color:C.t4,letterSpacing:1,fontWeight:700 }}>팀 구분 (클릭 필터)</span>
            {globalTeam!=="전체" && <button onClick={()=>setGlobalTeam("전체")} style={{ fontSize:9,color:C.t3,background:"transparent",border:"none",cursor:"pointer",textDecoration:"underline",padding:0 }}>전체</button>}
          </div>
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:6 }}>
            {FIELD_TEAMS().map(t=>{
              const v=TC[t]||{a:C.t3,b:C.surfaceL,c:C.t2};
              const active=globalTeam===t;
              return (
                <button key={t} onClick={()=>setGlobalTeam(active?"전체":t)} style={{ padding:"7px 0",borderRadius:7,textAlign:"center",cursor:"pointer",
                  background:active?v.a:v.b,border:`1.5px solid ${active?v.a:v.a+"40"}`,boxShadow:active?`0 2px 8px ${v.a}50`:"none",transition:"all .15s" }}>
                  <div style={{ display:"flex",alignItems:"center",justifyContent:"center",gap:5 }}>
                    <div style={{ width:7,height:7,borderRadius:"50%",background:active?"#fff":v.a }}/>
                    <span style={{ fontSize:11,fontWeight:700,color:active?"#fff":v.a }}>{t}</span>
                    <span style={{ fontSize:9,color:active?"rgba(255,255,255,.7)":v.c }}>{allSchools.filter(s=>s.team===t).length}</span>
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <nav style={{ flex:1,padding:"8px 0",overflowY:"auto" }}>
          <div style={{ padding:"8px 16px 3px",fontSize:9,color:C.t4,letterSpacing:1.5,fontWeight:700 }}>MAIN</div>
          {MENUS.slice(0,4).map(m=>(
            <button key={m.id} onClick={()=>setMenu(m.id)} style={{ width:"100%",display:"flex",alignItems:"center",gap:10,padding:"12px 18px",
              background:menu===m.id?C.blueL:"transparent",borderLeft:`3px solid ${menu===m.id?C.blue:"transparent"}`,border:"none",
              color:menu===m.id?C.blue:C.t2,fontSize:13,fontWeight:menu===m.id?700:500,textAlign:"left",whiteSpace:"nowrap" }}>
              <span style={{ fontSize:15 }}>{m.icon}</span><span style={{ flex:1 }}>{m.label}</span>
            </button>
          ))}
          <div style={{ height:1,background:C.border,margin:"8px 14px" }}/>
          <div style={{ padding:"6px 16px 3px",fontSize:9,color:C.t4,letterSpacing:1.5,fontWeight:700 }}>REPORT</div>
          {MENUS.slice(4).map(m=>(
            <button key={m.id} onClick={()=>setMenu(m.id)} style={{ width:"100%",display:"flex",alignItems:"center",gap:10,padding:"10px 18px",
              background:menu===m.id?C.blueL:"transparent",borderLeft:`3px solid ${menu===m.id?C.blue:"transparent"}`,border:"none",
              color:menu===m.id?C.blue:C.t3,fontSize:12,fontWeight:menu===m.id?700:400,textAlign:"left",whiteSpace:"nowrap" }}>
              <span style={{ fontSize:13 }}>{m.icon}</span><span style={{ flex:1 }}>{m.label}</span>
              {m.id==="urgent"&&urgent.length>0 && <span style={{ background:C.red,color:"#fff",fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:10 }}>{urgent.length}</span>}
            </button>
          ))}
        </nav>

        <div style={{ padding:"12px 16px",borderTop:BD }}>
          <div style={{ fontSize:9,color:C.t4,marginBottom:8,letterSpacing:1,fontWeight:700 }}>연도별 현장</div>
          {Object.entries(db).sort((a,b)=>b[0]-a[0]).map(([y,hs])=>(
            <div key={y} style={{ marginBottom:6 }}>
              <div style={{ fontSize:11,fontWeight:700,color:C.t2,marginBottom:3 }}>{y}년</div>
              <div style={{ display:"flex",gap:5 }}>
                {Object.entries(hs).map(([h,ss])=>(
                  <div key={h} style={{ fontSize:10,color:h==="상반기"?C.blue:C.orange,background:h==="상반기"?C.blueL:C.orangeL,padding:"2px 7px",borderRadius:5,fontWeight:600 }}>
                    {h==="상반기"?"🌱":"🍂"} {ss.length}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
      </aside>

      <main style={{ marginLeft:isMobile?0:(sideOpen?214:0),flex:1,transition:"margin .22s",display:"flex",flexDirection:"column",minWidth:0 }}>
        <header style={{ height:52,background:C.surface,borderBottom:`1.5px solid ${C.borderD}`,display:"flex",alignItems:"center",padding:isMobile?"0 14px":"0 22px",gap:12,position:"sticky",top:0,zIndex:50,boxShadow:"0 1px 6px rgba(0,0,0,.06)" }}>
          <button onClick={()=>setSideOpen(v=>!v)} style={{ width:34,height:34,borderRadius:8,background:C.surfaceL,border:BD,color:C.t2,fontSize:17,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",flexShrink:0 }}>
            ☰{!sideOpen&&urgent.length>0 && <span style={{ position:"absolute",top:-4,right:-4,background:C.red,color:"#fff",fontSize:8,fontWeight:700,padding:"1px 4px",borderRadius:8 }}>{urgent.length}</span>}
          </button>
          <div style={{ fontSize:14,fontWeight:800,color:C.t1 }}>{MENUS.find(m=>m.id===menu)?.icon} {MENUS.find(m=>m.id===menu)?.label}</div>
          <div style={{ flex:1 }}/>
          {!isMobile && <div style={{ fontSize:10,color:C.t3 }}>기준일 {BASE_DATE} · 연도/반기별 분리</div>}
          {!isMobile && <button onClick={()=>setMenu("schedule")} style={{ padding:"6px 13px",background:menu==="schedule"?C.blueL:"transparent",border:`1.5px solid ${menu==="schedule"?C.blue:C.border}`,borderRadius:8,color:menu==="schedule"?C.blue:C.t3,fontSize:11,fontWeight:700 }}>📅 현장일정</button>}
          {!isMobile && <button onClick={()=>setMenu("sites")} style={{ padding:"6px 13px",background:menu==="sites"?C.greenL:"transparent",border:`1.5px solid ${menu==="sites"?C.green:C.border}`,borderRadius:8,color:menu==="sites"?C.green:C.t3,fontSize:11,fontWeight:700 }}>🏫 현장관리</button>}
        </header>
        <div style={{ padding:isMobile?14:22,overflowY:"auto",flex:1 }}>{pages[menu]}</div>
      </main>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
</body>
</html>

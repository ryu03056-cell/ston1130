/* ── 직급 ──
   순서가 곧 정렬 우선순위. 같은 직급이면 이름 가나다순으로 정렬한다. */
const RANKS = ["대표", "상무", "이사", "차장", "팀장", "과장", "대리", "주임", "보조인원"];

};

/* 직급 → 이름 순으로 정렬 */
const byRank = (a, b) => rankIdx(a) - rankIdx(b) || String(a).localeCompare(String(b), "ko");

const CATS = [{

  if (/교량|터널|지하차도|육교|배수로|암거/.test(t)) return "토목종";
  return "건축";
};
/* 학교의 시설물 개수 — [건축물, 토목(종), 토목(소)] */
const catCounts = s => {

    토목종: 0,
    토목소: 0
  };
  (s && s.buildings || []).forEach(b => {

  });
  return out;
};

/* 현장 표시(드론·1년·피난) — 학교 단위, 중복 선택 가능 */
const FLAG_OPTS = [{
  v: "드론",
  label: "🚁 드론",
  color: C.orange
}, {
  v: "1년",
  label: "📅 1년",
  color: C.blue
}, {
  v: "피난",
  label: "🚪 피난",
  color: C.purple
}];
/* 신규 현장 — 엑셀 A열 '점검회차'가 '신규'이면 표시.
   신규는 보고서 작성에 시간이 더 들어 눈에 띄어야 한다. */
const isNewSite = s => !!(s && (s.isNew || String(s.round || "").includes("신규")));

const getFlags = s => {
  if (s && s.flags && typeof s.flags === "object") {
    const a = toArr(s.flags).filter(Boolean);
    if (a.length || Array.isArray(s.flags)) return a;
  }
  /* 예전 데이터 호환: 동별 flag(●=드론)를 학교 단위로 합침 */
  const set = new Set();
  (s?.buildings || []).forEach(b => {
    if (!b || !b.flag) return;
    if (b.flag === "●" || b.flag === "드론") set.add("드론");else if (b.flag === "1년") set.add("1년");else if (b.flag === "피난") set.add("피난");
  });
  return [...set];
};
/* ══════════════════════════════════════════════════════════════
   중복 방지 — 같은 현장이 두 번 올라가지 않게 자동 정리
   · 학교명 표기 차이(여주고 / 여주고등학교 / 공백·괄호)를 같은 이름으로 인식
   · 단, 옹벽과 건물처럼 관리번호도 동도 다른 '별개 건'은 그대로 둔다
   ══════════════════════════════════════════════════════════════ */
const normSchool = v => String(v == null ? "" : v).replace(/\s+/g, "").replace(/[（]/g, "(").replace(/[）]/g, ")").replace(/[·・‧∙\-_.]/g, "").replace(/여자고등학교/g, "여고").replace(/여자중학교/g, "여중").replace(/초등학교/g, "초").replace(/중학교/g, "중").replace(/고등학교/g, "고").toLowerCase();
const bldKey = b => String(b && b.b || "").replace(/\s+/g, "").toLowerCase();

/* 같은 학교명 안에서 '같은 건'인지 판정 */
function isSameSite(a, b) {
  if (a.carried || b.carried) return true; // 이월본은 실제 데이터와 같은 건
  const na = String(a.no || "").trim(),
    nb = String(b.no || "").trim();
  if (na && nb && na === nb) return true; // 관리번호가 같음
  const sa = new Set((a.buildings || []).map(bldKey).filter(Boolean));
  const sb = new Set((b.buildings || []).map(bldKey).filter(Boolean));
  /* 동 구성이 완전히 같으면 같은 건 (번호만 다르게 두 번 적힌 경우) */
  if (sa.size && sa.size === sb.size && [...sa].every(x => sb.has(x))) return true;
  if (!na || !nb) {
    // 한쪽에 번호가 없는 '껍데기 행'
    if ([...sb].some(x => sa.has(x))) return true; // 동이 하나라도 겹치면 같은 건
    const shell = (x, set) => set.size <= 1 && (set.size === 0 || normSchool([...set][0]) === normSchool(x.school));
    if (shell(a, sa) || shell(b, sb)) return true; // 동명이 학교명뿐인 행
  }
  return false; // 번호도 동도 다르면 별개 건(옹벽/건물 등)
}

/* 동 목록 합치기 — 이름 기준 합집합, 값이 있는 쪽을 채택 */
function mergeBuildings(A, B) {
  const out = [],
    idx = new Map();
  [...(A || []), ...(B || [])].forEach(b => {
    if (!b) return;
    const k = bldKey(b);
    if (!k) {
      out.push(b);
      return;
    }
    const i = idx.get(k);
    if (i === undefined) {
      idx.set(k, out.length);
      out.push({
        ...b
      });
      return;
    }
    const cur = out[i];
    Object.entries(b).forEach(([f, v]) => {
      if (v != null && v !== "" && (cur[f] == null || cur[f] === "")) cur[f] = v;
    });
    cur.rep = cur.rep || b.rep;
    cur.fmsD = cur.fmsD || b.fmsD;
    cur.delivery = cur.delivery || b.delivery;
  });
  return out;
}

/* 중복 두 건을 하나로 — 실제 데이터/정보 많은 쪽을 기준으로 삼고 빈 값만 채운다 */
function mergeSites(a, b) {
  const base = a.carried && !b.carried ? b : !a.carried && b.carried ? a : (b.buildings || []).length > (a.buildings || []).length ? b : a;
  const other = base === a ? b : a;
  const pick = f => {
    const v = base[f];
    return v == null || v === "" ? other[f] ?? null : v;
  };
  return {
    ...base,
    id: a.id,
    // 먼저 있던 id 유지
    no: String(base.no || "").trim() || other.no || "",
    school: (base.school || "").length >= (other.school || "").length ? base.school : other.school,
    region: pick("region") || "",
    tel: pick("tel") || "",
    kind: pick("kind") || "정기점검",
    field: pick("field"),
    start: pick("start"),
    end: pick("end"),
    contract: base.contract != null && base.contract > 0 ? base.contract : other.contract ?? null,
    /* 나중에 추가된 항목들 — 한쪽에만 있으면 그 값을 살린다 */
    fieldEnd: pick("fieldEnd") || "",
    fieldExtra: [...new Set([...toArr(base.fieldExtra), ...toArr(other.fieldExtra)])].filter(Boolean).sort(),
    fieldWho: {
      ...(other.fieldWho || {}),
      ...(base.fieldWho || {})
    },
    deliverDate: pick("deliverDate") || "",
    isNew: !!(base.isNew || other.isNew),
    tentative: !!(base.tentative && other.tentative),
    memo: pick("memo") || "",
    round: pick("round") || "",
    assignees: base.assignees && base.assignees.length ? base.assignees : other.assignees || [],
    headcount: base.headcount || other.headcount || 2,
    progress: base.progress && Object.keys(base.progress).length ? base.progress : other.progress || {},
    flags: [...new Set([...(getFlags(base) || []), ...(getFlags(other) || [])])],
    carried: !!(base.carried && other.carried),
    // 한쪽이라도 실제 데이터면 실제로
    buildings: mergeBuildings(base.buildings, other.buildings)
  };
}

/* 한 반기(또는 LH) 안에서 중복 제거 — 순서 유지 */
function dedupeBucket(arr) {
  const all = (arr || []).filter(Boolean);
  /* 휴지통(삭제 표시) 현장은 병합 대상에서 빼둔다.
     이걸 안 빼면 버려진 '새 현장'이 새로 추가한 현장을 빨아들이고
     deleted:true 까지 물려줘서, 추가해도 화면에 안 나타난다. */
  const trashed = all.filter(s => s.deleted);
  const list = all.filter(s => !s.deleted);
  const kept = [],
    slots = new Map(); // 학교명 → kept 인덱스 목록
  list.forEach(s => {
    const nm = normSchool(s.school);
    if (!nm) {
      kept.push(s);
      return;
    }
    const idxs = slots.get(nm) || [];
    const hit = idxs.find(i => isSameSite(kept[i], s));
    if (hit === undefined) {
      kept.push(s);
      idxs.push(kept.length - 1);
      slots.set(nm, idxs);
    } else kept[hit] = mergeSites(kept[hit], s);
  });
  return kept.concat(trashed);
}

/* db 전체 중복 정리 — 바뀐 게 없으면 원본을 그대로 돌려준다(불필요한 저장 방지) */
function dedupeDb(db) {
  let changed = false;
  const next = {};
  Object.entries(db || {}).forEach(([y, hs]) => {
    next[y] = {};
    Object.entries(hs || {}).forEach(([h, arr]) => {
      const d = dedupeBucket(arr);
      if (d.length !== (arr || []).length) changed = true;
      next[y][h] = d;
    });
  });
  return changed ? next : db;
}

  const r0 = new Array(nC).fill("");
  r0[3] = "계약완료";
  r0[4] = "현장조사완료";
  r0[5] = "납품완료";
  aoa.push(r0);
  aoa.push(HEAD1.map(v => v == null ? "" : v));
  aoa.push(HEAD2.map(v => v == null ? "" : v));
  const mkDate = v => {
    if (!v) return "";
    const p = String(v).split("-").map(Number);
    return p.length === 3 && p[0] ? new Date(p[0], p[1] - 1, p[2], 12) : "";
  };
  const rows = []; // {r, kind:'school'|'bld', last}
  schools.forEach(s => {
    const cc = catCounts(s);
    const done = siteDone(s);
    const deliv = siteDelivered(s);
    const pg = s.progress || {};
    const prog = STEPS.filter(k => pg[k]);
    /* FMS 는 첫 시설의 계정을 학교행에 올린다 (원본 양식과 동일) */
    const fms = String((s.buildings || []).map(b => b.fms).find(Boolean) || "");
    const fmsPart = fms.split("//").map(x => x.trim());
    const notes = (s.buildings || []).map(b => b.note).filter(Boolean).join(" / ");
    const schoolRow = new Array(nC).fill("");
    schoolRow[0] = isNewSite(s) ? "신규" : s.round || "-";
    schoolRow[1] = s.no || "";
    schoolRow[2] = s.kind || "정기점검";
    schoolRow[3] = s.region || "";
    schoolRow[4] = s.school || "";
    schoolRow[6] = cc.건축 || "";
    schoolRow[7] = cc.토목종 || "";
    schoolRow[8] = cc.토목소 || "";
    schoolRow[14] = mkDate(s.start);
    schoolRow[15] = mkDate(s.field);
    schoolRow[16] = mkDate(s.end);
    schoolRow[17] = mkDate(s.deliverDate);
    schoolRow[18] = done ? "완료" : "미완";
    schoolRow[19] = deliv ? "완료" : "미납";
    schoolRow[20] = (s.buildings || []).map(b => b.delivery).find(Boolean) || "";
    schoolRow[21] = fmsPart[0] || "";
    schoolRow[22] = fmsPart[1] || "";
    schoolRow[23] = (s.buildings || []).every(b => b.fmsD) && (s.buildings || []).length ? "O" : "";
    schoolRow[24] = notes;
    schoolRow[25] = s.memo || "";
    /* 앱 전용 (AB~AF) */
    /* AA열 — 달력 시트가 FILTER 로 끌어가는 표시 문자열 (원본과 동일한 수식) */
    schoolRow[26] = null; // 수식은 아래에서 직접 넣는다
    schoolRow[27] = sortMembers(s.assignees).join(", ");
    schoolRow[28] = s.tel || "";
    schoolRow[29] = getFlags(s).join(",");
    schoolRow[30] = prog.join(",");
    schoolRow[31] = `${prog.length}/${STEPS.length}`;
    /* 조사가 여러 날이면 P열은 첫날만 두고(달력 수식이 날짜 하나를 비교하므로)
       전체 일정은 이 칸에 따로 적는다. */
    const sd = surveyDates(s);
    schoolRow[34] = isTentative(s) ? "예정" : "확정";
    schoolRow[33] = sd.length > 1 ? `${s.fieldEnd && s.fieldEnd > s.field ? `${s.field}~${s.fieldEnd}` : s.field}${(s.fieldExtra || []).length ? `,${(s.fieldExtra || []).join(",")}` : ""}` : "";
    rows.push({
      r: aoa.length,
      kind: "school"
    });
    aoa.push(schoolRow);
    /* 학교명과 같은 이름의 단일 동은 원본에 시설 행이 없던 경우 → 그대로 생략 */
    const bs = (s.buildings || []).length === 1 && (s.buildings[0].b || "").trim() === (s.school || "").trim() && !s.buildings[0].floor && s.buildings[0].area == null ? [] : s.buildings || [];
    bs.forEach(b => {
      const br = new Array(nC).fill("");
      br[2] = s.kind || "정기점검";
      br[5] = b.b || "";
      br[9] = b.jong || "";
      br[10] = b.floor || "";
      br[11] = b.area != null && b.area !== "" && !isNaN(Number(b.area)) ? Number(b.area) : "";
      br[12] = b.len || "";
      br[13] = b.height || "";
      br[24] = b.note || "";
      br[32] = bldCat(b); // 시설 분류 (앱 전용)
      rows.push({
        r: aoa.length,
        kind: "bld"
      });
      aoa.push(br);
    });
    if (rows.length) rows[rows.length - 1].last = true; // 학교 블록의 마지막 줄
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa, {
    cellDates: true
  });
  /* 열 너비 — 원본 값 */
  ws["!cols"] = [4.6, 4.6, 12.6, 5.6, 29.5, 29, 6.6, 6.6, 6.6, 10.6, 8.6, 8.6, 8.6, 8.6, 10.6, 10.6, 10.6, 10.6, 4.6, 5.6, 5.6, 12.6, 12.6, 4.6, 45.6, 12, 2, 16, 13, 10, 22, 6, 8, 22, 9].map(w => ({
    wch: Math.max(1, w - 0.8)
  }));
  /* 시설물 행은 접어 둔다 — 왼쪽 [+] 버튼으로 펼쳐 볼 수 있게 (원본과 동일) */
  ws["!rows"] = aoa.map((_, i) => {
    const row = rows.find(x => x.r === i);
    return row && row.kind === "bld" ? {
      hpt: 20.1,
      level: 1,
      hidden: true
    } : {
      hpt: 20.1
    };
  });
  /* 2단 헤더 병합 (원본과 동일) */
  const M = (r1, c1, r2, c2) => ({
    s: {
      r: r1,
      c: c1
    },
    e: {
      r: r2,
      c: c2
    }
  });
  ws["!merges"] = [M(1, 0, 2, 0), M(1, 1, 2, 1), M(1, 2, 2, 2), M(1, 3, 2, 3), M(1, 4, 2, 4), M(1, 5, 2, 5), M(1, 6, 1, 8), M(1, 9, 2, 9), M(1, 10, 1, 11), M(1, 12, 1, 13), M(1, 14, 2, 14), M(1, 15, 2, 15), M(1, 16, 2, 16), M(1, 17, 2, 17), M(1, 18, 2, 18), M(1, 19, 1, 20), M(1, 21, 1, 23), M(1, 24, 2, 24), M(1, 25, 2, 25), M(1, 27, 2, 27), M(1, 28, 2, 28), M(1, 29, 2, 29), M(1, 30, 2, 30), M(1, 31, 2, 31), M(1, 32, 2, 32), M(1, 33, 2, 33), M(1, 34, 2, 34)];
  /* 헤더 3줄 고정 — 스크롤해도 항목명이 보이게 */
  ws["!freeze"] = {
    xSplit: 0,
    ySplit: 3,
    topLeftCell: "A4",
    activePane: "bottomLeft",
    state: "frozen"
  };
  ws["!views"] = [{
    state: "frozen",
    xSplit: 0,
    ySplit: 3,
    topLeftCell: "A4",
    activePane: "bottomLeft"
  }];
  ws["!autofilter"] = {
    ref: XLSX.utils.encode_range({
      s: {
        r: 1,
        c: 0
      },
      e: {
        r: Math.max(3, aoa.length - 1),
        c: nC - 1
      }
    })
  };
  /* AA열 수식 — 학교행마다 "No. 지역 학교명 (건축/토목종/토목소) - 완수/납품" 을 만든다.
     달력 시트가 이 값을 날짜로 걸러서 가져간다. */
  rows.forEach(row => {
    if (row.kind !== "school") return;
    const n = row.r + 1; // 엑셀 행번호(1-based)
    const a = XLSX.utils.encode_cell({
      r: row.r,
      c: 26
    });
    ws[a] = {
      t: "s",
      f: `B${n}&". "&D${n}&" "&E${n}&" ("&G${n}&"/"&H${n}&"/"&I${n}&")"&" - "&S${n}&"/"&T${n}`
    };
  });
  const put = (r, c, st) => {
    const a = XLSX.utils.encode_cell({
      r,
      c
    });
    if (!ws[a]) ws[a] = {
      t: "s",
      v: ""
    };
    ws[a].s = st;
  };
  /* 1행 범례 — 원본의 세 가지 색 */
  const LEGEND = {
    3: XLC.legendContract,
    4: XLC.legendField,
    5: XLC.legendDeliver
  };
  for (let c = 0; c < nC; c++) put(0, c, LEGEND[c] ? {
    font: {
      name: XL_FONT,
      sz: 10
    },
    alignment: {
      horizontal: "center",
      vertical: "center"
    },
    fill: {
      patternType: "solid",
      fgColor: {
        rgb: LEGEND[c]
      }
    }
  } : {
    font: {
      name: XL_FONT,
      sz: 10
    }
  });
  /* 2~3행 헤더 */
  for (let r = 1; r <= 2; r++) for (let c = 0; c < nC; c++) put(r, c, {
    font: {
      name: XL_FONT,
      sz: r === 2 ? 8 : 10,
      // 3행(세부 항목)은 8pt
      bold: true,
      color: {
        rgb: "FF000000"
      }
    },
    alignment: {
      horizontal: "center",
      vertical: "center",
      wrapText: true
    },
    border: xlBorder("thin"),
    fill: {
      patternType: "solid",
      fgColor: {
        rgb: XLC.header
      }
    }
  });
  /* 데이터 — 학교행은 굵게, 시설행은 보통 */
  const LEFT = new Set([4, 5, 24, 25, 27]);
  const DATE_C = new Set([14, 15, 16, 17]);
  rows.forEach(row => {
    const isSchool = row.kind === "school";
    for (let c = 0; c < nC; c++) {
      const a = XLSX.utils.encode_cell({
        r: row.r,
        c
      });
      if (!ws[a]) ws[a] = {
        t: "s",
        v: ""
      };
      ws[a].s = {
        font: {
          name: XL_FONT,
          sz: 10,
          bold: isSchool && (c === 1 || c === 4),
          color: {
            rgb: "FF000000"
          }
        },
        alignment: {
          horizontal: LEFT.has(c) ? "left" : "center",
          vertical: "center",
          wrapText: c === 24
        },
        border: xlBorder(row.kind === "school" ? "thin" : "hair", row.last ? "thin" : "hair")
      };
      if (DATE_C.has(c) && ws[a].t === "d") ws[a].z = "mm-dd-yy";
      if (c === 11 && typeof ws[a].v === "number") ws[a].z = "#,##0.00";
    }
  });
  return ws;
}

/* 범용 스타일 표 — headers:[…], rows:[[…]], meta:[{align,date,num,bold,wrap,team,w}], opts:{totalRow} */
function buildAuxSheet(headers, rows, meta, opts = {}) {
  const aoa = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa, {
    cellDates: true
  });
  const nC = headers.length,
    last = aoa.length - 1;
  ws["!cols"] = meta.map(m => ({
    wch: m.w || 12
  }));
  ws["!rows"] = [{
    hpt: 26
  }];
  ws["!autofilter"] = {
    ref: XLSX.utils.encode_range({
      s: {
        r: 0,
        c: 0
      },
      e: {
        r: 0,
        c: nC - 1
      }
    })
  };
  ws["!freeze"] = {
    xSplit: 0,
    ySplit: 1,
    topLeftCell: "A2",
    activePane: "bottomLeft",
    state: "frozen"
  };
  for (let c = 0; c < nC; c++) {
    const a = XLSX.utils.encode_cell({
      r: 0,
      c
    });
    if (!ws[a]) ws[a] = {
      t: "s",
      v: headers[c]
    };
    ws[a].s = {

        }
      },

        horizontal: "center",
        vertical: "center",
        wrapText: true
      },
      border: {
        top: {
          style: "thin",
          color: {
            rgb: "FF1559C9"
          }
        },
        bottom: {
          style: "medium",
          color: {
            rgb: "FF1559C9"
          }
        },
        left: {
          style: "thin",
          color: {
            rgb: "FF4D8AE8"
          }
        },
        right: {
          style: "thin",
          color: {
            rgb: "FF4D8AE8"
          }
        }
      }
    };
  }
  for (let r = 1; r <= last; r++) {
    const totalRow = opts.totalRow && r === last;
    /* 데이터 행은 색 없이 흰 배경 · 검정 글자 (헤더만 색) */
    for (let c = 0; c < nC; c++) {
      const m = meta[c] || {};
      const a = XLSX.utils.encode_cell({
        r,
        c
      });
      if (!ws[a]) ws[a] = {
        t: "s",
        v: ""
      };
      let fill = "FFFFFFFF";
      let font = {
        name: "맑은 고딕",
        sz: 9.5,
        color: {
          rgb: "FF1A2332"
        }
      };
      if (totalRow) font = {
        ...font,
        bold: true
      };else if (m.bold || m.num) font = {
        ...font,
        bold: true
      };
      ws[a].s = {
        font,
        fill: {
          patternType: "solid",
          fgColor: {
            rgb: fill
          }
        },
        alignment: {
          vertical: m.wrap ? "top" : "center",
          horizontal: m.align || "center",
          wrapText: !!m.wrap
        },
        border: {
          top: {
            style: "thin",
            color: {
              rgb: "FFE3E8F0"
            }
          },
          bottom: {
            style: "thin",
            color: {
              rgb: "FFEDF0F5"
            }
          },
          left: {
            style: "thin",
            color: {
              rgb: "FFE3E8F0"
            }
          },
          right: {
            style: "thin",
            color: {
              rgb: "FFE3E8F0"
            }
          }
        }
      };
      if (m.date && ws[a].t === "d") ws[a].z = "yyyy-mm-dd";
      if (m.num && typeof ws[a].v === "number") ws[a].z = "#,##0";
    }
  }
  return ws;
}

/* 예산표 시트 — entries:[{yr,half,schools}] */
function buildBudgetSheet(entries) {
  const HEAD = ["연도", "담당자", "지역", "학교명", "시설명", "시설 예산(원)", "학교 합계(원)"];
  const nC = HEAD.length;
  const aoa = [HEAD];
  const blocks = [];
  let grand = 0;
  entries.forEach(({
    yr,
    half,
    schools
  }) => (schools || []).forEach(s => {
    const bs = s.buildings && s.buildings.length ? s.buildings : [{
      b: s.school || "본관"
    }];
    const startRow = aoa.length;
    const total = Number(s.contract) || 0;
    grand += total;
    bs.forEach((b, bi) => {
      const first = bi === 0;
      const ba = b.budget != null && b.budget !== "" ? Number(b.budget) : "";
      aoa.push([first ? xlHalfLabel(yr, half) : "", first ? sortMembers(s.assignees).join(", ") : "", first ? s.region || "" : "", first ? s.school || "" : "", b.b || "", isNaN(ba) ? "" : ba, first ? total || "" : ""]);
    });
    blocks.push({
      startRow,
      rows: bs.length
    });
  }));
  aoa.push(["합계", "", "", "", "", "", grand]);
  const ws = XLSX.utils.aoa_to_sheet(aoa, {
    cellDates: true
  });
  const last = aoa.length - 1;
  ws["!cols"] = [11, 8, 8, 26, 24, 16, 16].map(w => ({
    wch: w
  }));
  ws["!rows"] = [{
    hpt: 28
  }];
  ws["!autofilter"] = {
    ref: XLSX.utils.encode_range({
      s: {
        r: 0,
        c: 0
      },
      e: {
        r: 0,
        c: nC - 1
      }
    })
  };
  ws["!freeze"] = {
    xSplit: 0,
    ySplit: 1,
    topLeftCell: "A2",
    activePane: "bottomLeft",
    state: "frozen"
  };
  const SCHOOL_COLS = [0, 1, 2, 3, 6];
  const LEFT_COLS = new Set([3, 4]);
  /* 헤더 */
  for (let c = 0; c < nC; c++) {
    const a = XLSX.utils.encode_cell({
      r: 0,
      c
    });
    if (!ws[a]) ws[a] = {
      t: "s",
      v: HEAD[c]
    };
    ws[a].s = {
      font: {
        name: "맑은 고딕",
        sz: 10,
        bold: true,
        color: {
          rgb: "FFFFFFFF"
        }
      },
      fill: {
        patternType: "solid",
        fgColor: {
          rgb: "FF1D6FF2"
        }
      },
      alignment: {
        horizontal: "center",
        vertical: "center",
        wrapText: true
      },
      border: {
        top: {
          style: "thin",
          color: {
            rgb: "FF1559C9"
          }
        },
        bottom: {
          style: "medium",
          color: {
            rgb: "FF1559C9"
          }
        },
        left: {
          style: "thin",
          color: {
            rgb: "FF4D8AE8"
          }
        },
        right: {
          style: "thin",
          color: {
            rgb: "FF4D8AE8"
          }
        }
      }
    };
  }
  /* 합계 행 */
  for (let c = 0; c < nC; c++) {
    const a = XLSX.utils.encode_cell({
      r: last,
      c
    });
    if (!ws[a]) ws[a] = {
      t: "s",
      v: ""
    };
    ws[a].s = {
      font: {
        name: "맑은 고딕",
        sz: 10,
        bold: true,
        color: {
          rgb: "FF1A2332"
        }
      },
      fill: {
        patternType: "solid",
        fgColor: {
          rgb: "FFFFFFFF"
        }
      },
      alignment: {
        horizontal: c === 6 ? "right" : "center",
        vertical: "center"
      },
      border: {
        top: {
          style: "medium",
          color: {
            rgb: "FFC2CCDC"
          }
        },
        bottom: {
          style: "medium",
          color: {
            rgb: "FFC2CCDC"
          }
        },
        left: {
          style: "thin",
          color: {
            rgb: "FFE3E8F0"
          }
        },
        right: {
          style: "thin",
          color: {
            rgb: "FFE3E8F0"
          }
        }
      }
    };
    if (c === 6 && typeof ws[a].v === "number") ws[a].z = "#,##0";
  }
  /* 데이터 블록 */
  blocks.forEach(bk => {
    for (let ri = 0; ri < bk.rows; ri++) {
      const r = bk.startRow + ri;
      const lastOfSchool = ri === bk.rows - 1;
      for (let c = 0; c < nC; c++) {
        const a = XLSX.utils.encode_cell({
          r,
          c
        });
        if (!ws[a]) ws[a] = {
          t: "s",
          v: ""
        };
        /* 데이터 행은 색 없이 흰 배경 · 검정 글자 (헤더만 색) */
        let fill = "FFFFFFFF",
          font = {
            name: "맑은 고딕",
            sz: 9.5,
            color: {
              rgb: "FF1A2332"
            }
          };
        if (c === 3 || c === 6) font = {
          ...font,
          bold: true
        };
        ws[a].s = {
          font,
          fill: {
            patternType: "solid",
            fgColor: {
              rgb: fill
            }

            vertical: SCHOOL_COLS.includes(c) ? "center" : "top",

          },
          border: {
            top: {
              style: "thin",
              color: {
                rgb: "FFE3E8F0"
              }
            },
            bottom: {
              style: lastOfSchool ? "medium" : "thin",
              color: {
                rgb: lastOfSchool ? "FFC2CCDC" : "FFEDF0F5"
              }
            },
            left: {
              style: "thin",
              color: {
                rgb: "FFE3E8F0"
              }
            },
            right: {
              style: "thin",
              color: {
                rgb: "FFE3E8F0"
              }
            }
          }
        };
        if ((c === 5 || c === 6) && typeof ws[a].v === "number") ws[a].z = "#,##0";
      }
    }
    if (bk.rows > 1) {
      ws["!merges"] = ws["!merges"] || [];
      SCHOOL_COLS.forEach(c => ws["!merges"].push({
        s: {
          r: bk.startRow,
          c
        },
        e: {
          r: bk.startRow + bk.rows - 1,
          c
        }
      }));
    }
  });
  return ws;
}

/* 특이사항 시트 — entries:[{yr,half,schools}] */
function buildNotesSheet(entries) {
  const headers = ["연도", "담당자", "학교명", "시설명", "특기사항"];
  const meta = [{
    align: "center",
    w: 11
  }, {
    align: "center",
    team: true,
    w: 8
  }, {
    align: "left",
    bold: true,
    w: 22

function parseBudget(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, {
    header: 1,
    defval: null
  });
  const clean = v => v == null ? "" : String(v).replace(/\u00a0/g, " ").trim();
  const norm = v => clean(v).toLowerCase().replace(/[^a-z0-9가-힣]/g, "");
  /* 헤더 영역(학교명이 있는 행)과 그 아래 2행에서 열 탐지 */
  let schoolRow = -1,
    schoolCol = -1;
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const c = (rows[i] || []).findIndex(v => {
      const n = norm(v);
      return n === "학교명" || n === "시설물명";
    });
    if (c >= 0) {
      schoolRow = i;
      schoolCol = c;
      break;
    }
  }
  if (schoolRow < 0) return {};
  /* 금액 열: 학교명 행~+2행에서 '합계' 우선, 없으면 '예산액' */
  let amtCol = -1;
  for (const pat of ["합계", "예산액"]) {
    for (let i = schoolRow; i <= schoolRow + 2 && i < rows.length && amtCol < 0; i++) {
      const idx = (rows[i] || []).findIndex(v => norm(v).includes(pat));
      if (idx >= 0) amtCol = idx;
    }
    if (amtCol >= 0) break;
  }
  if (amtCol < 0) return {};
  const toNum = v => {
    if (v == null) return 0;
    const n = parseFloat(String(v).replace(/[^0-9.]/g, ""));
    return isNaN(n) ? 0 : n;
  };
  const out = {}; // { 학교명: { total:원, items:[원,…] (시설 순서) } }
  for (let i = schoolRow + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r) continue;
    const sch = clean(r[schoolCol]);
    if (!sch) continue;
    if (["합계", "소계", "총계", "학교수"].some(k => sch.includes(k))) continue; // 요약행 제외
    const won = toNum(r[amtCol]) * 1000; // 천원 → 원
    if (!out[sch]) out[sch] = {
      total: 0,
      items: []
    };
    out[sch].items.push(won); // 시설(행) 순서대로 누적 — 위치 매칭용
    out[sch].total += won;
  }
  return out;
}

/* 특이사항 시트 → [{school, building, note}]  (특기 헤더가 비어있어도 보고서완료 열 앞 칸으로 추정) */
function parseNotes(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, {
    header: 1,
    defval: null
  });
  const clean = v => v == null ? "" : String(v).replace(/\u00a0/g, " ").trim();
  const norm = v => clean(v).toLowerCase().replace(/[^a-z0-9가-힣]/g, "");
  let hIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 8); i++) {
    if ((rows[i] || []).some(v => {
      const n = norm(v);
      return n.includes("학교명") || n.includes("시설물명");
    })) {
      hIdx = i;
      break;
    }
  }
  if (hIdx < 0) return [];
  const H = (rows[hIdx] || []).map(norm);
  const schoolCol = H.findIndex(h => h.includes("학교명") || h.includes("시설물명"));
  const buildingCol = H.findIndex(h => h === "시설명" || h === "동명");
  let noteCol = H.findIndex(h => h.includes("특기"));
  if (noteCol < 0) {
    const repCol = H.findIndex(h => h.includes("보고서") && h.includes("완료"));
    if (repCol > 0) noteCol = repCol - 1;
  }
  if (schoolCol < 0 || noteCol < 0) return [];
  const out = [];
  let curSchool = "";
  for (let i = hIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r) continue;
    const sch = clean(r[schoolCol]);
    if (sch) curSchool = sch;
    const note = clean(r[noteCol]);
    if (note && curSchool) out.push({
      school: curSchool,
      building: buildingCol >= 0 ? clean(r[buildingCol]) : "",
      note
    });
  }
  return out;
}

/* 특이사항 노트를 학교의 해당 시설(동) 특기사항에 추가 병합 (중복 방지) */

  if (!notes || !notes.length) return 0;
  const byName = {};
  schools.forEach(s => {
    (byName[s.school] = byName[s.school] || []).push(s);

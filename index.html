/* 진행도 계산: done(완료 개수), pos(앞에서부터 연속 완료=현재 위치), pct(%) */
function getProgress(s) {
  const p = (s && s.progress) || {};
  const done = STEPS.filter(k => p[k]).length;
  let pos = 0;
  for (const k of STEPS) { if (p[k]) pos++; else break; }
  return { p, done, pos, pct: Math.round(done / STEPS.length * 100), total: STEPS.length };
}

  return Math.floor((new Date(y,m-1,d) - new Date(by,bm-1,bd)) / 86400000);

function Tag({ children, bg, color, border }) {
  return <span style={{ fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:4,
    background:bg, color, border:border||"none", lineHeight:1.6, whiteSpace:"nowrap" }}>{children}</span>;
}
function Pill({ children, active, ac, onClick, style={} }) {
  return <button onClick={onClick} style={{ padding:"5px 11px",borderRadius:20,fontSize:12,fontWeight:600,
    border:`1.5px solid ${active?ac:C.border}`, background:active?ac+"18":"transparent",
    color:active?ac:C.t3, cursor:"pointer", whiteSpace:"nowrap", ...style }}>{children}</button>;
}

  const { p, done, pct } = getProgress({ progress });
  const segH = compact ? 7 : 9;
  return (
    <div style={{ display:"flex",alignItems:"center",gap:compact?3:4,flexWrap:"wrap" }}>
      <div style={{ display:"flex",gap:compact?2:3 }}>
        {STEPS.map((k) => {
          const on = !!p[k];
          const sp = STEP_SPECIAL[k];
          const col = sp ? C.purple : C.blue;
          return (
            <div key={k} title={`${STEP_ICON[k]} ${k}${on?" ✓":""}`}
              style={{ width:compact?15:22, height:segH, borderRadius:3,
                background:on?col:C.surfaceD,
                border:sp ? `1.5px solid ${on?col:col+"55"}` : `1px solid ${on?col:"transparent"}`,
                boxSizing:"border-box" }}/>
          );
        })}
      </div>
      <span style={{ fontSize:compact?9:11,fontWeight:800,color:done===STEPS.length?C.green:C.t2,marginLeft:3 }}>
        {done}/{STEPS.length}
        <span style={{ fontSize:compact?8:10,fontWeight:600,color:C.t4,marginLeft:3 }}>{pct}%</span>
      </span>
    </div>
  );
}
function Toast({ msg }) {
  if (!msg) return null;
  return <div style={{ position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",
    background:C.surface,border:`1px solid ${C.green}`,borderRadius:10,padding:"11px 20px",
    fontSize:12,color:C.green,fontWeight:700,boxShadow:"0 8px 24px rgba(0,0,0,.15)",
    zIndex:600,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:8 }}>
    <span>✓</span>{msg}
  </div>;
}

/* 모바일 화면 감지 훅 */
function useIsMobile(bp = 820) {
  const [m, setM] = useState(typeof window !== "undefined" ? window.innerWidth < bp : false);
  useEffect(() => {
    const on = () => setM(window.innerWidth < bp);
    on();
    window.addEventListener("resize", on);
    return () => window.removeEventListener("resize", on);
  }, [bp]);
  return m;
}

/* ══════════════════════════════════════════════════════════════
   엑셀 파싱 / 내보내기
   엑셀 열: 1팀 2No 3종류 4지역 5학교 6시설 7층 8연면적 9높이 10길이
            11종별 12현장조사 13착수 14완수 15기간 16FMS 17플래그
            18특기 19보고서완료(◎) 20납품 21FMS등록(◎)
══════════════════════════════════════════════════════════════ */
function parseSheetName(name) {
  const m = name.match(/(\d{2})년\s*\(\s*([상하])\s*\)/);
  if (!m) return null;
  return { year:`20${m[1]}`, half:m[2]==="상"?"상반기":"하반기" };
}
function parseExcelDate(v) {
  if (!v) return null;
  if (v instanceof Date) {
    const tz = v.getTimezoneOffset()*60000;
    return new Date(v - tz).toISOString().slice(0,10);
  }
  if (typeof v === "number") {
    const d = new Date(Math.round((v-25569)*86400*1000));
    return d.toISOString().slice(0,10);
  }
  if (typeof v === "string") {
    const m = v.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  }
  return null;
}
function parseSheet(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });
  const teamMap = {}, schoolMap = {};
  for (let i=2; i<rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const no = r[1]; if (no==null) continue;
    const noStr = String(no).trim();
    const team  = r[0] ? String(r[0]).trim() : null;
    if (team) teamMap[noStr] = team;
    if (!schoolMap[noStr]) {
      schoolMap[noStr] = {
        id:`imp-${noStr}-${Math.random().toString(36).slice(2,8)}`,
        no:noStr, school:r[4]?String(r[4]).trim():"", region:r[3]?String(r[3]).trim():"",
        kind:r[2]?String(r[2]).trim():"정기점검", team:null,
        field:parseExcelDate(r[11]), start:parseExcelDate(r[12]), end:parseExcelDate(r[13]),
        headcount:2, assignees:[], buildings:[],
      };
    }
    schoolMap[noStr].buildings.push({
      b:r[5]?String(r[5]).trim():"", floor:r[6]?String(r[6]).trim():null,
      area:typeof r[7]==="number"?r[7]:(r[7]?parseFloat(String(r[7]).replace(/,/g,""))||null:null),
      fms:r[15]?String(r[15]).trim():null, flag:r[16]?String(r[16]).trim():null,
      note:r[17]?String(r[17]).trim():null,
      rep:r[18]==="◎"||r[18]==="○"||r[18]===true,
      fmsD:r[20]==="◎"||r[20]==="○"||r[20]===true,
      delivery:r[19]?String(r[19]).trim():null,
    });
  }
  Object.entries(schoolMap).forEach(([no,s]) => { s.team = teamMap[no] || "미지정"; });
  return Object.values(schoolMap);
}
function buildSheet(schools) {
  const today = new Date();
  const rows = [
    ["","","","","","","","","","","","현장완료","","","","","","","보고서완료","납품방법","FMS"],
    ["담당팀","No.","점검종류","지역","학교명","시설명","층수","연면적(㎡)","높이(m)","길이(m)",
     "종별","현장조사","착수일","완수일","용역기간","FMS아이디/비번","드론/피난/1년",
     "특기사항","보고서완료","납품방법","FMS등록"],
  ];
  schools.forEach(s => {
    let first = true;
    s.buildings.forEach(b => {
      const end = s.end ? new Date(s.end) : null;
      const d   = end ? Math.floor((end-today)/86400000) : null;
      const dd  = d===null ? "" : d>=0 ? `D+${d}` : `D${d}`;
      rows.push([
        first?s.team:"", first?s.no:"", first?s.kind:"", first?s.region:"", first?s.school:"",
        b.b||"", b.floor||"", b.area||"", "", "", "",
        first?(s.field||""):"", first?(s.start||""):"", first?(s.end||""):"", first?dd:"",
        b.fms||"", b.flag||"", b.note||"", b.rep?"◎":"", b.delivery||"", b.fmsD?"◎":"",
      ]);
      first = false;
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [6,5,10,8,22,20,6,11,8,8,18,11,11,11,9,26,11,42,10,9,8].map(w=>({wch:w}));
  return ws;
}

/* ══════════════════════════════════════════════════════════════
   날짜 클릭 상세 패널 (현장조사 · 완수일)

  const [editId, setEditId] = useState(null);

  const startSchools = allSchools.filter(s => s.start===dateStr && (teamF==="전체"||s.team===teamF));
  const endSchools   = allSchools.filter(s => s.end===dateStr   && (teamF==="전체"||s.team===teamF));

    if (!setDb) return;
    const sc = allSchools.find(s=>s.id===sid);
    if (!sc?._year || !sc?._half) return;
    setDb(prev => {
      const next = {...prev};
      next[sc._year] = {...prev[sc._year]};
      next[sc._year][sc._half] = prev[sc._year][sc._half].map(s => {
        if (s.id!==sid) return s;
        const cur = s.assignees||[];
        const upd = cur.includes(name) ? cur.filter(n=>n!==name) : [...cur,name];
        return {...s, assignees:upd, headcount:upd.length||s.headcount||1};
      });
      return next;
    });
  };

  const FieldCard = ({ s }) => {
    const tc = TC[s.team]||{a:C.t3,b:C.surfaceL,c:C.t2};
    const assignees = s.assignees||[];
    const available = (TEAM_MEMBERS[s.team]||[]).filter(n=>!assignees.includes(n));
    const open = pickerId===s.id;
    return (
      <div style={{ padding:"10px 11px",background:C.surface,borderRadius:9,
        border:`1px solid ${C.border}`,borderLeft:`3px solid ${tc.a}`,marginBottom:6 }}>
        <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:8 }}>
          <Tag bg={tc.b} color={tc.a}>{s.team}</Tag>
          <span style={{ fontSize:11,fontWeight:700,color:C.t1,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{s.school}</span>
          <span style={{ fontSize:9,color:C.t3 }}>{s.region}</span>
          <button onClick={()=>setEditId(s.id)} style={{ padding:"2px 8px",borderRadius:5,fontSize:9,fontWeight:700,
            border:`1px solid ${C.blue}40`,background:C.blueL,color:C.blue,cursor:"pointer",whiteSpace:"nowrap" }}>✏ 수정</button>
        </div>

        {/* 팀(이름) 배정 */}
        <div style={{ padding:"8px 9px",background:tc.b,borderRadius:9,border:`1px solid ${tc.a}25` }}>
          <div style={{ display:"flex",alignItems:"center",flexWrap:"wrap",gap:5 }}>
            <span style={{ fontSize:11,fontWeight:800,color:tc.a,background:C.surface,
              padding:"4px 9px",borderRadius:20,border:`1.5px solid ${tc.a}`,whiteSpace:"nowrap" }}>{s.team}</span>
            {assignees.map(name => (
              <span key={name} style={{ display:"inline-flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,
                color:"#fff",background:tc.a,padding:"4px 9px",borderRadius:20,whiteSpace:"nowrap",boxShadow:`0 2px 6px ${tc.a}40` }}>
                {name}
                <button onClick={()=>toggleAssignee(s.id,name)} style={{ width:14,height:14,borderRadius:"50%",border:"none",
                  background:"rgba(255,255,255,.3)",color:"#fff",fontSize:10,fontWeight:900,cursor:"pointer",
                  lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center",padding:0 }}>×</button>
              </span>
            ))}
            {available.length>0 && (
              <button onClick={()=>setPickerId(open?null:s.id)} style={{ width:26,height:26,borderRadius:"50%",
                border:`1.5px solid ${tc.a}`,background:open?tc.a:C.surface,color:open?"#fff":tc.a,
                fontSize:16,fontWeight:700,cursor:"pointer",lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>+</button>
            )}
            {assignees.length===0 && !open && <span style={{ fontSize:10,color:tc.c,opacity:.7 }}>+ 버튼으로 인원 추가</span>}
          </div>
          {open && (
            <div style={{ marginTop:8,padding:8,background:C.surface,borderRadius:8,border:`1px solid ${tc.a}30`,display:"flex",flexWrap:"wrap",gap:5 }}>

  const EndCard = ({ s }) => {
    const tc = TC[s.team]||{a:C.t3,b:C.surfaceL};
    const repAll = s.buildings.every(b=>b.rep);
    const fmsAll = s.buildings.every(b=>b.fmsD);
    const delAll = s.buildings.every(b=>b.delivery);
    const ok = repAll && fmsAll && delAll;
    return (
      <div style={{ padding:"10px 11px",background:C.surface,borderRadius:9,
        border:`1px solid ${ok?C.green+"40":C.orange+"40"}`,borderLeft:`3px solid ${ok?C.green:C.orange}`,marginBottom:6 }}>
        <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:7 }}>
          <Tag bg={tc.b} color={tc.a}>{s.team}</Tag>
          <span style={{ fontSize:11,fontWeight:700,color:C.t1,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{s.school}</span>
          <span style={{ fontSize:9,color:C.t3 }}>{s.region}</span>
          <button onClick={()=>setEditId(s.id)} style={{ padding:"2px 8px",borderRadius:5,fontSize:9,fontWeight:700,

            <div key={x.k} style={{ flex:1,padding:"4px 0",borderRadius:6,textAlign:"center",
              background:x.v?x.ac+"12":C.surfaceD,border:`1px solid ${x.v?x.ac+"35":C.border}` }}>
              <div style={{ fontSize:12,color:x.v?x.ac:C.t4 }}>{x.v?"✓":"○"}</div>
              <div style={{ fontSize:8,color:x.v?x.ac:C.t4,fontWeight:600,marginTop:1 }}>{x.k}</div>
            </div>

        {!repAll && <div style={{ marginTop:5,fontSize:9,color:C.red,fontWeight:600 }}>⚠ 보고서 미완 {s.buildings.filter(b=>!b.rep).length}동</div>}

  return (
    <div style={{ width:isMobile?"100%":248,flexShrink:0 }}>
      <div style={{ background:C.surface,border:BD,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,.05)",position:isMobile?"static":"sticky",top:0 }}>
        <div style={{ padding:"13px 15px",borderBottom:BD,background:C.blueL,display:"flex",alignItems:"center",justifyContent:"space-between" }}>

          </div>
          <button onClick={onClose} style={{ width:22,height:22,borderRadius:"50%",background:`${C.blue}20`,

  );

/* ══════════════════════════════════════════════════════════════
   현장 일정 — 영구 캘린더 (드래그로 일정 변경)
══════════════════════════════════════════════════════════════ */
function Calendar({ allSchools, setDb, globalTeam="전체", isMobile }) {
  const today = new Date(2026, 4, 26);
  const [yr, setYr] = useState(2026);
  const [mo, setMo] = useState(5);
  const [teamF, setTeamF] = useState(globalTeam);
  const [dragging, setDragging] = useState(null);
  const [overDay, setOverDay] = useState(null);
  const [selDay, setSelDay] = useState(null);
  const [toast, setToast] = useState(null);

  const prevGT = useRef(globalTeam);
  if (prevGT.current !== globalTeam) { prevGT.current = globalTeam; if (teamF!==globalTeam) setTeamF(globalTeam); }

  const showToast = m => { setToast(m); setTimeout(()=>setToast(null), 2200); };
  const pad = n => String(n).padStart(2,"0");
  const toStr = day => `${yr}-${pad(mo)}-${pad(day)}`;

  const prevMonth = () => { if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1); setSelDay(null); };
  const nextMonth = () => { if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1); setSelDay(null); };
  const goToday   = () => { setYr(today.getFullYear()); setMo(today.getMonth()+1); setSelDay(today.getDate()); };

  const daysInMonth = new Date(yr, mo, 0).getDate();
  const firstDow = new Date(yr, mo-1, 1).getDay();
  const cells = [...Array(firstDow).fill(null), ...Array.from({length:daysInMonth},(_,i)=>i+1)];
  while (cells.length%7) cells.push(null);
  const weeks = Array.from({length:cells.length/7},(_,i)=>cells.slice(i*7,i*7+7));
  const isToday = d => yr===today.getFullYear() && mo===today.getMonth()+1 && d===today.getDate();

  const eventsByDay = useMemo(() => {
    const map = {};
    allSchools.forEach(s => {
      [["field","현장"],["start","착수"],["end","완수"]].forEach(([f,lbl]) => {
        const ds = s[f]; if (!ds) return;
        const [y,m,d] = ds.split("-").map(Number);
        if (y!==yr || m!==mo) return;
        (map[d] = map[d]||[]).push({ schoolId:s.id, school:s.school, field:f, label:lbl,
          team:s.team, headcount:s.headcount||2, assignees:s.assignees||[] });
      });
    });
    // 같은 날 정렬: 현장 → 착수 → 완수
    const ord = { field:0, start:1, end:2 };
    Object.values(map).forEach(arr => arr.sort((a,b)=>ord[a.field]-ord[b.field]));
    return map;
  }, [allSchools, yr, mo]);

  const handleDrop = useCallback(targetDay => {
    if (!dragging || !targetDay) return;
    const { schoolId, field, fromDay } = dragging;
    if (fromDay===targetDay) { setDragging(null); setOverDay(null); return; }
    const nd = toStr(targetDay);
    const sc = allSchools.find(s=>s.id===schoolId);
    if (sc?._year && sc?._half) {
      setDb(prev => {
        const next = {...prev};
        next[sc._year] = {...prev[sc._year]};
        next[sc._year][sc._half] = prev[sc._year][sc._half].map(s => s.id!==schoolId ? s : {...s,[field]:nd});
        return next;
      });
    }
    const lbl = field==="field"?"현장조사일":field==="start"?"착수일":"완수일";
    showToast(`${sc?.school} ${lbl} → ${mo}/${targetDay} · 현장관리 반영`);
    setDragging(null); setOverDay(null);
  }, [dragging, allSchools, yr, mo, setDb]);

  /* 현장=팀색, 착수=초록, 완수=노랑 */
  const evColor = (f,team) => f==="field" ? (TC[team]?.a||C.blue) : f==="start" ? C.green : C.yellow;
  const evMark  = f => f==="start" ? " ▶" : f==="end" ? " 📦" : "";
  const DOW = ["일","월","화","수","목","금","토"];
  const selLabel = selDay ? `${mo}월 ${selDay}일 (${DOW[new Date(yr,mo-1,selDay).getDay()]})` : "";

  return (
    <div>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14 }}>
        <div>
          <div style={{ fontSize:11,color:C.t3,letterSpacing:2,fontWeight:600,marginBottom:3 }}>SCHEDULE</div>
          <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>현장 일정</h1>
        </div>
        <div style={{ display:"flex",gap:6 }}>
          {["전체",...TEAM_LIST].map(t => (
            <Pill key={t} active={teamF===t} ac={t==="전체"?C.t2:TC[t]?.a} onClick={()=>setTeamF(t)}>{t}</Pill>
          ))}
        </div>
      </div>

      <div style={{ padding:"9px 14px",background:C.blueL,border:`1px solid ${C.blue}30`,borderRadius:8,
        fontSize:11,color:C.blue,fontWeight:600,marginBottom:14,display:"flex",alignItems:"center",gap:8 }}>
        🖱 일정 카드를 드래그해 날짜 변경 · 날짜 클릭 시 우측에 상세 표시
      </div>

      <div style={{ display:"flex",gap:16,flexDirection:isMobile?"column":"row" }}>
        <div style={{ flex:1,minWidth:0 }}>
          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap" }}>
            <button onClick={prevMonth} style={{ width:30,height:30,borderRadius:7,border:BD,background:C.surface,color:C.t2,fontSize:16,cursor:"pointer" }}>‹</button>
            <div style={{ fontSize:18,fontWeight:800,color:C.t1,minWidth:120,textAlign:"center" }}>{yr}년 {mo}월</div>
            <button onClick={nextMonth} style={{ width:30,height:30,borderRadius:7,border:BD,background:C.surface,color:C.t2,fontSize:16,cursor:"pointer" }}>›</button>
            <button onClick={goToday} style={{ padding:"5px 12px",borderRadius:7,border:`1.5px solid ${C.blue}`,background:C.blueL,color:C.blue,fontSize:11,fontWeight:700,cursor:"pointer" }}>오늘</button>
            <div style={{ display:"flex",gap:4,marginLeft:6 }}>
              {[2024,2025,2026,2027].map(y=>(
                <button key={y} onClick={()=>setYr(y)} style={{ padding:"4px 9px",borderRadius:6,border:`1px solid ${yr===y?C.blue:C.border}`,
                  background:yr===y?C.blueL:"transparent",color:yr===y?C.blue:C.t3,fontSize:11,fontWeight:600,cursor:"pointer" }}>{y}</button>
              ))}
            </div>
            <div style={{ display:"flex",gap:3 }}>
              {Array.from({length:12},(_,i)=>i+1).map(m=>(
                <button key={m} onClick={()=>setMo(m)} style={{ width:24,height:24,borderRadius:5,border:`1px solid ${mo===m?C.blue:C.border}`,
                  background:mo===m?C.blueL:"transparent",color:mo===m?C.blue:C.t3,fontSize:10,fontWeight:600,cursor:"pointer" }}>{m}</button>
              ))}
            </div>
          </div>

          <div style={{ background:C.surface,border:BD,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.06)" }}>
            <table style={{ width:"100%",borderCollapse:"collapse",tableLayout:"fixed" }}>
              <colgroup>{[0,1,2,3,4,5,6].map(i=><col key={i}/>)}</colgroup>
              <thead>
                <tr style={{ background:C.surfaceL,borderBottom:`1.5px solid ${C.borderD}` }}>
                  {DOW.map((d,i)=>(
                    <th key={d} style={{ padding:"10px 0",textAlign:"center",fontSize:11,fontWeight:700,
                      color:i===0?C.red:C.t3,letterSpacing:1,borderRight:i<6?BD:"none",fontFamily:F }}>{d}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {weeks.map((week,wi)=>(
                  <tr key={wi} style={{ borderBottom:wi<weeks.length-1?BD:"none" }}>
                    {week.map((day,di)=>{
                      const evs = (day?eventsByDay[day]||[]:[]).filter(e=>teamF==="전체"||e.team===teamF);
                      const over = overDay===day && !!day;
                      const sel  = selDay===day && !!day;
                      return (
                        <td key={di}
                          onClick={()=>day&&setSelDay(sel?null:day)}
                          onDragOver={e=>{e.preventDefault();setOverDay(day);}}
                          onDragLeave={()=>setOverDay(null)}
                          onDrop={()=>handleDrop(day)}
                          style={{ padding:"6px 6px 5px",verticalAlign:"top",height:90,width:"14.285%",
                            borderRight:di<6?BD:"none",cursor:day?"pointer":"default",
                            background:sel?"rgba(29,111,242,.11)":over?"rgba(29,111,242,.09)":isToday(day)?"rgba(29,111,242,.05)":"transparent",
                            outline:sel?`2px solid ${C.blue}`:over?`2px dashed ${C.blue}`:"none",outlineOffset:-2,
                            transition:"background .1s",position:"relative" }}>
                          {day && <>
                            <div style={{ width:24,height:24,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:"50%",
                              background:isToday(day)?C.blue:"transparent",color:isToday(day)?"#fff":di===0?C.red:C.t2,
                              fontSize:12,fontWeight:isToday(day)?700:500,marginBottom:4 }}>{day}</div>
                            {over && <div style={{ position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-60%)",
                              fontSize:9,color:C.blue,fontWeight:700,pointerEvents:"none",zIndex:2,background:C.blueL,
                              padding:"2px 7px",borderRadius:4,border:`1px solid ${C.blue}30` }}>놓기</div>}
                            <div style={{ display:"flex",flexDirection:"column",gap:2 }}>
                              {evs.slice(0,2).map((e,ei)=>(
                                <div key={ei} draggable
                                  onDragStart={()=>setDragging({schoolId:e.schoolId,field:e.field,fromDay:day})}
                                  onDragEnd={()=>{setDragging(null);setOverDay(null);}}
                                  title={`${e.school} · ${e.label} · ${e.assignees.length>0?e.assignees.join(","):e.headcount+"명"}`}
                                  style={{ padding:"2px 5px",borderRadius:4,background:`${evColor(e.field,e.team)}15`,
                                    borderLeft:`2.5px solid ${evColor(e.field,e.team)}`,fontSize:9,color:evColor(e.field,e.team),
                                    fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"grab",
                                    boxShadow:"0 1px 3px rgba(0,0,0,.07)",
                                    opacity:dragging?.schoolId===e.schoolId&&dragging?.field===e.field?0.4:1 }}>
                                  <span>{e.school.length>4?e.school.slice(0,4)+"…":e.school}</span>
                                  {e.field==="end" && <span> 📦</span>}
                                  {e.field==="start" && <span> ▶</span>}
                                  {e.field==="field" && <span style={{opacity:.85,fontSize:8}}>{e.assignees.length>0?` (${e.assignees.map(n=>n[0]).join("·")})`:` ${e.headcount}명`}</span>}
                                </div>
                              ))}
                              {evs.length>2 && <div style={{ fontSize:9,color:C.t4,paddingLeft:4 }}>+{evs.length-2}건</div>}
                            </div>
                          </>}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div style={{ display:"flex",gap:14,marginTop:10,padding:"9px 14px",background:C.surface,border:BD,borderRadius:8,alignItems:"center",flexWrap:"wrap" }}>
            {[["팀색 = 현장조사",C.blue],["초록 ▶ 착수일",C.green],["노랑 📦 완수일",C.yellow]].map(([k,v])=>(
              <div key={k} style={{ display:"flex",alignItems:"center",gap:5 }}>
                <div style={{ width:10,height:10,borderRadius:2,background:v }}/><span style={{ fontSize:10,color:C.t3 }}>{k}</span>
              </div>
            ))}
            {Object.entries(TC).map(([t,v])=>(
              <div key={t} style={{ display:"flex",alignItems:"center",gap:5 }}>
                <div style={{ width:9,height:9,borderRadius:"50%",background:v.a }}/><span style={{ fontSize:10,color:C.t3 }}>{t}</span>
              </div>
            ))}
          </div>
        </div>

        {selDay
          ? <DayPanel dateStr={toStr(selDay)} label={selLabel} allSchools={allSchools} teamF={teamF} setDb={setDb} onClose={()=>setSelDay(null)} isMobile={isMobile}/>
          : <div style={{ width:isMobile?"100%":248,flexShrink:0 }}>
              <div style={{ background:C.surface,border:BD,borderRadius:12,padding:"32px 16px",textAlign:"center",color:C.t4,boxShadow:"0 2px 8px rgba(0,0,0,.05)" }}>
                <div style={{ fontSize:32,marginBottom:8 }}>📅</div>
                <div style={{ fontSize:11,lineHeight:1.6 }}>날짜를 클릭하면<br/>현장·완수·인원 정보가<br/>표시됩니다</div>
              </div>
            </div>}
      </div>
      <Toast msg={toast}/>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   현장 수정 슬라이드 패널 (학교 + 동별)
══════════════════════════════════════════════════════════════ */
function EditPanel({ sc, yr, half, setDb, onClose }) {
  const tc = TC[sc.team]||{a:C.t3,b:C.surfaceL,c:C.t2};
  const [f, setF] = useState({
    team:sc.team||"", region:sc.region||"", kind:sc.kind||"정기점검",
    field:sc.field||"", start:sc.start||"", end:sc.end||"", assignees:sc.assignees||[],
  });
  const [bf, setBf] = useState(sc.buildings.map(b=>({
    b:b.b||"", floor:b.floor||"", area:b.area?String(b.area):"",
    fms:b.fms||"", flag:b.flag||"", note:b.note||"",
    rep:!!b.rep, fmsD:!!b.fmsD, delivery:b.delivery||"",
  })));
  const [prog, setProg] = useState(() => {
    const o = {}; STEPS.forEach(k => { o[k] = !!(sc.progress && sc.progress[k]); }); return o;
  });
  const [saved, setSaved] = useState(false);
  const progDone = STEPS.filter(k=>prog[k]).length;
  const toggleStep = (k) => setProg(p => ({ ...p, [k]: !p[k] }));

  const save = () => {
    setDb(prev => {
      const next = {...prev};
      next[yr] = {...prev[yr]};
      next[yr][half] = prev[yr][half].map(s => {
        if (s.id!==sc.id) return s;
        return { ...s, team:f.team, region:f.region, kind:f.kind, field:f.field, start:f.start, end:f.end,
          assignees:f.assignees, headcount:f.assignees.length||s.headcount, progress:{...prog},
          buildings: bf.map((b,i)=>({ ...(sc.buildings[i]||{}), b:b.b, floor:b.floor,
            area:b.area?parseFloat(b.area):null, fms:b.fms||null, flag:b.flag||null, note:b.note||null,
            rep:b.rep, fmsD:b.fmsD, delivery:b.delivery||null })) };
      });
      return next;
    });
    setSaved(true);
    setTimeout(()=>{ setSaved(false); onClose(); }, 1100);
  };

  const LI = ({ label, val, on, type="text", col }) => (
    <div style={{ display:"flex",flexDirection:"column",gap:3 }}>
      <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>{label}</label>
      <input type={type} value={val} onChange={e=>on(e.target.value)}
        style={{ padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:col||C.t1,fontSize:11,outline:"none",width:"100%" }}/>
    </div>
  );

  return (
    <>
      <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(30,35,50,.35)",backdropFilter:"blur(2px)",zIndex:300 }}/>
      <div style={{ position:"fixed",top:0,right:0,width:520,maxWidth:"94vw",height:"100vh",background:C.surface,
        borderLeft:`3px solid ${tc.a}`,zIndex:301,display:"flex",flexDirection:"column",boxShadow:"-8px 0 32px rgba(0,0,0,.16)" }}>
        <div style={{ padding:"18px 22px 14px",borderBottom:BD,flexShrink:0,display:"flex",alignItems:"flex-start",justifyContent:"space-between" }}>
          <div>
            <div style={{ fontSize:10,color:tc.a,fontWeight:700,marginBottom:3 }}>✏ 현장 수정 · {yr} {half}</div>
            <div style={{ fontSize:16,fontWeight:900,color:C.t1 }}>{sc.school}</div>
            <div style={{ fontSize:11,color:C.t3,marginTop:2 }}>{sc.region} · {sc.buildings.length}동 · No.{sc.no}</div>
          </div>
          <button onClick={onClose} style={{ width:28,height:28,borderRadius:"50%",background:C.surfaceL,border:BD,color:C.t3,fontSize:16,cursor:"pointer" }}>×</button>
        </div>

        <div style={{ flex:1,overflowY:"auto",padding:"16px 22px" }}>
          <div style={{ padding:14,background:C.surfaceL,borderRadius:10,border:BD,marginBottom:16 }}>
            <div style={{ fontSize:10,fontWeight:700,color:C.t2,marginBottom:12 }}>🏫 학교 기본 정보</div>
            <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
              <div style={{ gridColumn:"span 2",display:"flex",flexDirection:"column",gap:4 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>담당팀</label>
                <div style={{ display:"flex",gap:6 }}>
                  {TEAM_LIST.map(t=>(
                    <button key={t} onClick={()=>setF(p=>({...p,team:t,assignees:[]}))} style={{ flex:1,padding:"7px 0",borderRadius:7,fontSize:12,fontWeight:700,
                      border:`1.5px solid ${f.team===t?TC[t].a:C.border}`,background:f.team===t?TC[t].b:"transparent",color:f.team===t?TC[t].a:C.t3,cursor:"pointer" }}>{t}</button>
                  ))}
                </div>
              </div>
              <LI label="지역" val={f.region} on={v=>setF(p=>({...p,region:v}))}/>
              <div style={{ display:"flex",flexDirection:"column",gap:3 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>점검종류</label>
                <select value={f.kind} onChange={e=>setF(p=>({...p,kind:e.target.value}))}
                  style={{ padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:C.t1,fontSize:11,outline:"none" }}>
                  {["정기점검","정밀점검","내진성능","구조감리","내진보강설계","구조검토"].map(k=><option key={k}>{k}</option>)}
                </select>
              </div>
              <LI label="현장조사일" val={f.field} on={v=>setF(p=>({...p,field:v}))} type="date" col={tc.a}/>
              <LI label="착수일" val={f.start} on={v=>setF(p=>({...p,start:v}))} type="date"/>
              <LI label="완수일" val={f.end} on={v=>setF(p=>({...p,end:v}))} type="date" col={C.orange}/>
              <div style={{ gridColumn:"span 2",display:"flex",flexDirection:"column",gap:5 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>투입 인원 <span style={{ marginLeft:6,color:tc.a }}>{f.assignees.length>0?`${f.assignees.length}명`:"미선택"}</span></label>
                <div style={{ display:"flex",flexWrap:"wrap",gap:5,padding:10,background:tc.b,borderRadius:8,border:`1px solid ${tc.a}25` }}>
                  {(TEAM_MEMBERS[f.team]||[]).map(name=>{
                    const on=f.assignees.includes(name);
                    return <button key={name} onClick={()=>setF(p=>({...p,assignees:on?p.assignees.filter(n=>n!==name):[...p.assignees,name]}))}
                      style={{ padding:"6px 12px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",
                        background:on?tc.a:C.surface,color:on?"#fff":tc.c,border:`1.5px solid ${on?tc.a:tc.a+"40"}` }}>{on&&"✓ "}{name}</button>;
                  })}
                  {!(TEAM_MEMBERS[f.team]||[]).length && <span style={{ fontSize:10,color:C.t4 }}>팀을 먼저 선택하세요</span>}
                </div>
              </div>
            </div>
          </div>

          {/* 업무 진행 8단계 */}
          <div style={{ padding:14,background:C.surfaceL,borderRadius:10,border:BD,marginBottom:16 }}>
            <div style={{ display:"flex",alignItems:"center",marginBottom:10 }}>
              <div style={{ fontSize:10,fontWeight:700,color:C.t2 }}>📋 업무 진행 단계</div>
              <div style={{ marginLeft:"auto",fontSize:12,fontWeight:800,color:progDone===STEPS.length?C.green:tc.a }}>
                {progDone}/{STEPS.length}
                <span style={{ fontSize:10,color:C.t4,marginLeft:4,fontWeight:600 }}>{Math.round(progDone/STEPS.length*100)}%</span>
              </div>
            </div>

            {/* 진행 바 */}
            <div style={{ display:"flex",gap:3,marginBottom:12 }}>
              {STEPS.map((k)=>{
                const on=prog[k], sp=STEP_SPECIAL[k], col=sp?C.purple:C.blue;
                return <div key={k} style={{ flex:1,height:8,borderRadius:3,
                  background:on?col:C.surfaceD,
                  border:sp?`1.5px solid ${on?col:col+"55"}`:"none",boxSizing:"border-box" }}/>;
              })}
            </div>

            {/* 단계 토글 (순서대로) */}
            <div style={{ display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:7 }}>
              {STEPS.map((k,i)=>{
                const on=prog[k], sp=STEP_SPECIAL[k], col=sp?C.purple:(k==="완수"?C.green:C.blue);
                return (
                  <button key={k} onClick={()=>toggleStep(k)} style={{
                    display:"flex",alignItems:"center",gap:8,padding:"9px 11px",borderRadius:8,cursor:"pointer",
                    background:on?col+"12":C.surface,
                    border:`1.5px solid ${on?col:(sp?col+"40":C.border)}`,textAlign:"left" }}>
                    <span style={{ width:20,height:20,borderRadius:"50%",flexShrink:0,
                      display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,
                      background:on?col:C.surfaceD,color:on?"#fff":C.t4 }}>{on?"✓":i+1}</span>
                    <span style={{ fontSize:13 }}>{STEP_ICON[k]}</span>
                    <span style={{ fontSize:12,fontWeight:700,color:on?col:C.t2,flex:1 }}>{k}</span>
                    {sp && <span style={{ fontSize:8,fontWeight:700,color:C.purple,background:C.purpleL,padding:"1px 5px",borderRadius:3 }}>중요</span>}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize:9,color:C.t4,marginTop:8 }}>* 단계를 눌러 완료/미완료를 전환하세요. 검토·제본은 별도 강조됩니다.</div>
          </div>

          <div style={{ fontSize:10,fontWeight:700,color:C.t2,marginBottom:10 }}>🏗 동별 수정</div>
          {bf.map((b,bi)=>(
            <div key={bi} style={{ padding:14,background:C.surface,borderRadius:10,border:`1px solid ${C.border}`,borderLeft:`3px solid ${tc.a}`,marginBottom:10 }}>
              <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:12 }}>
                <div style={{ width:20,height:20,borderRadius:"50%",background:tc.b,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:tc.a }}>{bi+1}</div>
                <span style={{ fontSize:13,fontWeight:700,color:C.t1,flex:1 }}>{b.b||`${bi+1}번 동`}</span>
                <div style={{ display:"flex",gap:4 }}>
                  {[{k:"보고서",f:"rep",ac:C.purple,bc:C.purpleL},{k:"FMS",f:"fmsD",ac:C.blue,bc:C.blueL}].map(x=>(
                    <button key={x.f} onClick={()=>setBf(p=>p.map((v,i)=>i!==bi?v:{...v,[x.f]:!v[x.f]}))}
                      style={{ padding:"3px 8px",borderRadius:5,fontSize:9,fontWeight:700,cursor:"pointer",
                        border:`1px solid ${b[x.f]?x.ac+"60":C.border}`,background:b[x.f]?x.bc:C.surfaceL,color:b[x.f]?x.ac:C.t4 }}>{b[x.f]?"✓ ":""}{x.k}</button>
                  ))}
                  {["직납","우편"].map(dv=>(
                    <button key={dv} onClick={()=>setBf(p=>p.map((v,i)=>i!==bi?v:{...v,delivery:v.delivery===dv?"":dv}))}
                      style={{ padding:"3px 7px",borderRadius:5,fontSize:9,fontWeight:700,cursor:"pointer",
                        border:`1px solid ${b.delivery===dv?C.green+"60":C.border}`,background:b.delivery===dv?C.greenL:C.surfaceL,color:b.delivery===dv?C.green:C.t4 }}>{dv[0]}</button>
                  ))}
                  <button onClick={()=>setBf(p=>p.filter((_,i)=>i!==bi))} style={{ padding:"3px 6px",borderRadius:5,fontSize:10,cursor:"pointer",border:`1px solid ${C.red}30`,background:C.redL,color:C.red,fontWeight:700 }}>✕</button>
                </div>
              </div>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8 }}>
                <LI label="동명" val={b.b} on={v=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,b:v}))}/>
                <LI label="층수" val={b.floor} on={v=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,floor:v}))}/>
                <LI label="연면적㎡" val={b.area} on={v=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,area:v}))} type="number"/>
              </div>
              <div style={{ marginBottom:8 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700,display:"block",marginBottom:3 }}>FMS 계정 (아이디 // 비밀번호)</label>
                <input value={b.fms} onChange={e=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,fms:e.target.value}))} placeholder="아이디 // 비밀번호"
                  style={{ width:"100%",padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:C.blue,fontSize:11,outline:"none",fontFamily:"monospace" }}/>
              </div>
              <div style={{ display:"flex",gap:5,marginBottom:8,alignItems:"center",flexWrap:"wrap" }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>플래그</label>
                {[["","없음"],["●","🚁 드론"],["1년","📅 1년"],["피난","🚪 피난"]].map(([val,lb])=>(
                  <button key={val} onClick={()=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,flag:val}))}
                    style={{ padding:"3px 9px",borderRadius:5,fontSize:9,fontWeight:600,cursor:"pointer",
                      border:`1px solid ${b.flag===val?C.orange+"60":C.border}`,background:b.flag===val?C.orangeL:C.surfaceL,color:b.flag===val?C.orange:C.t3 }}>{lb}</button>
                ))}
              </div>
              <div>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700,display:"block",marginBottom:3 }}>특이사항 / 메모</label>
                <textarea value={b.note} onChange={e=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,note:e.target.value}))} placeholder="담당자 연락처, 주의사항..." rows={2}
                  style={{ width:"100%",padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:C.t1,fontSize:11,outline:"none",resize:"vertical",lineHeight:1.5 }}/>
              </div>
            </div>
          ))}
          <button onClick={()=>setBf(p=>[...p,{b:"",floor:"",area:"",fms:"",flag:"",note:"",rep:false,fmsD:false,delivery:""}])}
            style={{ width:"100%",padding:9,borderRadius:8,border:`1.5px dashed ${C.border}`,background:"transparent",color:C.t3,fontSize:12,cursor:"pointer",marginBottom:8 }}>+ 동 추가</button>
        </div>

        <div style={{ padding:"14px 22px",borderTop:BD,flexShrink:0,display:"flex",gap:8 }}>
          <button onClick={onClose} style={{ flex:1,padding:11,borderRadius:9,border:BD,background:"transparent",color:C.t3,fontSize:13,cursor:"pointer" }}>취소</button>
          <button onClick={save} style={{ flex:2,padding:11,borderRadius:9,background:saved?C.green:C.blue,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",transition:"background .3s",boxShadow:`0 4px 14px ${(saved?C.green:C.blue)}40` }}>
            {saved?"✓ 저장됨!":"✓ 저장 · 캘린더 자동 반영"}
          </button>
        </div>
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════
   현장 관리 — 연도/반기 탭 + 테이블
══════════════════════════════════════════════════════════════ */
function SitesManager({ db, setDb, globalTeam="전체", isMobile }) {
  const [yr, setYr] = useState("2026");
  const [half, setHalf] = useState("상반기");
  const [teamF, setTeamF] = useState(globalTeam);
  const [stF, setStF] = useState("전체");
  const [search, setSearch] = useState("");
  const [open, setOpen] = useState(new Set());
  const [copied, setCopied] = useState(null);
  const [editId, setEditId] = useState(null);
  const [toast, setToast] = useState(null);

  const prevGT = useRef(globalTeam);
  if (prevGT.current !== globalTeam) { prevGT.current = globalTeam; if (teamF!==globalTeam) setTeamF(globalTeam); }

  const showToast = m => { setToast(m); setTimeout(()=>setToast(null), 2000); };
  const copy = (t,id) => { navigator.clipboard?.writeText(t).catch(()=>{}); setCopied(id); setTimeout(()=>setCopied(null),1500); };

  const schools = useMemo(()=>db[yr]?.[half]||[], [db,yr,half]);

  const updDate = (sid,field,v) => {
    setDb(prev=>{ const n={...prev}; n[yr]={...prev[yr]};
      n[yr][half]=prev[yr][half].map(s=>s.id!==sid?s:{...s,[field]:v}); return n; });
    showToast("날짜 변경됨 · 캘린더 자동 반영");
  };
  const toggleB = (sid,bi,field) => setDb(prev=>{ const n={...prev}; n[yr]={...prev[yr]};
    n[yr][half]=prev[yr][half].map(s=>s.id!==sid?s:{...s,buildings:s.buildings.map((b,j)=>j!==bi?b:{...b,[field]:!b[field]})}); return n; });
  const setDel = (sid,bi,v) => setDb(prev=>{ const n={...prev}; n[yr]={...prev[yr]};
    n[yr][half]=prev[yr][half].map(s=>s.id!==sid?s:{...s,buildings:s.buildings.map((b,j)=>j!==bi?b:{...b,delivery:b.delivery===v?null:v})}); return n; });

  const filtered = useMemo(()=>schools.filter(s=>{
    if (teamF!=="전체" && s.team!==teamF) return false;
    if (search && !s.school.includes(search) && !(s.region||"").includes(search)) return false;
    if (stF==="보고서 미완") return s.buildings.some(b=>!b.rep);
    if (stF==="FMS 미완")   return s.buildings.some(b=>!b.fmsD);
    if (stF==="납품 미정")  return s.buildings.some(b=>b.rep&&!b.delivery);
    if (stF==="완료")       return s.buildings.every(b=>b.rep&&b.fmsD);
    return true;
  }).sort((a,b)=>{
    const da=calcDday(a.end)??9999, dbb=calcDday(b.end)??9999;
    if(da<0&&dbb>=0)return -1; if(da>=0&&dbb<0)return 1;
    if(da<0&&dbb<0)return dbb-da; return da-dbb;
  }), [schools,teamF,stF,search]);

  const allB = filtered.flatMap(s=>s.buildings);
  const st = { total:allB.length, rep:allB.filter(b=>b.rep).length, fms:allB.filter(b=>b.fmsD).length, noD:allB.filter(b=>b.rep&&!b.delivery).length };
  const years = Object.keys(db).sort((a,b)=>b-a);
  const editSc = editId ? schools.find(s=>s.id===editId) : null;

  return (
    <div style={{ display:"flex",flexDirection:"column",gap:14 }}>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
        <div>
          <div style={{ fontSize:11,color:C.t3,letterSpacing:2,marginBottom:3,fontWeight:600 }}>SITES MANAGEMENT</div>
          <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>현장 관리</h1>
        </div>
      </div>

      {/* 연도/반기 탭 */}
      <div style={{ display:"flex",alignItems:"center",background:C.surface,border:BD,borderRadius:12,overflow:isMobile?"auto":"hidden",overflowX:isMobile?"auto":"hidden",boxShadow:"0 1px 6px rgba(0,0,0,.05)" }}>
        <div style={{ display:"flex",borderRight:`2px solid ${C.border}`,flexShrink:0 }}>
          {years.map(y=>(
            <button key={y} onClick={()=>{ setYr(y); setHalf(Object.keys(db[y]||{})[0]||"상반기"); }}
              style={{ padding:isMobile?"11px 14px":"12px 20px",border:"none",borderBottom:`3px solid ${yr===y?C.blue:"transparent"}`,
                background:yr===y?C.blueL:"transparent",color:yr===y?C.blue:C.t3,fontSize:14,fontWeight:yr===y?800:500,cursor:"pointer",whiteSpace:"nowrap" }}>
              {y}년 {yr===y && <span style={{ fontSize:10,marginLeft:5,color:C.t4 }}>{(db[y]?.상반기||[]).length+(db[y]?.하반기||[]).length}건</span>}
            </button>
          ))}
        </div>
        <div style={{ display:"flex",padding:"0 8px",flexShrink:0 }}>
          {["상반기","하반기"].map(h=>{
            const cnt=(db[yr]?.[h]||[]).length, on=half===h, hc=h==="상반기"?C.blue:C.orange;
            return <button key={h} onClick={()=>setHalf(h)} style={{ padding:isMobile?"11px 12px":"12px 18px",border:"none",borderBottom:`3px solid ${on?hc:"transparent"}`,
              background:on?hc+"12":"transparent",color:on?hc:C.t3,fontSize:13,fontWeight:on?700:500,cursor:"pointer",display:"flex",alignItems:"center",gap:7,whiteSpace:"nowrap" }}>
              <span style={{ fontSize:15 }}>{h==="상반기"?"🌱":"🍂"}</span>{h}
              <span style={{ fontSize:10,padding:"1px 6px",borderRadius:10,background:on?hc+"20":C.surfaceL,color:on?hc:C.t4,fontWeight:700 }}>{cnt}</span>
            </button>;
          })}
        </div>
        {!isMobile && (
          <div style={{ marginLeft:"auto",padding:"0 16px",fontSize:11,color:C.t3,fontWeight:600,whiteSpace:"nowrap" }}>
            {yr}년 {half} · {filtered.length}개 / {filtered.flatMap(s=>s.buildings).length}동
          </div>
        )}
      </div>

      {/* 통계 카드 */}
      <div style={{ display:"grid",gridTemplateColumns:isMobile?"repeat(2,1fr)":"repeat(4,1fr)",gap:10 }}>
        {[{label:"전체 동",val:st.total,c:C.t2,f:"전체"},
          {label:"📄 보고서 완료",val:`${st.rep}/${st.total}`,c:C.purple,f:"보고서 미완"},
          {label:"🖥 FMS 완료",val:`${st.fms}/${st.total}`,c:C.blue,f:"FMS 미완"},
          {label:"📦 납품 미정",val:st.noD,c:C.orange,f:"납품 미정"}].map(x=>(
          <button key={x.label} onClick={()=>setStF(x.f)} style={{ padding:"12px 14px",background:stF===x.f?x.c+"08":C.surface,
            border:`1.5px solid ${stF===x.f?x.c+"60":C.border}`,borderTop:`3px solid ${x.c}`,borderRadius:10,textAlign:"left",cursor:"pointer",boxShadow:"0 1px 6px rgba(0,0,0,.04)" }}>
            <div style={{ fontSize:21,fontWeight:900,color:x.c,lineHeight:1 }}>{x.val}</div>
            <div style={{ fontSize:10,color:C.t3,marginTop:5,fontWeight:600 }}>{x.label}</div>
          </button>
        ))}
      </div>

      {/* 필터 */}
      <div style={{ display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",padding:"10px 14px",background:C.surface,border:BD,borderRadius:10 }}>
        <div style={{ display:"flex",background:C.surfaceL,border:BD,borderRadius:7,padding:"6px 11px",gap:7,alignItems:"center",width:190 }}>
          <span style={{ color:C.t4 }}>⌕</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="학교명·지역"
            style={{ background:"transparent",border:"none",color:C.t1,fontSize:13,outline:"none",flex:1 }}/>
          {search && <button onClick={()=>setSearch("")} style={{ background:"transparent",border:"none",color:C.t4,fontSize:15,padding:0,cursor:"pointer" }}>×</button>}
        </div>
        {["전체",...TEAM_LIST].map(t=><Pill key={t} active={teamF===t} ac={t==="전체"?C.t2:TC[t]?.a} onClick={()=>setTeamF(t)}>{t}</Pill>)}
        <div style={{ width:1,height:18,background:C.border }}/>
        {["전체","보고서 미완","FMS 미완","납품 미정","완료"].map(ff=>(
          <Pill key={ff} active={stF===ff} ac={C.purple} onClick={()=>setStF(ff)} style={{ fontSize:11 }}>{ff}</Pill>
        ))}
      </div>

      {/* 테이블 */}
      <div style={{ background:C.surface,border:BD,borderRadius:12,overflowX:isMobile?"auto":"hidden",overflowY:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.05)",WebkitOverflowScrolling:"touch" }}>
        <div style={{ minWidth:isMobile?660:"auto" }}>
        <div style={{ display:"grid",gridTemplateColumns:"2fr 110px 110px 70px 116px 50px",background:C.surfaceL,borderBottom:`1.5px solid ${C.borderD}`,padding:"10px 16px",gap:8 }}>
          {["학교 · 시설명","현장조사일","완수일","D-day","보고서·FMS·납품","수정"].map((h,i)=>(
            <div key={i} style={{ fontSize:10,color:C.t3,fontWeight:700,letterSpacing:.5,textAlign:i>=1?"center":"left" }}>{h}</div>
          ))}
        </div>

        {filtered.map((s,si)=>{
          const tc=TC[s.team]||{a:C.t3,b:C.surfaceL};
          const isOpen=open.has(s.id);
          const repAll=s.buildings.every(b=>b.rep), fmsAll=s.buildings.every(b=>b.fmsD);
          const allDone=repAll&&fmsAll&&s.buildings.every(b=>b.delivery);
          const dd=calcDday(s.end), urgent=dd!==null&&dd<0&&dd>=-7;
          return (
            <div key={s.id} style={{ borderBottom:BD }}>
              <div onClick={()=>setOpen(p=>{const n=new Set(p);n.has(s.id)?n.delete(s.id):n.add(s.id);return n;})}
                style={{ display:"grid",gridTemplateColumns:"2fr 110px 110px 70px 116px 50px",gap:8,padding:"12px 16px",cursor:"pointer",userSelect:"none",
                  background:urgent?C.redL+"80":allDone?C.greenL+"50":si%2===0?C.surface:C.surfaceL,
                  borderLeft:`3px solid ${urgent?C.red:allDone?C.green:"transparent"}` }}>
                <div style={{ display:"flex",flexDirection:"column",gap:5,minWidth:0 }}>
                  <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap" }}>
                    <span style={{ color:C.t4,fontSize:11,display:"inline-block",transform:isOpen?"rotate(90deg)":"none",transition:"transform .2s" }}>›</span>
                    <span style={{ fontWeight:800,fontSize:14,color:C.t1 }}>{s.school}</span>
                    <Tag bg={tc.b} color={tc.a}>{s.team}</Tag>
                    <span style={{ fontSize:10,color:C.t3 }}>{s.region}</span>
                    {urgent && <Tag bg={C.redL} color={C.red} border={`1px solid ${C.red}30`}>⚡긴급</Tag>}
                    {s.buildings.some(b=>b.flag==="●") && <span style={{ fontSize:10,color:C.orange }}>🚁</span>}
                    {s.buildings.some(b=>b.flag==="1년") && <Tag bg={C.blueL} color={C.blue}>1년</Tag>}
                    {(s.assignees||[]).length>0 && <span style={{ fontSize:9,color:tc.c }}>👤 {s.assignees.join("·")}</span>}
                    <span style={{ fontSize:10,color:C.t4 }}>{s.buildings.length}동</span>
                  </div>
                  {/* 8단계 진행바 + 강조 */}
                  <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",paddingLeft:19 }} onClick={e=>e.stopPropagation()}>
                    <StepBar progress={s.progress} compact/>
                    {(() => {
                      const p = (s.progress)||{};
                      const chip = (label, on, col) => (
                        <span style={{ fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,
                          background:on?col+"18":C.surfaceL, color:on?col:C.t4,
                          border:`1px solid ${on?col+"50":C.border}` }}>
                          {on?"✓ ":""}{label}
                        </span>
                      );
                      return <>
                        {chip("착수계", !!p["착수계"], C.blue)}
                        {chip("검토", !!p["검토"], C.purple)}
                        {chip("제본", !!p["제본"], C.purple)}
                        {chip("완수", !!p["완수"], C.green)}
                      </>;
                    })()}
                  </div>
                </div>
                <div onClick={e=>e.stopPropagation()} style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                  <input type="date" value={s.field||""} onChange={e=>updDate(s.id,"field",e.target.value)}
                    style={{ background:"transparent",border:`1px solid ${C.border}`,borderRadius:5,color:tc.a,fontSize:11,padding:"3px 5px",outline:"none",width:"100%",textAlign:"center",fontWeight:600 }}/>
                </div>
                <div onClick={e=>e.stopPropagation()} style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                  <input type="date" value={s.end||""} onChange={e=>updDate(s.id,"end",e.target.value)}
                    style={{ background:"transparent",border:`1px solid ${C.border}`,borderRadius:5,color:C.orange,fontSize:11,padding:"3px 5px",outline:"none",width:"100%",textAlign:"center",fontWeight:600 }}/>
                </div>
                <div style={{ fontSize:13,fontWeight:800,color:ddC(dd),textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center" }}>{ddL(dd)}</div>
                <div style={{ display:"flex",gap:4,alignItems:"center",justifyContent:"center" }}>
                  {[{k:"보",v:repAll,c:C.purple},{k:"F",v:fmsAll,c:C.blue},{k:"납",v:s.buildings.every(b=>b.delivery),c:C.green}].map(x=>(
                    <div key={x.k} style={{ width:26,height:20,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",
                      background:x.v?x.c+"18":C.surfaceL,border:`1px solid ${x.v?x.c+"50":C.border}`,fontSize:9,fontWeight:700,color:x.v?x.c:C.t4 }}>{x.v?"✓":x.k}</div>
                  ))}
                </div>
                <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                  <button onClick={e=>{e.stopPropagation();setEditId(s.id);}} style={{ padding:"3px 9px",borderRadius:5,fontSize:9,fontWeight:700,background:C.blueL,border:`1px solid ${C.blue}40`,color:C.blue,cursor:"pointer" }}>✏</button>
                </div>
              </div>

              {isOpen && s.buildings.map((b,bi)=>{
                const iid=`${s.id}-${bi}`;
                return (
                  <div key={bi} style={{ display:"grid",gridTemplateColumns:"2fr 110px 110px 70px 116px 50px",gap:8,padding:"8px 16px 8px 38px",background:C.surfaceL,borderTop:`1px solid ${C.border}`,
                    borderLeft:`3px solid ${b.rep&&b.fmsD&&b.delivery?C.green+"40":"transparent"}` }}>
                    <div>
                      <div style={{ display:"flex",alignItems:"center",gap:7,flexWrap:"wrap" }}>
                        <span style={{ fontSize:13,color:C.t1,fontWeight:600 }}>{b.b}</span>
                        {b.floor && <span style={{ fontSize:10,color:C.t4 }}>{b.floor}층</span>}
                        {b.area && <span style={{ fontSize:10,color:C.t4 }}>{b.area.toLocaleString()}㎡</span>}
                        {b.flag==="●" && <span style={{ fontSize:10,color:C.orange,fontWeight:600 }}>🚁 드론</span>}
                        {b.flag==="1년" && <span style={{ fontSize:10,color:C.blue,fontWeight:600 }}>📅 1년</span>}
                        {b.flag==="피난" && <span style={{ fontSize:10,color:C.purple,fontWeight:600 }}>🚪 피난</span>}
                      </div>
                      {b.note && <div style={{ fontSize:10,color:C.t2,marginTop:3,padding:"3px 9px",background:C.yellowL,borderRadius:4,borderLeft:`2px solid ${C.yellow}`,maxWidth:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }} title={b.note}>{b.note}</div>}
                    </div>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}>
                      {b.fms ? <button onClick={()=>copy(b.fms,`f-${iid}`)} style={{ padding:"4px 8px",borderRadius:5,fontSize:9,fontWeight:700,
                        border:`1px solid ${copied===`f-${iid}`?C.green:C.border}`,background:copied===`f-${iid}`?C.greenL:C.surfaceL,color:copied===`f-${iid}`?C.green:C.blue,cursor:"pointer" }}>{copied===`f-${iid}`?"✓ 복사":"🔐 FMS"}</button>
                        : <span style={{ fontSize:10,color:C.t4 }}>-</span>}
                    </div>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}><span style={{ fontSize:10,color:C.t3 }}>{fd(s.end)}</span></div>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"center" }}><span style={{ fontSize:11,fontWeight:700,color:ddC(dd) }}>{ddL(dd)}</span></div>
                    <div style={{ display:"flex",gap:3,alignItems:"center",justifyContent:"center" }}>
                      {[{v:b.rep,f:"rep",l:"보",ac:C.purple,bc:C.purpleL},{v:b.fmsD,f:"fmsD",l:"F",ac:C.blue,bc:C.blueL}].map(x=>(
                        <button key={x.f} onClick={()=>toggleB(s.id,bi,x.f)} style={{ width:26,height:22,borderRadius:4,fontSize:9,fontWeight:700,
                          border:`1px solid ${x.v?x.ac+"60":C.border}`,background:x.v?x.bc:C.surfaceL,color:x.v?x.ac:C.t4,cursor:"pointer" }}>{x.v?"✓":x.l}</button>
                      ))}
                      {["직납","우편"].map(dv=>(
                        <button key={dv} onClick={()=>setDel(s.id,bi,dv)} style={{ height:22,padding:"0 5px",borderRadius:4,fontSize:9,fontWeight:700,
                          border:`1px solid ${b.delivery===dv?C.green+"60":C.border}`,background:b.delivery===dv?C.greenL:C.surfaceL,color:b.delivery===dv?C.green:C.t4,cursor:"pointer" }}>{dv[0]}</button>
                      ))}
                    </div>
                    <div/>
                  </div>
                );
              })}
            </div>
          );
        })}
        {filtered.length===0 && <div style={{ textAlign:"center",padding:48,color:C.t4 }}>해당 기간 현장 없음</div>}
        </div>
      </div>

      {editSc && <EditPanel sc={editSc} yr={yr} half={half} setDb={setDb} onClose={()=>setEditId(null)}/>}
      <Toast msg={toast}/>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   엑셀 가져오기 / 내보내기 페이지
══════════════════════════════════════════════════════════════ */
function ExportImportPage({ db, setDb }) {
  const [dragOver, setDragOver] = useState(false);
  const [parsed, setParsed] = useState(null);
  const [importing, setImporting] = useState(false);

          {err && (

              <button onClick={()=>setErr(null)} style={{ background:"transparent",border:"none",color:C.red,fontSize:16,cursor:"pointer" }}>×</button>

          )}
          <div style={{ marginTop:14,padding:"12px 14px",background:C.surfaceL,borderRadius:8,border:BD }}>
            <div style={{ fontSize:10,fontWeight:700,color:C.t2,marginBottom:7 }}>📋 자동 인식 컬럼</div>
            <div style={{ display:"flex",gap:5,flexWrap:"wrap" }}>
              {["시트명 26년(상)/(하)","1열 팀","5열 학교","6열 시설","12열 현장조사","14열 완수","16열 FMS","17열 플래그","18열 특기","19열 보고서◎","20열 납품","21열 FMS◎"].map(t=>(
                <span key={t} style={{ fontSize:9,padding:"2px 7px",borderRadius:4,background:C.surface,border:BD,color:C.t2 }}>{t}</span>
              ))}
            </div>

        </div>
      </div>

      <div style={{ background:C.surface,border:BD,borderRadius:14,overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.05)" }}>
        <div style={{ padding:"16px 20px",borderBottom:BD,display:"flex",alignItems:"center",justifyContent:"space-between" }}>
          <div style={{ display:"flex",alignItems:"center",gap:10 }}>
            <span style={{ fontSize:20 }}>📤</span>
            <div><div style={{ fontSize:14,fontWeight:800,color:C.t1 }}>엑셀 내보내기</div><div style={{ fontSize:11,color:C.t3,marginTop:1 }}>원본 엑셀 형식으로 저장</div></div>
          </div>
          <button onClick={doExportAll} style={{ padding:"9px 18px",background:C.green,border:"none",borderRadius:9,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:`0 4px 12px ${C.green}40` }}>↗ 전체 다운로드</button>
        </div>
        <div style={{ padding:"16px 20px",display:"flex",flexDirection:"column",gap:8 }}>
          {Object.entries(db).sort((a,b)=>b[0]-a[0]).flatMap(([yr,hs])=>Object.entries(hs).map(([half,schools])=>{
            const hc=half==="상반기"?C.blue:C.orange, bC=schools.flatMap(s=>s.buildings).length, rep=schools.flatMap(s=>s.buildings).filter(b=>b.rep).length;
            return (
              <div key={`${yr}-${half}`} style={{ display:"flex",alignItems:"center",gap:12,padding:"14px 16px",background:C.surfaceL,borderRadius:10,border:`1px solid ${hc}25`,borderLeft:`3px solid ${hc}` }}>
                <span style={{ fontSize:18 }}>{half==="상반기"?"🌱":"🍂"}</span>
                <div style={{ flex:1 }}><div style={{ fontSize:13,fontWeight:800,color:C.t1 }}>{yr}년 {half}</div>
                  <div style={{ fontSize:11,color:C.t3,marginTop:2 }}>{schools.length}개 학교 · {bC}개 동 · <span style={{ color:C.purple }}>보고서 {rep}/{bC}</span></div></div>
                <div style={{ display:"flex",gap:5 }}>
                  {TEAM_LIST.map(t=>{ const c=schools.filter(s=>s.team===t).length; return c?<span key={t} style={{ fontSize:9,padding:"2px 7px",borderRadius:5,background:TC[t].b,color:TC[t].a,fontWeight:700,border:`1px solid ${TC[t].a}30` }}>{t} {c}</span>:null; })}
                </div>
                <button onClick={()=>doExport(yr,half)} style={{ padding:"8px 16px",borderRadius:8,background:hc+"15",border:`1.5px solid ${hc}40`,color:hc,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap" }}>↗ 다운로드</button>
              </div>
            );
          }))}
        </div>
      </div>
    </div>
  );
}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAZ-uIrJ_x01So8qVC2sIJm9C93BirMeqY",
  authDomain: "ston1130.firebaseapp.com",
  databaseURL: "https://ston1130-default-rtdb.asia-southeast1.firebasedatabase.app",

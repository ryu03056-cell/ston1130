<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback, useRef, useEffect } = React;

/* ══════════════════════════════════════════════════════════════
   STON — 시설물 정밀안전점검 현장 일정·관리 대시보드
   · 연도/반기별 현장 분리
   · 영구 캘린더 (드래그로 일정 변경 → 현장관리 자동 반영)
   · 팀(4팀) 색상 구분 + 팀원 배정
   · 엑셀 가져오기/내보내기 (원본 형식)
══════════════════════════════════════════════════════════════ */

/* ── 색상 시스템 ── */
const C = {
  bg:"#F0F2F5", surface:"#FFFFFF", surfaceL:"#F7F9FB", surfaceD:"#ECEEF2",
  border:"#E2E6ED", borderD:"#CDD2DB",
  t1:"#1A2332", t2:"#4A5568", t3:"#8A94A6", t4:"#BCC3CE",
  team1:"#1D6FF2", team1b:"#EBF2FF", team1c:"#1058CC",
  team2:"#0A9260", team2b:"#E6F7F2", team2c:"#077A4F",
  team3:"#D93B2B", team3b:"#FDF0EE", team3c:"#B02E20",
  team4:"#7C3AED", team4b:"#F3EFFE", team4c:"#5B21B6",
  green:"#0D9B6C", greenL:"#E8F7F2",
  red:"#D93B2B",   redL:"#FDF0EE",
  orange:"#E07A20",orangeL:"#FDF3E8",
  purple:"#7C3AED",purpleL:"#F3EFFE",
  blue:"#1D6FF2",  blueL:"#EBF2FF",
  yellow:"#B58A00",yellowL:"#FDF8E8",
};

/* ── 인원 명단 (팀 구분 없이 전체 인원) ── */
const MEMBERS = ["한상오","장민태","채승준","함예린","김동영","한범용","권태민","김유빈",
  "정도혁","윤종현","이동현","관우남","이준혁","박서연","최민준","윤지현"];
const allMembers = () => MEMBERS.slice();

/* 인원별 고정 색상 — 이름 해시로 일관된 색을 주어 일정에서 구분이 쉽도록 */
/* 인원 색상 — 사람마다 다르게 하지 않고 검정으로 통일 (가독성 우선) */
const memberColor = () => C.t1;

/* 카테고리 — 학교 / LH 아파트 정밀점검을 구분해서 관리 */
const CAT_LH = "LH";
const isLH = (yr) => String(yr) === CAT_LH;

/* 현장 표시(드론·1년·피난) — 학교 단위, 중복 선택 가능 */
const FLAG_OPTS = [
  { v:"드론", label:"🚁 드론", color:C.orange },
  { v:"1년",  label:"📅 1년",  color:C.blue },
  { v:"피난", label:"🚪 피난", color:C.purple },
];
const getFlags = (s) => {
  if (Array.isArray(s?.flags)) return s.flags;
  /* 예전 데이터 호환: 동별 flag(●=드론)를 학교 단위로 합침 */
  const set = new Set();
  (s?.buildings||[]).forEach(b => {
    if (!b || !b.flag) return;
    if (b.flag === "●" || b.flag === "드론") set.add("드론");
    else if (b.flag === "1년") set.add("1년");
    else if (b.flag === "피난") set.add("피난");
  });
  return [...set];
};
/* ══════════════════════════════════════════════════════════════
   중복 방지 — 같은 현장이 두 번 올라가지 않게 자동 정리
   · 학교명 표기 차이(여주고 / 여주고등학교 / 공백·괄호)를 같은 이름으로 인식
   · 단, 옹벽과 건물처럼 관리번호도 동도 다른 '별개 건'은 그대로 둔다
   ══════════════════════════════════════════════════════════════ */
const normSchool = v => String(v==null?"":v)
  .replace(/\s+/g,"")
  .replace(/[（]/g,"(").replace(/[）]/g,")")
  .replace(/[·・‧∙\-_.]/g,"")
  .replace(/여자고등학교/g,"여고").replace(/여자중학교/g,"여중")
  .replace(/초등학교/g,"초").replace(/중학교/g,"중").replace(/고등학교/g,"고")
  .toLowerCase();
const bldKey = b => String((b&&b.b)||"").replace(/\s+/g,"").toLowerCase();

/* 같은 학교명 안에서 '같은 건'인지 판정 */
function isSameSite(a, b) {
  if (a.carried || b.carried) return true;              // 이월본은 실제 데이터와 같은 건
  const na = String(a.no||"").trim(), nb = String(b.no||"").trim();
  if (na && nb && na === nb) return true;               // 관리번호가 같음
  const sa = new Set((a.buildings||[]).map(bldKey).filter(Boolean));
  const sb = new Set((b.buildings||[]).map(bldKey).filter(Boolean));
  /* 동 구성이 완전히 같으면 같은 건 (번호만 다르게 두 번 적힌 경우) */
  if (sa.size && sa.size===sb.size && [...sa].every(x=>sb.has(x))) return true;
  if (!na || !nb) {                                     // 한쪽에 번호가 없는 '껍데기 행'
    if ([...sb].some(x=>sa.has(x))) return true;        // 동이 하나라도 겹치면 같은 건
    const shell = (x,set) => set.size<=1 && (set.size===0 || normSchool([...set][0])===normSchool(x.school));
    if (shell(a,sa) || shell(b,sb)) return true;        // 동명이 학교명뿐인 행
  }
  return false;                                          // 번호도 동도 다르면 별개 건(옹벽/건물 등)
}

/* 동 목록 합치기 — 이름 기준 합집합, 값이 있는 쪽을 채택 */
function mergeBuildings(A, B) {
  const out = [], idx = new Map();
  [...(A||[]), ...(B||[])].forEach(b => {
    if (!b) return;
    const k = bldKey(b);
    if (!k) { out.push(b); return; }
    const i = idx.get(k);
    if (i === undefined) { idx.set(k, out.length); out.push({ ...b }); return; }
    const cur = out[i];
    Object.entries(b).forEach(([f,v]) => { if (v!=null && v!=="" && (cur[f]==null || cur[f]==="")) cur[f]=v; });
    cur.rep = cur.rep || b.rep; cur.fmsD = cur.fmsD || b.fmsD; cur.delivery = cur.delivery || b.delivery;
  });
  return out;
}

/* 중복 두 건을 하나로 — 실제 데이터/정보 많은 쪽을 기준으로 삼고 빈 값만 채운다 */
function mergeSites(a, b) {
  const base = (a.carried && !b.carried) ? b
             : (!a.carried && b.carried) ? a
             : ((b.buildings||[]).length > (a.buildings||[]).length ? b : a);
  const other = base === a ? b : a;
  const pick = (f) => { const v = base[f]; return (v==null || v==="") ? (other[f] ?? null) : v; };
  return {
    ...base,
    id: a.id,                                            // 먼저 있던 id 유지
    no: String(base.no||"").trim() || other.no || "",
    school: (base.school||"").length >= (other.school||"").length ? base.school : other.school,
    region: pick("region") || "", tel: pick("tel") || "",
    kind: pick("kind") || "정기점검",
    field: pick("field"), start: pick("start"), end: pick("end"),
    contract: (base.contract!=null && base.contract>0) ? base.contract : (other.contract ?? null),
    assignees: (base.assignees&&base.assignees.length) ? base.assignees : (other.assignees||[]),
    headcount: base.headcount || other.headcount || 2,
    progress: (base.progress && Object.keys(base.progress).length) ? base.progress : (other.progress||{}),
    flags: [...new Set([...(getFlags(base)||[]), ...(getFlags(other)||[])])],
    carried: !!(base.carried && other.carried),          // 한쪽이라도 실제 데이터면 실제로
    buildings: mergeBuildings(base.buildings, other.buildings),
  };
}

/* 한 반기(또는 LH) 안에서 중복 제거 — 순서 유지 */
function dedupeBucket(arr) {
  const list = (arr||[]).filter(Boolean);
  const kept = [], slots = new Map();                    // 학교명 → kept 인덱스 목록
  list.forEach(s => {
    const nm = normSchool(s.school);
    if (!nm) { kept.push(s); return; }
    const idxs = slots.get(nm) || [];
    const hit = idxs.find(i => isSameSite(kept[i], s));
    if (hit === undefined) { kept.push(s); idxs.push(kept.length-1); slots.set(nm, idxs); }
    else kept[hit] = mergeSites(kept[hit], s);
  });
  return kept;
}

/* db 전체 중복 정리 — 바뀐 게 없으면 원본을 그대로 돌려준다(불필요한 저장 방지) */
function dedupeDb(db) {
  let changed = false;
  const next = {};
  Object.entries(db||{}).forEach(([y,hs]) => {
    next[y] = {};
    Object.entries(hs||{}).forEach(([h,arr]) => {
      const d = dedupeBucket(arr);
      if (d.length !== (arr||[]).length) changed = true;
      next[y][h] = d;
    });
  });
  return changed ? next : db;
}

/* ══════════════════════════════════════════════════════════════
   지도 — 지역 대표 좌표 (지오코딩 실패 시 대략 위치로 표시)
   ══════════════════════════════════════════════════════════════ */
const REGION_XY = {
  수원:[37.2636,127.0286], 성남:[37.4200,127.1265], 용인:[37.2411,127.1776], 부천:[37.5035,126.7660],
  안산:[37.3219,126.8309], 안양:[37.3943,126.9568], 평택:[36.9921,127.1129], 시흥:[37.3800,126.8028],
  김포:[37.6152,126.7156], 광주:[37.4292,127.2551], 광명:[37.4785,126.8646], 군포:[37.3617,126.9352],
  하남:[37.5393,127.2148], 오산:[37.1499,127.0774], 이천:[37.2722,127.4350], 안성:[37.0080,127.2797],
  의왕:[37.3448,126.9683], 양평:[37.4917,127.4875], 여주:[37.2983,127.6370], 과천:[37.4292,126.9877],
  고양:[37.6584,126.8320], 남양주:[37.6360,127.2165], 의정부:[37.7381,127.0337], 파주:[37.7599,126.7800],
  가평:[37.8315,127.5095], 포천:[37.8949,127.2003], 양주:[37.7852,127.0458], 구리:[37.5943,127.1296],
  동두천:[37.9036,127.0606], 연천:[38.0965,127.0748], 화성:[37.1996,126.8312],
  안양과천:[37.4100,126.9700], 화성오산:[37.1750,126.9550], 분당:[37.3826,127.1189],
  서울:[37.5665,126.9780], 인천:[37.4563,126.7052], 대구:[35.8714,128.6014], 밀양:[35.5038,128.7466],
  부산:[35.1796,129.0756], 대전:[36.3504,127.3845], 광주광역:[35.1595,126.8526], 울산:[35.5384,129.3114],
  세종:[36.4800,127.2890], 춘천:[37.8813,127.7300], 원주:[37.3422,127.9202], 천안:[36.8151,127.1139],
};
const regionXY = (region) => {
  const r = String(region||"").replace(/\s+/g,"").replace(/(시|군|구)$/,"");
  if (REGION_XY[r]) return REGION_XY[r];
  const hit = Object.keys(REGION_XY).find(k => r.includes(k) || k.includes(r));
  return hit ? REGION_XY[hit] : null;
};
/* 같은 지역 현장이 완전히 겹치지 않게 이름 기반으로 살짝 흩뿌림 */
const jitter = (seed, amp=0.012) => {
  let h = 0; const t = String(seed||"");
  for (let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) >>> 0;
  return [((h%1000)/1000 - 0.5)*amp, (((h>>10)%1000)/1000 - 0.5)*amp];
};

/* 두 좌표 사이 거리(km) — 검색 결과가 엉뚱한 도시로 잡혔는지 검사용 */
const distKm = (a, b) => {
  const R = 6371, rad = d => d*Math.PI/180;
  const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const x = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
};

/* 카카오맵 SDK 로드 (키가 있을 때만) */
let kakaoLoading = null;
function loadKakao(key) {
  if (typeof window !== "undefined" && window.kakao && window.kakao.maps && window.kakao.maps.services) return Promise.resolve(window.kakao);
  if (kakaoLoading) return kakaoLoading;
  kakaoLoading = new Promise((res, rej) => {
    let done = false;
    const fail = (msg) => { if (done) return; done = true; kakaoLoading = null; rej(new Error(msg)); };
    /* 키·도메인이 잘못되면 응답 자체가 안 오는 경우가 있어 시간 제한을 둔다 */
    const timer = setTimeout(() => fail(
      "지도를 불러오지 못했습니다(응답 없음).\n① 카카오맵 사용 설정이 ON인지 ② JavaScript 키에 이 사이트 주소가 'JavaScript SDK 도메인'으로 등록됐는지 확인해 주세요."), 12000);
    const sc = document.createElement("script");
    sc.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services,clusterer&autoload=false`;
    sc.onload = () => {
      try {
        window.kakao.maps.load(() => { if (done) return; done = true; clearTimeout(timer); res(window.kakao); });
      } catch(e){ clearTimeout(timer); fail((e&&e.message)||String(e)); }
    };
    sc.onerror = () => { clearTimeout(timer); fail(
      "카카오맵 파일을 불러오지 못했습니다.\n키가 'JavaScript 키'가 맞는지(REST API 키 아님), 카카오맵 사용 설정이 ON인지 확인해 주세요."); };
    document.head.appendChild(sc);
  });
  return kakaoLoading;
}

/* 현장 전화번호 — tel 칸이 비어 있으면 특이사항·메모 글에서 번호를 찾아낸다 */
const TEL_RE = /(0\d{1,2})[-.\s]?(\d{3,4})[-.\s]?(\d{4})/;
const siteTel = (s) => {
  const direct = String((s && s.tel) || "").trim();
  if (direct) return direct;
  const texts = [];
  (s && s.buildings || []).forEach(b => { if (b && b.note) texts.push(String(b.note)); });
  if (s && s.note) texts.push(String(s.note));
  for (const t of texts) {
    const m = t.match(TEL_RE);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  }
  return "";
};

const STEPS = ["착수계","현장조사","기타자료","보고서","검토","제본","납품","완수"];
const STEP_ICON = { 착수계:"📝", 현장조사:"📍", 기타자료:"📎", 보고서:"📄", 검토:"🔍", 제본:"📚", 납품:"📦", 완수:"🏁" };
const STEP_SPECIAL = { 검토:true, 제본:true };   // 별도 강조
/* 진행도 계산: done(완료 개수), pos(앞에서부터 연속 완료=현재 위치), pct(%) */
function getProgress(s) {
  const p = (s && s.progress) || {};
  const done = STEPS.filter(k => p[k]).length;
  let pos = 0;
  for (const k of STEPS) { if (p[k]) pos++; else break; }
  return { p, done, pos, pct: Math.round(done / STEPS.length * 100), total: STEPS.length };
}

/* ── 기준일 & D-day ── */
const BASE_DATE = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
const calcDday = (end, base = BASE_DATE) => {
  if (!end) return null;
  const [y,m,d]   = end.split("-").map(Number);
  const [by,bm,bd]= base.split("-").map(Number);
  return Math.floor((new Date(y,m-1,d) - new Date(by,bm-1,bd)) / 86400000);
};
const ddC = d => d===null ? C.t3 : d>=0 ? C.green : d>=-7 ? C.red : d>=-30 ? C.orange : C.t3;
const ddL = d => d===null ? "-" : d>=0 ? `D+${d}` : `D${d}`;
const fd  = s => s ? s.slice(5).replace("-","/") : "-";

const BD = `1px solid ${C.border}`;
const F  = `'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif`;

const MENUS = [
  { id:"schedule", icon:"📅", label:"현장 일정" },
  { id:"sites",    icon:"🏫", label:"현장 관리" },
  { id:"map",      icon:"🗺", label:"현장 지도" },

function StepBar({ progress, compact }) {
  const { p, done, pct } = getProgress({ progress });
  const segH = compact ? 7 : 9;
  return (
    <div style={{ display:"flex",alignItems:"center",gap:compact?3:4,flexWrap:"wrap" }}>
      <div style={{ display:"flex",gap:compact?2:3 }}>
        {STEPS.map((k) => {
          const on = !!p[k];
          const sp = STEP_SPECIAL[k];
          const col = sp ? C.purple : C.blue;
          return (
            <div key={k} title={`${STEP_ICON[k]} ${k}${on?" ✓":""}`}
              style={{ width:compact?15:22, height:segH, borderRadius:3,
                background:on?col:C.surfaceD,
                border:sp ? `1.5px solid ${on?col:col+"55"}` : `1px solid ${on?col:"transparent"}`,
                boxSizing:"border-box" }}/>
          );
        })}
      </div>
      <span style={{ fontSize:compact?9:11,fontWeight:800,color:done===STEPS.length?C.green:C.t2,marginLeft:3 }}>
        {done}/{STEPS.length}
        <span style={{ fontSize:compact?8:10,fontWeight:600,color:C.t4,marginLeft:3 }}>{pct}%</span>
      </span>
    </div>
  );
}

/* 모바일 화면 감지 훅 */
function useIsMobile(bp = 820) {
  const [m, setM] = useState(typeof window !== "undefined" ? window.innerWidth < bp : false);
  useEffect(() => {
    const on = () => setM(window.innerWidth < bp);
    on();
    window.addEventListener("resize", on);
    return () => window.removeEventListener("resize", on);
  }, [bp]);
  return m;
}

/* ══════════════════════════════════════════════════════════════
   엑셀 파싱 / 내보내기
   엑셀 열: 1팀 2No 3종류 4지역 5학교 6시설 7층 8연면적 9높이 10길이
            11종별 12현장조사 13착수 14완수 15기간 16FMS 17플래그
            18특기 19보고서완료(◎) 20납품 21FMS등록(◎)
══════════════════════════════════════════════════════════════ */
function parseSheetName(name) {
  /* 데이터 시트(반기) 인식 — "26년(상)", "2026년(하)", "26년 하반기", "26하", "2026 상반기" 등 다양한 형식 허용.
     단, 예산·특이사항·메모 등 데이터가 아닌 시트는 제외. */
  const s = String(name).trim();
  if (/예산|특이|비고|메모|참고|양식|템플릿|요약|sample|sheet/i.test(s)) return null;
  const m = s.match(/^(?:20)?(\d{2})\s*년?\s*[\(\[\s\-·]*([상하])(?:\s*반기)?\s*[\)\]]?\s*$/);
  if (!m) return null;
  return { year:`20${m[1]}`, half:m[2]==="상"?"상반기":"하반기" };
}
function parseExcelDate(v) {
  if (v===null || v===undefined || v==="") return null;
  if (v instanceof Date && !isNaN(v)) {
    const tz = v.getTimezoneOffset()*60000;
    return new Date(v - tz).toISOString().slice(0,10);
  }
  if (typeof v === "number") {
    const d = new Date(Math.round((v-25569)*86400*1000));
    return isNaN(d) ? null : d.toISOString().slice(0,10);
  }
  if (typeof v === "string") {
    const s = v.trim();
    let m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);          // YYYY-MM-DD / YYYY.MM.DD
    if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
    m = s.match(/(\d{2})[-./](\d{1,2})[-./](\d{1,2})/);              // YY.MM.DD → 20YY
    if (m) return `20${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  }
  return null;
}
function parseSheet(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });
  const clean = v => v==null ? "" : String(v).replace(/\u00a0/g," ").trim();
  /* 헤더 매칭용 정규화: 한글·영문·숫자만 남기고 소문자화 */
  const norm = v => clean(v).toLowerCase().replace(/[^a-z0-9가-힣]/g,"");

  /* 1) 헤더 행 자동 탐지 — 알려진 머리글 단어가 가장 많은 행 (앞 8행 내) */
  const HKEYS = ["학교","시설물명","번호","no","지역","착수","준공","완수","현장조사","연면적","시설명","동명","특기","점검종류","납품"];
  let hIdx = -1, best = 0;
  for (let i=0; i<Math.min(rows.length,8); i++) {
    const cells = (rows[i]||[]).map(norm);
    const score = cells.filter(c => c && HKEYS.some(k => c.includes(k))).length;
    if (score > best) { best = score; hIdx = i; }
  }
  if (hIdx < 0 || best < 3) return [];                 // 인식 불가 시트
  const H = (rows[hIdx]||[]).map(norm);

  /* 2) 머리글 이름으로 열 위치 매핑 (연도별 양식 차이 흡수) */
  const idxInc = (...keys) => H.findIndex(h => h && keys.some(k => h.includes(k)));
  const idxEq  = (...keys) => H.findIndex(h => h && keys.some(k => h === k));
  const col = {
    no:       (()=>{ const e=idxEq("no","번호"); return e>=0?e:idxInc("번호"); })(),
    kind:     idxInc("점검종류"),
    region:   idxInc("지역"),
    school:   (()=>{ let i=H.findIndex(h=>h.includes("학교명")||h.includes("시설물명")); return i>=0?i:idxInc("학교"); })(),
    building: idxEq("시설명","동명"),
    floor:    idxInc("층수"),
    area:     idxInc("연면적"),
    height:   idxInc("높이"),
    length:   idxInc("길이"),
    jong:     idxInc("종별"),
    field:    idxInc("현장조사"),
    start:    idxInc("착수"),
    end:      idxInc("완수","준공"),
    fms:      H.findIndex(h => h.includes("fms") && h.includes("아이디")),
    flag:     idxInc("드론","피난","1년","위치도"),
    note:     idxInc("특기"),

      const names  = building.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

      names.forEach((bn,bi) => {

          area:  pickArea(areas[bi]!=null?areas[bi]:areas[0]||""),
          height: col.height>=0 ? (clean(gv(r,col.height))||null) : null,
          len:    col.length>=0 ? (clean(gv(r,col.length))||null) : null,
          jong:   col.jong>=0   ? (clean(gv(r,col.jong))||null)   : null,
          fms: clean(gv(r,col.fms))||null, note: clean(gv(r,col.note))||null,

function parseLHDate(v) {

  }

  if (!t) return null;
  const q = n => String(parseInt(n,10)).padStart(2,"0");
  /* 한 칸에 여러 날짜(줄바꿈·슬래시·물결)가 있으면 첫 날짜만 사용 */
  let m = t.match(/(\d{4})\s*[-.\/]\s*(\d{1,2})\s*[-.\/]\s*(\d{1,2})/);      // 2026-03-18
  if (m) return `${m[1]}-${q(m[2])}-${q(m[3])}`;
  m = t.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/);                 // 3/19/26 (월/일/년)
  if (m) { let y = parseInt(m[3],10); if (y < 100) y += 2000; return `${y}-${q(m[1])}-${q(m[2])}`; }
  const n = Number(t);                                                        // 엑셀 일련번호
  if (!isNaN(n) && n > 20000 && n < 60000) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if (!isNaN(d)) return `${d.getUTCFullYear()}-${q(d.getUTCMonth()+1)}-${q(d.getUTCDate())}`;
  }
  return null;
}

function parseLHSheet(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:false });
  const cl = v => v==null ? "" : String(v).replace(/\u00a0/g," ").trim();

    gubun:   idx("구분"),
    complex: idx("단지명"),
    loc:     idx("위치"),
    b:       idx("시설물명"),
    area:    idx("연면적"),
    floor:   idx("층수"),
    type:    idx("유형"),
    tel:     idx("관리사무소"),
    fms:     H.findIndex(h => h.includes("fms") && h.includes("아이디")),
    field:   idx("현장점검"),
    defect:  idx("결함조사"),
    equip:   idx("장비조사"),
    due:     idx("도래시기"),

  const num = v => { const n = parseFloat(String(v==null?"":v).replace(/[^0-9.]/g,"")); return isNaN(n)?null:n; };
  const gv = (r,i) => (i==null||i<0) ? null : r[i];

  for (let i=hIdx+1; i<rows.length; i++) {

        id: `lh-${Date.now().toString(36)}-${out.length}-${Math.random().toString(36).slice(2,6)}`,
        no: cl(gv(r,col.gubun)),
        school: name,
        region: shortRegion(gv(r,col.loc)),
        addr: cl(gv(r,col.loc)),
        kind: "정밀점검",
        tel: cl(gv(r,col.tel)),
        field: parseLHDate(gv(r,col.field)),
        start: parseLHDate(gv(r,col.defect)),      // 결함조사
        end:   parseLHDate(gv(r,col.due)),         // 정밀안전점검 도래시기

    if (!cur) continue;

    if (!cur.tel)   cur.tel   = cl(gv(r,col.tel));
    if (!cur.field) cur.field = parseLHDate(gv(r,col.field));
    if (!cur.start) cur.start = parseLHDate(gv(r,col.defect));
    if (!cur.end)   cur.end   = parseLHDate(gv(r,col.due));
    if (!cur.region) cur.region = shortRegion(gv(r,col.loc));
    if (!cur.assignees.length) cur.assignees = splitNames(gv(r,col.who));
    if (bname) {
      const fmsRaw = cl(gv(r,col.fms));
      const bits = [];
      const ty = cl(gv(r,col.type));   if (ty) bits.push(`유형 ${ty}`);
      const eq = cl(gv(r,col.equip));  if (eq) bits.push(`장비조사 ${eq}`);
      cur.buildings.push({
        b: bname,
        floor: cl(gv(r,col.floor)) || null,
        area:  num(gv(r,col.area)),
        height:null, len:null, jong:null,
        fms: (fmsRaw && fmsRaw !== '"') ? fmsRaw : null,     // " 는 윗행과 같다는 표시

}
function xlHalfLabel(yr, half) { return `${String(yr).slice(2)}년(${half==="상반기"?"상":"하"})`; }
function xlDate(v) { if (!v) return ""; const p=String(v).split("-").map(Number); return (p.length===3 && p[0]) ? new Date(p[0],p[1]-1,p[2],12) : ""; }
function buildSheet(schools) {

/* 범용 스타일 표 — headers:[…], rows:[[…]], meta:[{align,date,num,bold,wrap,team,w}], opts:{totalRow} */
function buildAuxSheet(headers, rows, meta, opts={}) {

  for (let c=0;c<nC;c++) {

  for (let r=1;r<=last;r++) {
    const totalRow = opts.totalRow && r===last;
    /* 데이터 행은 색 없이 흰 배경 · 검정 글자 (헤더만 색) */
    for (let c=0;c<nC;c++) {

        border:{ top:{style:"thin",color:{rgb:"FFE3E8F0"}}, bottom:{style:"thin",color:{rgb:"FFEDF0F5"}}, left:{style:"thin",color:{rgb:"FFE3E8F0"}}, right:{style:"thin",color:{rgb:"FFE3E8F0"}} } };

  for (let c=0;c<nC;c++) {
    const a = XLSX.utils.encode_cell({ r:0, c });
    if (!ws[a]) ws[a]={ t:"s", v:HEAD[c] };
    ws[a].s = { font:{ name:"맑은 고딕", sz:10, bold:true, color:{ rgb:"FFFFFFFF" } },
      fill:{ patternType:"solid", fgColor:{ rgb:"FF1D6FF2" } },
      alignment:{ horizontal:"center", vertical:"center", wrapText:true },
      border:{ top:{style:"thin",color:{rgb:"FF1559C9"}}, bottom:{style:"medium",color:{rgb:"FF1559C9"}}, left:{style:"thin",color:{rgb:"FF4D8AE8"}}, right:{style:"thin",color:{rgb:"FF4D8AE8"}} } };
  }
  /* 합계 행 */
  for (let c=0;c<nC;c++) {
    const a = XLSX.utils.encode_cell({ r:last, c });
    if (!ws[a]) ws[a]={ t:"s", v:"" };
    ws[a].s = { font:{ name:"맑은 고딕", sz:10, bold:true, color:{ rgb:"FF1A2332" } },
      fill:{ patternType:"solid", fgColor:{ rgb:"FFFFFFFF" } },
      alignment:{ horizontal: c===6?"right":"center", vertical:"center" },
      border:{ top:{style:"medium",color:{rgb:"FFC2CCDC"}}, bottom:{style:"medium",color:{rgb:"FFC2CCDC"}}, left:{style:"thin",color:{rgb:"FFE3E8F0"}}, right:{style:"thin",color:{rgb:"FFE3E8F0"}} } };
    if (c===6 && typeof ws[a].v==="number") ws[a].z = "#,##0";
  }
  /* 데이터 블록 */
  blocks.forEach(bk => {
    for (let ri=0; ri<bk.rows; ri++) {
      const r = bk.startRow + ri;
      const lastOfSchool = ri===bk.rows-1;
      for (let c=0;c<nC;c++) {
        const a = XLSX.utils.encode_cell({ r, c });
        if (!ws[a]) ws[a]={ t:"s", v:"" };
        /* 데이터 행은 색 없이 흰 배경 · 검정 글자 (헤더만 색) */
        let fill = "FFFFFFFF", font = { name:"맑은 고딕", sz:9.5, color:{ rgb:"FF1A2332" } };
        if (c===3 || c===6) font={ ...font, bold:true };
        ws[a].s = { font, fill:{ patternType:"solid", fgColor:{ rgb:fill } },
          alignment:{ vertical: SCHOOL_COLS.includes(c)?"center":"top", horizontal: LEFT_COLS.has(c)?"left":(c===5||c===6?"right":"center") },
          border:{ top:{style:"thin",color:{rgb:"FFE3E8F0"}},
            bottom:{ style: lastOfSchool?"medium":"thin", color:{ rgb: lastOfSchool?"FFC2CCDC":"FFEDF0F5" } },
            left:{style:"thin",color:{rgb:"FFE3E8F0"}}, right:{style:"thin",color:{rgb:"FFE3E8F0"}} } };
        if ((c===5||c===6) && typeof ws[a].v==="number") ws[a].z = "#,##0";
      }
    }
    if (bk.rows>1) {
      ws["!merges"] = ws["!merges"] || [];
      SCHOOL_COLS.forEach(c => ws["!merges"].push({ s:{r:bk.startRow,c}, e:{r:bk.startRow+bk.rows-1,c} }));
    }
  });
  return ws;
}

/* 특이사항 시트 — entries:[{yr,half,schools}] */

/* 현장일정 시트 — 학교별 현장조사·착수·완수일 + 담당자, 일정 순 정렬. entries:[{yr,half,schools}] */
function buildScheduleSheet(entries) {
  const multi = entries.length > 1;
  const today = new Date(); today.setHours(0,0,0,0);
  const ddStr = end => { if (!end) return ""; const d=Math.floor((new Date(end)-today)/86400000); return d>=0?`D-${d}`:`D+${-d}`; };
  const sortKey = s => { const ds=[s.field,s.start,s.end].filter(Boolean).map(x=>new Date(x).getTime()).filter(t=>!isNaN(t)); return ds.length?Math.min(...ds):Infinity; };
  const headers = multi
    ? ["구분","지역","학교명","표시","현장조사","착수일","완수일","잔여","담당자","연락처"]
    : ["지역","학교명","표시","현장조사","착수일","완수일","잔여","담당자","연락처"];
  const meta = multi
    ? [{align:"center",w:9},{align:"center",team:true,w:9},{align:"center",w:9},{align:"left",bold:true,w:26},{align:"center",date:true,w:12},{align:"center",date:true,w:12},{align:"center",date:true,w:12},{align:"center",w:8},{align:"left",w:28},{align:"center",w:16}]
    : [{align:"center",team:true,w:9},{align:"center",w:9},{align:"left",bold:true,w:26},{align:"center",date:true,w:12},{align:"center",date:true,w:12},{align:"center",date:true,w:12},{align:"center",w:8},{align:"left",w:28},{align:"center",w:16}];
  const all = [];
  entries.forEach(({yr,half,schools}) => (schools||[]).forEach(s => all.push({ s, label: xlHalfLabel(yr,half) })));
  all.sort((a,b) => sortKey(a.s) - sortKey(b.s));
  const rows = all.map(({s,label}) => {
    const base = [ s.region||"", s.school||"", getFlags(s).join(","), xlDate(s.field), xlDate(s.start), xlDate(s.end), ddStr(s.end), (s.assignees||[]).join(", "), s.tel||"" ];
    return multi ? [label, ...base] : base;
  });
  if (!rows.length) rows.push(new Array(headers.length).fill(""));
  return buildAuxSheet(headers, rows, meta);
}

/* 현장일정 캘린더 시트 — 월별 달력. 각 날짜 칸에 일정(조사/착수/완수)·현장명·담당자. entries:[{yr,half,schools}] */
function buildCalendarSheet(entries) {
  const today = new Date(); today.setHours(0,0,0,0);
  const tkey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  const LABEL = { 현장조사:"조사", 착수:"착수", 완수:"완수" };
  const byDay = {};   // dk -> ["조사·성남중 (한상오,채승준)", ...]
  const seen = new Set();
  const addEv = (d,type,s) => {
    const k = String(d||"").slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    /* 같은 현장·같은 날·같은 종류는 한 번만 (이월본이 상·하반기 양쪽에 있어도 중복 표시 안 됨) */
    const dedup = `${k}|${type}|${(s.school||"").trim()}`;
    if (seen.has(dedup)) return; seen.add(dedup);
    const who = (s.assignees||[]).join(",");
    (byDay[k]=byDay[k]||[]).push(`${LABEL[type]}·${s.school||""}${who?` (${who})`:""}`);
  };
  entries.forEach(({schools})=> (schools||[]).forEach(s => { addEv(s.field,"현장조사",s); addEv(s.start,"착수",s); addEv(s.end,"완수",s); }));
  const keys = Object.keys(byDay).sort();
  if (!keys.length) { const w0=XLSX.utils.aoa_to_sheet([["등록된 현장일정이 없습니다."]]); w0["!cols"]=[{wch:40}]; return w0; }

  const WD = ["일","월","화","수","목","금","토"];
  const FNT = "맑은 고딕";
  const thin = c => ({ style:"thin", color:{ rgb:c } });
  const bd = c => ({ top:thin(c), bottom:thin(c), left:thin(c), right:thin(c) });
  const fill = h => ({ patternType:"solid", fgColor:{ rgb:h } });

  const aoa=[], rowH=[], merges=[], styles={};
  const setS=(r,c,st)=>{ styles[`${r}_${c}`]=st; };

  const [fy,fm]=keys[0].split("-").map(Number); const [ly,lm]=keys[keys.length-1].split("-").map(Number);
  let y=fy,m=fm;
  while (y<ly || (y===ly && m<=lm)) {
    const monthKeys = keys.filter(k=>{const a=k.split("-");return +a[0]===y&&+a[1]===m;});
    if (monthKeys.length) {
      /* 제목 */
      const rT=aoa.length; aoa.push([`${y}년 ${m}월`,"","","","","",""]);
      merges.push({ s:{r:rT,c:0}, e:{r:rT,c:6} });
      setS(rT,0,{ font:{name:FNT,sz:13,bold:true,color:{rgb:"FFFFFFFF"}}, fill:fill("FF1D6FF2"), alignment:{horizontal:"center",vertical:"center"}, border:bd("FF1559C9") });
      rowH[rT]={hpt:26};
      /* 요일 헤더 */
      const rW=aoa.length; aoa.push(WD.slice());
      WD.forEach((w,c)=> setS(rW,c,{ font:{name:FNT,sz:10,bold:true,color:{rgb:"FF1A2332"}}, fill:fill("FFF0F4FA"), alignment:{horizontal:"center",vertical:"center"}, border:bd("FFD5DEEA") }));
      rowH[rW]={hpt:20};
      /* 주차별 — 한 칸에 날짜 + 그날 일정 전부 */
      const firstDow=new Date(y,m-1,1).getDay(); const daysIn=new Date(y,m,0).getDate(); const weeks=Math.ceil((firstDow+daysIn)/7);
      for (let w=0; w<weeks; w++) {
        const vals=[], meta=[]; let maxLines=1;
        for (let c=0;c<7;c++){
          const idx=w*7+c; const dnum=idx-firstDow+1;
          if (idx<firstDow || dnum>daysIn){ vals.push(""); meta.push({c,blank:true}); continue; }
          const dk=`${y}-${String(m).padStart(2,"0")}-${String(dnum).padStart(2,"0")}`;
          const es=byDay[dk]||[];
          vals.push([String(dnum), ...es].join("\n"));
          maxLines=Math.max(maxLines, 1+es.length);
          meta.push({ c, dow:c, has:es.length>0, today:dk===tkey });
        }
        const rR=aoa.length; aoa.push(vals);
        rowH[rR]={hpt:Math.max(40, maxLines*14+8)};
        /* 날짜 칸은 색 없이 흰 배경 · 검정 글자 (제목/요일 머리만 색). 오늘만 굵은 테두리로 표시 */
        meta.forEach(dm=>{
          setS(rR,dm.c,{ font:{name:FNT,sz:9,bold:!!dm.today,color:{rgb:dm.blank?"FFB8C0CC":"FF1A2332"}}, fill:fill("FFFFFFFF"),
            alignment:{horizontal:"left",vertical:"top",wrapText:true},
            border: dm.today
              ? { top:{style:"medium",color:{rgb:"FF1559C9"}}, bottom:{style:"medium",color:{rgb:"FF1559C9"}},
                  left:{style:"medium",color:{rgb:"FF1559C9"}}, right:{style:"medium",color:{rgb:"FF1559C9"}} }
              : bd("FFE0E6EE") });
        });
      }
      aoa.push(new Array(7).fill("")); rowH[aoa.length-1]={hpt:8};
    }
    m++; if(m>12){m=1;y++;}
  }
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=new Array(7).fill(0).map(()=>({wch:22}));
  ws["!merges"]=merges;
  ws["!rows"]=aoa.map((_,i)=>rowH[i]||{hpt:16});
  Object.entries(styles).forEach(([rc,st])=>{const p=rc.split("_");const a=XLSX.utils.encode_cell({r:+p[0],c:+p[1]});if(!ws[a])ws[a]={t:"s",v:""};ws[a].s=st;});
  return ws;
}
function parseBudget(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });
  const clean = v => v==null ? "" : String(v).replace(/\u00a0/g," ").trim();
  const norm  = v => clean(v).toLowerCase().replace(/[^a-z0-9가-힣]/g,"");
  /* 헤더 영역(학교명이 있는 행)과 그 아래 2행에서 열 탐지 */
  let schoolRow = -1, schoolCol = -1;
  for (let i=0; i<Math.min(rows.length,10); i++) {
    const c = (rows[i]||[]).findIndex(v => { const n=norm(v); return n==="학교명"||n==="시설물명"; });
    if (c>=0) { schoolRow=i; schoolCol=c; break; }
  }
  if (schoolRow<0) return {};
  /* 금액 열: 학교명 행~+2행에서 '합계' 우선, 없으면 '예산액' */
  let amtCol = -1;
  for (const pat of ["합계","예산액"]) {
    for (let i=schoolRow; i<=schoolRow+2 && i<rows.length && amtCol<0; i++) {
      const idx=(rows[i]||[]).findIndex(v => norm(v).includes(pat));
      if (idx>=0) amtCol=idx;
    }
    if (amtCol>=0) break;
  }
  if (amtCol<0) return {};
  const toNum = v => { if(v==null) return 0; const n=parseFloat(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; };
  const out = {};                                  // { 학교명: { total:원, items:[원,…] (시설 순서) } }
  for (let i=schoolRow+1; i<rows.length; i++) {
    const r=rows[i]; if(!r) continue;
    const sch=clean(r[schoolCol]); if(!sch) continue;
    if (["합계","소계","총계","학교수"].some(k=>sch.includes(k))) continue;   // 요약행 제외
    const won = toNum(r[amtCol]) * 1000;            // 천원 → 원
    if (!out[sch]) out[sch] = { total:0, items:[] };
    out[sch].items.push(won);                       // 시설(행) 순서대로 누적 — 위치 매칭용
    out[sch].total += won;
  }
  return out;
}

/* 특이사항 시트 → [{school, building, note}]  (특기 헤더가 비어있어도 보고서완료 열 앞 칸으로 추정) */
function parseNotes(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });
  const clean = v => v==null ? "" : String(v).replace(/\u00a0/g," ").trim();
  const norm  = v => clean(v).toLowerCase().replace(/[^a-z0-9가-힣]/g,"");
  let hIdx = -1;
  for (let i=0; i<Math.min(rows.length,8); i++) {
    if ((rows[i]||[]).some(v => { const n=norm(v); return n.includes("학교명")||n.includes("시설물명"); })) { hIdx=i; break; }
  }
  if (hIdx<0) return [];
  const H = (rows[hIdx]||[]).map(norm);
  const schoolCol   = H.findIndex(h => h.includes("학교명")||h.includes("시설물명"));
  const buildingCol = H.findIndex(h => h==="시설명"||h==="동명");
  let noteCol = H.findIndex(h => h.includes("특기"));
  if (noteCol<0) { const repCol = H.findIndex(h => h.includes("보고서")&&h.includes("완료")); if (repCol>0) noteCol = repCol-1; }
  if (schoolCol<0 || noteCol<0) return [];
  const out = []; let curSchool = "";
  for (let i=hIdx+1; i<rows.length; i++) {
    const r=rows[i]; if(!r) continue;
    const sch=clean(r[schoolCol]); if(sch) curSchool=sch;
    const note=clean(r[noteCol]);
    if (note && curSchool) out.push({ school:curSchool, building: buildingCol>=0?clean(r[buildingCol]):"", note });
  }
  return out;
}

/* 특이사항 노트를 학교의 해당 시설(동) 특기사항에 추가 병합 (중복 방지) */
function applyNotes(schools, notes) {
  if (!notes || !notes.length) return 0;
  const byName = {}; schools.forEach(s => { (byName[s.school] = byName[s.school]||[]).push(s); });
  let applied = 0;
  notes.forEach(({school, building, note}) => {
    const list = byName[school]; if (!list || !list.length) return;
    const s = list[0];
    let b = null;
    if (building) b = s.buildings.find(x=>x.b===building) || s.buildings.find(x=>x.b && (x.b.includes(building)||building.includes(x.b)));
    if (!b) b = s.buildings[0];
    if (!b) return;
    const add = (building && b.b!==building) ? `[${building}] ${note}` : note;
    const sig = note.replace(/\s/g,"").slice(0,20);                 // 노트 앞부분 지문(공백 제거 20자)
    const existSig = (b.note||"").replace(/\s/g,"");
    if (!b.note) b.note = add;
    else if (existSig.includes(sig)) { /* 사실상 같은 노트 → 건너뜀(중복 방지) */ }
    else b.note = b.note + " / " + add;
    applied++;
  });
  return applied;
}

/* ══════════════════════════════════════════════════════════════
   날짜 클릭 상세 패널 (현장조사 · 완수일)
══════════════════════════════════════════════════════════════ */
function DayPanel({ dateStr, label, allSchools, setDb, onClose, isMobile }) {
  const [pickerId, setPickerId] = useState(null);
  const [editId, setEditId] = useState(null);

  /* 같은 현장이 상·하반기 양쪽에 있으면(1년 계약 이월) 한 번만 표시.
     그 날짜가 속한 반기의 기록을 우선으로 남긴다. */
  const dHalf = parseInt(String(dateStr).slice(5,7),10) <= 6 ? "상반기" : "하반기";
  const dYear = String(dateStr).slice(0,4);
  const dedup = arr => {
    const m = new Map();
    arr.forEach(s => {
      const k = `${(s.school||"").trim()}|${(s.no||"").toString().trim()}`;
      const prev = m.get(k);
      if (!prev) { m.set(k, s); return; }
      const fits = x => String(x._year)===dYear && x._half===dHalf;
      if (!fits(prev) && fits(s)) m.set(k, s);
    });
    return [...m.values()];
  };
  const fieldSchools = dedup(allSchools.filter(s => s.field===dateStr));
  const startSchools = dedup(allSchools.filter(s => s.start===dateStr));
  const endSchools   = dedup(allSchools.filter(s => s.end===dateStr));
  const total = fieldSchools.length + startSchools.length + endSchools.length;
  const editSc = editId ? allSchools.find(s=>s.id===editId) : null;

  const toggleAssignee = (sid, name) => {
    if (!setDb) return;
    const sc = allSchools.find(s=>s.id===sid);
    if (!sc?._year || !sc?._half) return;
    const had = (sc.assignees||[]).includes(name);
    setDb(prev => {
      const next = {...prev};
      next[sc._year] = {...prev[sc._year]};
      next[sc._year][sc._half] = prev[sc._year][sc._half].map(s => {
        if (s.id!==sid) return s;
        const cur = s.assignees||[];
        const upd = cur.includes(name) ? cur.filter(n=>n!==name) : [...cur,name];
        return {...s, assignees:upd, headcount:upd.length||s.headcount||1};
      });
      return next;
    });

  /* 현장에서 바로 통화 — 번호가 있으면 탭 한 번으로 전화 앱 연결 */

    );

  /* 카드 공통 머리줄 — 현장명 · 지역 · 표시 · 전화 · 수정 */
  const CardHead = ({ s }) => (

      <button onClick={()=>setEditId(s.id)} style={{ padding:"3px 10px",borderRadius:5,fontSize:10,fontWeight:700,
        border:`1px solid ${C.blue}40`,background:C.blueL,color:C.blue,cursor:"pointer",whiteSpace:"nowrap" }}>✏ 수정</button>
    </div>
  );

  const FieldCard = ({ s }) => {
    const assignees = s.assignees||[];
    const available = allMembers().filter(n=>!assignees.includes(n));
    const open = pickerId===s.id;
    return (
      <div style={{ padding:"10px 11px",background:C.surface,borderRadius:9,
        border:`1px solid ${C.border}`,borderLeft:`3px solid ${C.blue}`,marginBottom:6 }}>
        <CardHead s={s}/>

        {/* 인원 배정 */}
        <div style={{ padding:"8px 9px",background:C.surfaceL,borderRadius:9,border:BD }}>
          <div style={{ display:"flex",alignItems:"center",flexWrap:"wrap",gap:5 }}>
            {assignees.map(name => {
              const mc = memberColor(name);
              return (
                <span key={name} style={{ display:"inline-flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,
                  color:"#fff",background:mc,padding:"4px 9px",borderRadius:20,whiteSpace:"nowrap",boxShadow:`0 2px 6px ${mc}40` }}>
                  {name}
                  <button onClick={()=>toggleAssignee(s.id,name)} style={{ width:14,height:14,borderRadius:"50%",border:"none",
                    background:"rgba(255,255,255,.3)",color:"#fff",fontSize:10,fontWeight:900,cursor:"pointer",
                    lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center",padding:0 }}>×</button>
                </span>
              );
            })}
            {available.length>0 && (
              <button onClick={()=>setPickerId(open?null:s.id)} style={{ width:26,height:26,borderRadius:"50%",
                border:`1.5px solid ${C.blue}`,background:open?C.blue:C.surface,color:open?"#fff":C.blue,
                fontSize:16,fontWeight:700,cursor:"pointer",lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>+</button>
            )}
            {assignees.length===0 && !open && <span style={{ fontSize:10,color:C.t4 }}>+ 버튼으로 인원 추가</span>}
          </div>
          {open && (
            <div style={{ marginTop:8,padding:8,background:C.surface,borderRadius:8,border:BD }}>
              <div style={{ fontSize:9,color:C.t4,fontWeight:600,marginBottom:5 }}>인원 선택</div>
              <div style={{ display:"flex",flexWrap:"wrap",gap:5 }}>
                {available.map(name => {
                  const mc = memberColor(name);
                  return (
                    <button key={name} onClick={()=>{ toggleAssignee(s.id,name); setPickerId(null); }}
                      style={{ padding:"5px 12px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",
                        background:mc+"14",color:mc,border:`1.5px solid ${mc}55` }}>{name}</button>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* 동 목록 */}
        <div style={{ display:"flex",flexWrap:"wrap",gap:3,marginTop:7 }}>
          {s.buildings.map((b,i)=>(
            <span key={i} style={{ fontSize:9,padding:"1px 6px",borderRadius:3,background:C.surfaceL,border:BD,color:C.t2,whiteSpace:"nowrap" }}>
              {b.b}{b.floor?` (${b.floor}층)`:""}
            </span>
          ))}
        </div>
        {s.buildings.some(b=>b.note) && (
          <div style={{ marginTop:6,fontSize:9,color:C.t3,padding:"3px 8px",background:C.yellowL,borderRadius:4,
            borderLeft:`2px solid ${C.yellow}`,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>
            ⚠ {s.buildings.find(b=>b.note)?.note}
          </div>
        )}
      </div>
    );
  };

  const StartCard = ({ s }) => (
    <div style={{ padding:"10px 11px",background:C.surface,borderRadius:9,
      border:`1px solid ${C.green}40`,borderLeft:`3px solid ${C.green}`,marginBottom:6 }}>
      <CardHead s={s}/>
      <div style={{ fontSize:10,color:C.t2 }}>
        ▶ 용역 착수 · {s.buildings.length}동 · 완수 {fd(s.end)} ({ddL(calcDday(s.end))})
      </div>
    </div>
  );

  const EndCard = ({ s }) => (
    <div style={{ padding:"10px 11px",background:C.surface,borderRadius:9,
      border:`1px solid ${C.orange}40`,borderLeft:`3px solid ${C.orange}`,marginBottom:6 }}>
      <CardHead s={s}/>
      <div style={{ fontSize:10,color:C.t2 }}>
        🏁 완수 예정 · {s.buildings.length}동{(s.assignees||[]).length?` · ${s.assignees.join("·")}`:""}
      </div>
    </div>
  );

  return (
    <>
      <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(30,35,50,.35)",backdropFilter:"blur(2px)",zIndex:290 }}/>
      <div style={{ position:"fixed",top:0,right:0,height:"100vh",width:isMobile?"100vw":460,maxWidth:"96vw",
        background:C.surface,borderLeft:`4px solid ${C.blue}`,boxShadow:"-10px 0 40px rgba(0,0,0,.20)",zIndex:291,
        display:"flex",flexDirection:"column",animation:"daySlide .22s cubic-bezier(.2,.8,.2,1)" }}>
        <style>{`@keyframes daySlide{from{transform:translateX(100%)}to{transform:translateX(0)}}`}</style>
        <div style={{ padding:"18px 20px",borderBottom:BD,background:C.blueL,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0 }}>
          <div>
            <div style={{ fontSize:22,fontWeight:900,color:C.blue,lineHeight:1.1 }}>{label}</div>
            <div style={{ fontSize:12,color:C.blue+"bb",marginTop:5 }}>현장 {fieldSchools.length} · 착수 {startSchools.length} · 완수 {endSchools.length} · 총 {total}건</div>
          </div>
          <button onClick={onClose} style={{ width:32,height:32,borderRadius:"50%",background:`${C.blue}20`,
            border:`1px solid ${C.blue}40`,color:C.blue,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1,flexShrink:0 }}>×</button>
        </div>
        <div style={{ flex:1,overflowY:"auto",padding:"16px 18px" }}>
          {total===0 && <div style={{ textAlign:"center",padding:"60px 0",color:C.t4 }}><div style={{ fontSize:30,marginBottom:10 }}>—</div><div style={{ fontSize:13 }}>등록된 일정 없음</div></div>}
          {fieldSchools.length>0 && (
            <div style={{ marginBottom:16 }}>
              <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:9,padding:"7px 10px",background:C.blueL,borderRadius:7 }}>
                <span style={{ fontSize:15 }}>📍</span><span style={{ fontSize:13,fontWeight:800,color:C.blue }}>현장조사</span>
                <span style={{ marginLeft:"auto",background:C.blue,color:"#fff",padding:"2px 9px",borderRadius:10,fontSize:11,fontWeight:700 }}>{fieldSchools.length}</span>
              </div>
              {fieldSchools.map(s=><FieldCard key={s.id} s={s}/>)}
            </div>
          )}
          {startSchools.length>0 && (
            <div style={{ marginBottom:16 }}>
              <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:9,padding:"7px 10px",background:C.greenL,borderRadius:7 }}>
                <span style={{ fontSize:15 }}>▶</span><span style={{ fontSize:13,fontWeight:800,color:C.green }}>착수일</span>
                <span style={{ marginLeft:"auto",background:C.green,color:"#fff",padding:"2px 9px",borderRadius:10,fontSize:11,fontWeight:700 }}>{startSchools.length}</span>
              </div>
              {startSchools.map(s=><StartCard key={s.id} s={s}/>)}
            </div>
          )}
          {endSchools.length>0 && (
            <div>
              <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:9,padding:"7px 10px",background:C.orangeL,borderRadius:7 }}>
                <span style={{ fontSize:15 }}>📦</span><span style={{ fontSize:13,fontWeight:800,color:C.orange }}>완수일</span>
                <span style={{ marginLeft:"auto",background:C.orange,color:"#fff",padding:"2px 9px",borderRadius:10,fontSize:11,fontWeight:700 }}>{endSchools.length}</span>
              </div>
              {endSchools.map(s=><EndCard key={s.id} s={s}/>)}
            </div>
          )}
        </div>
      </div>
      {editSc && <EditPanel sc={editSc} yr={editSc._year} half={editSc._half} setDb={setDb} onClose={()=>setEditId(null)}/>}
    </>
  );
}

/* ══════════════════════════════════════════════════════════════
   현장 일정 — 영구 캘린더 (드래그로 일정 변경)
══════════════════════════════════════════════════════════════ */
function Calendar({ allSchools, setDb, isMobile }) {
  const today = new Date();
  const [yr, setYr] = useState(today.getFullYear());
  const [mo, setMo] = useState(today.getMonth()+1);
  const [dragging, setDragging] = useState(null);
  const [overDay, setOverDay] = useState(null);
  const [selDay, setSelDay] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = m => { setToast(m); setTimeout(()=>setToast(null), 2200); };
  const pad = n => String(n).padStart(2,"0");

  const toStr = day => `${yr}-${pad(mo)}-${pad(day)}`;

  const prevMonth = () => { if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1); setSelDay(null); };
  const nextMonth = () => { if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1); setSelDay(null); };
  const goToday   = () => { setYr(today.getFullYear()); setMo(today.getMonth()+1); setSelDay(today.getDate()); };

  const daysInMonth = new Date(yr, mo, 0).getDate();
  const firstDow = new Date(yr, mo-1, 1).getDay();
  const cells = [...Array(firstDow).fill(null), ...Array.from({length:daysInMonth},(_,i)=>i+1)];
  while (cells.length%7) cells.push(null);
  const weeks = Array.from({length:cells.length/7},(_,i)=>cells.slice(i*7,i*7+7));
  const isToday = d => yr===today.getFullYear() && mo===today.getMonth()+1 && d===today.getDate();

  const eventsByDay = useMemo(() => {
    const map = {};
    const seen = new Set();   // 같은 현장·같은 날·같은 종류 중복 제거 (1년 계약 이월본이 양쪽 반기에 있어도 1번만)
    allSchools.forEach(s => {
      [["field","현장"],["start","착수"],["end","완수"]].forEach(([f,lbl]) => {
        const ds = s[f]; if (!ds) return;
        const [y,m,d] = ds.split("-").map(Number);
        if (y!==yr || m!==mo) return;
        const k = `${ds}|${f}|${(s.school||"").trim()}|${(s.no||"").toString().trim()}`;
        if (seen.has(k)) return; seen.add(k);
        (map[d] = map[d]||[]).push({ schoolId:s.id, school:s.school, field:f, label:lbl,
          headcount:s.headcount||2, assignees:s.assignees||[] });
      });
    });
    // 같은 날 정렬: 현장 → 착수 → 완수
    const ord = { field:0, start:1, end:2 };
    Object.values(map).forEach(arr => arr.sort((a,b)=>ord[a.field]-ord[b.field]));
    return map;
  }, [allSchools, yr, mo]);

  const handleDrop = useCallback(targetDay => {
    if (!dragging || !targetDay) return;
    const { schoolId, field, fromDay } = dragging;
    if (fromDay===targetDay) { setDragging(null); setOverDay(null); return; }
    const nd = toStr(targetDay);
    const sc = allSchools.find(s=>s.id===schoolId);
    if (sc?._year && sc?._half) {
      setDb(prev => {
        const next = {...prev};
        next[sc._year] = {...prev[sc._year]};
        next[sc._year][sc._half] = prev[sc._year][sc._half].map(s => s.id!==schoolId ? s : {...s,[field]:nd});
        return next;
      });
    }
    const lbl = field==="field"?"현장조사일":field==="start"?"착수일":"완수일";
    logAction("수정", `${sc?.school} · ${lbl}`, sc?.[field]||"-", nd);
    showToast(`${sc?.school} ${lbl} → ${mo}/${targetDay} · 현장관리 반영`);
    setDragging(null); setOverDay(null);
  }, [dragging, allSchools, yr, mo, setDb]);

  /* 현장=파랑, 착수=초록, 완수=노랑 */
  const evColor = (f) => f==="field" ? C.blue : f==="start" ? C.green : C.yellow;
  const evMark  = f => f==="start" ? " ▶" : f==="end" ? " 📦" : "";
  const DOW = ["일","월","화","수","목","금","토"];
  const selLabel = selDay ? `${mo}월 ${selDay}일 (${DOW[new Date(yr,mo-1,selDay).getDay()]})` : "";

  return (
    <div>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14 }}>
        <div>
          <div style={{ fontSize:11,color:C.t3,letterSpacing:2,fontWeight:600,marginBottom:3 }}>SCHEDULE</div>
          <h1 style={{ margin:0,fontSize:22,fontWeight:900,color:C.t1 }}>현장 일정</h1>
        </div>
      </div>

      <div style={{ padding:"9px 14px",background:C.blueL,border:`1px solid ${C.blue}30`,borderRadius:8,
        fontSize:11,color:C.blue,fontWeight:600,marginBottom:14,display:"flex",alignItems:"center",gap:8 }}>
        🖱 일정 카드를 드래그해 날짜 변경 · 날짜 클릭 시 우측에 상세 표시
      </div>

      <div style={{ display:"flex",gap:16,flexDirection:isMobile?"column":"row" }}>
        <div style={{ flex:1,minWidth:0 }}>
          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap" }}>
            <button onClick={prevMonth} style={{ width:isMobile?34:38,height:isMobile?34:38,borderRadius:8,border:BD,background:C.surface,color:C.t2,fontSize:20,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1 }}>‹</button>
            <div style={{ fontSize:isMobile?22:30,fontWeight:900,color:C.t1,minWidth:isMobile?140:180,textAlign:"center",letterSpacing:-0.5 }}>{yr}년 {mo}월</div>
            <button onClick={nextMonth} style={{ width:isMobile?34:38,height:isMobile?34:38,borderRadius:8,border:BD,background:C.surface,color:C.t2,fontSize:20,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1 }}>›</button>
            <button onClick={goToday} style={{ padding:isMobile?"7px 14px":"8px 16px",borderRadius:8,border:`1.5px solid ${C.blue}`,background:C.blueL,color:C.blue,fontSize:isMobile?12:14,fontWeight:800,cursor:"pointer" }}>오늘</button>
            <div style={{ display:isMobile?"none":"flex",gap:4,marginLeft:6 }}>
              {[2024,2025,2026,2027].map(y=>(
                <button key={y} onClick={()=>setYr(y)} style={{ padding:"4px 9px",borderRadius:6,border:`1px solid ${yr===y?C.blue:C.border}`,
                  background:yr===y?C.blueL:"transparent",color:yr===y?C.blue:C.t3,fontSize:11,fontWeight:600,cursor:"pointer" }}>{y}</button>
              ))}
            </div>
            <div style={{ display:isMobile?"none":"flex",gap:3 }}>
              {Array.from({length:12},(_,i)=>i+1).map(m=>(
                <button key={m} onClick={()=>setMo(m)} style={{ width:24,height:24,borderRadius:5,border:`1px solid ${mo===m?C.blue:C.border}`,
                  background:mo===m?C.blueL:"transparent",color:mo===m?C.blue:C.t3,fontSize:10,fontWeight:600,cursor:"pointer" }}>{m}</button>
              ))}
            </div>
          </div>

          <div style={{ background:C.surface,border:BD,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.06)" }}>
            <table style={{ width:"100%",borderCollapse:"collapse",tableLayout:"fixed" }}>
              <colgroup>{[0,1,2,3,4,5,6].map(i=><col key={i}/>)}</colgroup>
              <thead>
                <tr style={{ background:C.surfaceL,borderBottom:`1.5px solid ${C.borderD}` }}>
                  {DOW.map((d,i)=>(
                    <th key={d} style={{ padding:isMobile?"9px 0":"12px 0",textAlign:"center",fontSize:isMobile?12:15,fontWeight:800,
                      color:i===0?C.red:i===6?C.blue:C.t2,letterSpacing:1,borderRight:i<6?BD:"none",fontFamily:F }}>{d}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {weeks.map((week,wi)=>(
                  <tr key={wi} style={{ borderBottom:wi<weeks.length-1?BD:"none" }}>
                    {week.map((day,di)=>{
                      const evs = day?eventsByDay[day]||[]:[];
                      const over = overDay===day && !!day;
                      const sel  = selDay===day && !!day;
                      return (
                        <td key={di}
                          onClick={()=>day&&setSelDay(sel?null:day)}
                          onDragOver={e=>{e.preventDefault();setOverDay(day);}}
                          onDragLeave={()=>setOverDay(null)}
                          onDrop={()=>handleDrop(day)}
                          style={{ padding:isMobile?"6px 6px 5px":"7px 8px 7px",verticalAlign:"top",height:isMobile?92:118,width:"14.285%",
                            borderRight:di<6?BD:"none",cursor:day?"pointer":"default",
                            background:sel?"rgba(29,111,242,.11)":over?"rgba(29,111,242,.09)":isToday(day)?"rgba(29,111,242,.05)":"transparent",
                            outline:sel?`2px solid ${C.blue}`:over?`2px dashed ${C.blue}`:"none",outlineOffset:-2,
                            transition:"background .1s",position:"relative" }}>
                          {day && <>
                            <div style={{ width:isMobile?26:34,height:isMobile?26:34,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:"50%",
                              background:isToday(day)?C.blue:"transparent",color:isToday(day)?"#fff":di===0?C.red:di===6?C.blue:C.t1,
                              fontSize:isMobile?14:18,fontWeight:isToday(day)?900:700,marginBottom:isMobile?4:5,
                              boxShadow:isToday(day)?`0 2px 8px ${C.blue}55`:"none" }}>{day}</div>
                            {over && <div style={{ position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-60%)",
                              fontSize:9,color:C.blue,fontWeight:700,pointerEvents:"none",zIndex:2,background:C.blueL,
                              padding:"2px 7px",borderRadius:4,border:`1px solid ${C.blue}30` }}>놓기</div>}
                            <div style={{ display:"flex",flexDirection:"column",gap:isMobile?2:3 }}>
                              {evs.slice(0,isMobile?2:99).map((e,ei)=>(
                                <div key={ei} draggable
                                  onDragStart={()=>setDragging({schoolId:e.schoolId,field:e.field,fromDay:day})}
                                  onDragEnd={()=>{setDragging(null);setOverDay(null);}}
                                  title={`${e.school} · ${e.label} · ${e.assignees.length>0?e.assignees.join(","):e.headcount+"명"}`}
                                  style={{ padding:isMobile?"2px 5px":"3px 7px",borderRadius:4,background:`${evColor(e.field)}15`,
                                    borderLeft:`3px solid ${evColor(e.field)}`,fontSize:isMobile?9:12,color:evColor(e.field),
                                    fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"grab",
                                    boxShadow:"0 1px 3px rgba(0,0,0,.07)",
                                    opacity:dragging?.schoolId===e.schoolId&&dragging?.field===e.field?0.4:1 }}>
                                  <span>{e.school.length>(isMobile?4:11)?e.school.slice(0,isMobile?4:11)+"…":e.school}</span>
                                  {e.field==="end" && <span> 📦</span>}
                                  {e.field==="start" && <span> ▶</span>}
                                  {e.field==="field" && <span style={{opacity:.85,fontSize:isMobile?8:10}}>{e.assignees.length>0?` (${e.assignees.map(n=>n[0]).join("·")})`:` ${e.headcount}명`}</span>}
                                </div>
                              ))}
                              {evs.length>(isMobile?2:99) && <div style={{ fontSize:isMobile?9:11,color:C.t4,paddingLeft:4 }}>+{evs.length-(isMobile?2:99)}건</div>}
                            </div>
                          </>}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div style={{ display:"flex",gap:14,marginTop:10,padding:"9px 14px",background:C.surface,border:BD,borderRadius:8,alignItems:"center",flexWrap:"wrap" }}>
            {[["파랑 = 현장조사",C.blue],["초록 ▶ 착수일",C.green],["노랑 📦 완수일",C.yellow]].map(([k,v])=>(
              <div key={k} style={{ display:"flex",alignItems:"center",gap:5 }}>
                <div style={{ width:10,height:10,borderRadius:2,background:v }}/><span style={{ fontSize:10,color:C.t3 }}>{k}</span>
              </div>
            ))}
            <span style={{ fontSize:10,color:C.t4 }}>날짜를 누르면 그날 현장이 열립니다</span>
          </div>
        </div>

        {selDay && <DayPanel dateStr={toStr(selDay)} label={selLabel} allSchools={allSchools} setDb={setDb} onClose={()=>setSelDay(null)} isMobile={isMobile}/>}
      </div>
      <Toast msg={toast}/>
    </div>
  );
}

/* 라벨 + 입력칸 — 모듈 레벨에 두어야 입력칸이 안정되고 한글(IME) 조합이 안 끊김 */
function LI({ label, val, on, type="text", col }) {
  return (
    <div style={{ display:"flex",flexDirection:"column",gap:3 }}>
      <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>{label}</label>
      <input type={type} value={val} onChange={e=>on(e.target.value)}
        style={{ padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:col||C.t1,fontSize:11,outline:"none",width:"100%" }}/>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   현장 수정 슬라이드 패널 (학교 + 동별)
══════════════════════════════════════════════════════════════ */
function EditPanel({ sc, yr, half, setDb, onClose }) {
  const isMobile = useIsMobile();
  const tc = {a:C.blue,b:C.blueL,c:C.t2};
  const [f, setF] = useState({
    school:sc.school||"", no:sc.no||"", region:sc.region||"", kind:sc.kind||"정기점검",
    field:sc.field||"", start:sc.start||"", end:sc.end||"", assignees:sc.assignees||[], tel:sc.tel||"",
    flags:getFlags(sc),
  });
  const [bf, setBf] = useState(sc.buildings.map(b=>({
    b:b.b||"", floor:b.floor||"", area:b.area?String(b.area):"",
    fms:b.fms||"", note:b.note||"",
    rep:!!b.rep, fmsD:!!b.fmsD, delivery:b.delivery||"",
    height:b.height??null, len:b.len??null, jong:b.jong??null, budget:b.budget??null,
  })));
  const [prog, setProg] = useState(() => {
    const o = {}; STEPS.forEach(k => { o[k] = !!(sc.progress && sc.progress[k]); }); return o;
  });
  const [saved, setSaved] = useState(false);
  const progDone = STEPS.filter(k=>prog[k]).length;
  const toggleStep = (k) => setProg(p => ({ ...p, [k]: !p[k] }));

  const save = () => {
    const beforeStr = `${(sc.assignees||[]).join(",")||"-"} · 진행 ${STEPS.filter(k=>sc.progress&&sc.progress[k]).length}/${STEPS.length}`;
    const afterStr  = `${f.assignees.join(",")||"-"} · 진행 ${STEPS.filter(k=>prog[k]).length}/${STEPS.length}`;
    setDb(prev => {
      const next = {...prev};
      next[yr] = {...prev[yr]};
      next[yr][half] = prev[yr][half].map(s => {
        if (s.id!==sc.id) return s;
        return { ...s, school:f.school||s.school, no:f.no, region:f.region, kind:f.kind, field:f.field, start:f.start, end:f.end, tel:(f.tel||"").trim(),
          flags:[...(f.flags||[])],
          assignees:f.assignees, headcount:f.assignees.length||s.headcount, progress:{...prog},
          buildings: bf.map((b)=>({ b:b.b||"동", floor:b.floor||null,
            area:b.area?parseFloat(b.area):null, fms:b.fms||null, note:b.note||null,
            rep:b.rep, fmsD:b.fmsD, delivery:b.delivery||null,
            height:b.height??null, len:b.len??null, jong:b.jong??null, budget:b.budget??null })) };
      });
      return next;
    });
    logAction("수정", `현장 · ${sc.school}`, beforeStr, afterStr);
    setSaved(true);
    setTimeout(()=>{ setSaved(false); onClose(); }, 1100);
  };

  const del = () => {
    if (!window.confirm(`'${sc.school}' 현장을 삭제할까요?\n이 학교의 모든 동·진행 정보가 사라집니다.`)) return;
    setDb(prev => {
      const next = {...prev}; next[yr] = {...prev[yr]};
      next[yr][half] = (prev[yr]?.[half] || []).filter(s => s.id !== sc.id);
      return next;
    });
    logAction("삭제", `현장 · ${sc.school}`, sc.school, null);
    onClose();
  };

  return (
    <>
      <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(30,35,50,.35)",backdropFilter:"blur(2px)",zIndex:300 }}/>
      <div style={{ position:"fixed",top:0,right:0,width:520,maxWidth:"94vw",height:"100vh",background:C.surface,
        borderLeft:`3px solid ${tc.a}`,zIndex:301,display:"flex",flexDirection:"column",boxShadow:"-8px 0 32px rgba(0,0,0,.16)" }}>
        <div style={{ padding:"18px 22px 14px",borderBottom:BD,flexShrink:0,display:"flex",alignItems:"flex-start",justifyContent:"space-between" }}>
          <div>
            <div style={{ fontSize:10,color:tc.a,fontWeight:700,marginBottom:3 }}>✏ 현장 수정 · {yr} {half}</div>
            <div style={{ fontSize:16,fontWeight:900,color:C.t1 }}>{sc.school}</div>
            <div style={{ fontSize:11,color:C.t3,marginTop:2 }}>{sc.region} · {sc.buildings.length}동 · No.{sc.no}</div>
          </div>
          <button onClick={onClose} style={{ width:28,height:28,borderRadius:"50%",background:C.surfaceL,border:BD,color:C.t3,fontSize:16,cursor:"pointer" }}>×</button>
        </div>

        <div style={{ flex:1,overflowY:"auto",padding:"16px 22px" }}>
          <div style={{ padding:14,background:C.surfaceL,borderRadius:10,border:BD,marginBottom:16 }}>
            <div style={{ fontSize:10,fontWeight:700,color:C.t2,marginBottom:12 }}>🏫 학교 기본 정보</div>
            <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
              <div style={{ gridColumn:"span 2" }}><LI label="🏫 학교명 / 현장명" val={f.school} on={v=>setF(p=>({...p,school:v}))}/></div>
              <div style={{ gridColumn:"span 2" }}><LI label="No (관리번호 · 선택)" val={f.no} on={v=>setF(p=>({...p,no:v}))}/></div>
              <div style={{ gridColumn:"span 2",display:"flex",flexDirection:"column",gap:4 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>현장 표시 <span style={{ color:C.t4,fontWeight:500 }}>· 여러 개 선택 가능</span></label>
                <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>
                  {FLAG_OPTS.map(o=>{
                    const on = (f.flags||[]).includes(o.v);
                    return (
                      <button key={o.v} onClick={()=>setF(p=>({...p,flags:on?(p.flags||[]).filter(x=>x!==o.v):[...(p.flags||[]),o.v]}))}
                        style={{ flex:"1 0 auto",minWidth:74,padding:"8px 10px",borderRadius:7,fontSize:12,fontWeight:700,cursor:"pointer",
                          border:`1.5px solid ${on?o.color:C.border}`,background:on?o.color+"18":"transparent",color:on?o.color:C.t3 }}>
                        {on&&"✓ "}{o.label}
                      </button>
                    );
                  })}
                </div>
              </div>
              <LI label="지역" val={f.region} on={v=>setF(p=>({...p,region:v}))}/>
              <div style={{ gridColumn:"span 2" }}><LI label="학교 연락처 (현장에서 바로 통화)" val={f.tel} on={v=>setF(p=>({...p,tel:v}))}/></div>
              <div style={{ display:"flex",flexDirection:"column",gap:3 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>점검종류</label>
                <select value={f.kind} onChange={e=>setF(p=>({...p,kind:e.target.value}))}
                  style={{ padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:C.t1,fontSize:11,outline:"none" }}>
                  {["정기점검","정밀점검","내진성능","구조감리","내진보강설계","구조검토"].map(k=><option key={k}>{k}</option>)}
                </select>
              </div>
              <LI label="현장조사일" val={f.field} on={v=>setF(p=>({...p,field:v}))} type="date" col={tc.a}/>
              <LI label="착수일" val={f.start} on={v=>setF(p=>({...p,start:v}))} type="date"/>
              <LI label="완수일" val={f.end} on={v=>setF(p=>({...p,end:v}))} type="date" col={C.orange}/>
              <div style={{ gridColumn:"span 2",display:"flex",flexDirection:"column",gap:5 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700 }}>투입 인원 <span style={{ marginLeft:6,color:C.blue }}>{f.assignees.length>0?`${f.assignees.length}명`:"미선택"}</span></label>
                <div style={{ padding:10,background:C.surfaceL,borderRadius:8,border:BD,display:"flex",flexWrap:"wrap",gap:5 }}>
                  {allMembers().map(name=>{
                    const on=f.assignees.includes(name); const mc=memberColor(name);
                    return <button key={name} onClick={()=>setF(p=>({...p,assignees:on?p.assignees.filter(n=>n!==name):[...p.assignees,name]}))}
                      style={{ padding:"6px 12px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",
                        background:on?mc:C.surface,color:on?"#fff":mc,border:`1.5px solid ${on?mc:mc+"40"}` }}>{on&&"✓ "}{name}</button>;
                  })}
                </div>
              </div>
            </div>
          </div>

          {/* 업무 진행 8단계 */}
          <div style={{ padding:14,background:C.surfaceL,borderRadius:10,border:BD,marginBottom:16 }}>
            <div style={{ display:"flex",alignItems:"center",marginBottom:10 }}>
              <div style={{ fontSize:10,fontWeight:700,color:C.t2 }}>📋 업무 진행 단계</div>
              <div style={{ marginLeft:"auto",fontSize:12,fontWeight:800,color:progDone===STEPS.length?C.green:tc.a }}>
                {progDone}/{STEPS.length}
                <span style={{ fontSize:10,color:C.t4,marginLeft:4,fontWeight:600 }}>{Math.round(progDone/STEPS.length*100)}%</span>
              </div>
            </div>

            {/* 진행 바 */}
            <div style={{ display:"flex",gap:3,marginBottom:12 }}>
              {STEPS.map((k)=>{
                const on=prog[k], sp=STEP_SPECIAL[k], col=sp?C.purple:C.blue;
                return <div key={k} style={{ flex:1,height:8,borderRadius:3,
                  background:on?col:C.surfaceD,
                  border:sp?`1.5px solid ${on?col:col+"55"}`:"none",boxSizing:"border-box" }}/>;
              })}
            </div>

            {/* 단계 토글 (순서대로) */}
            <div style={{ display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:7 }}>
              {STEPS.map((k,i)=>{
                const on=prog[k], sp=STEP_SPECIAL[k], col=sp?C.purple:(k==="완수"?C.green:C.blue);
                return (
                  <button key={k} onClick={()=>toggleStep(k)} style={{
                    display:"flex",alignItems:"center",gap:8,padding:"9px 11px",borderRadius:8,cursor:"pointer",
                    background:on?col+"12":C.surface,
                    border:`1.5px solid ${on?col:(sp?col+"40":C.border)}`,textAlign:"left" }}>
                    <span style={{ width:20,height:20,borderRadius:"50%",flexShrink:0,
                      display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,
                      background:on?col:C.surfaceD,color:on?"#fff":C.t4 }}>{on?"✓":i+1}</span>
                    <span style={{ fontSize:13 }}>{STEP_ICON[k]}</span>
                    <span style={{ fontSize:12,fontWeight:700,color:on?col:C.t2,flex:1 }}>{k}</span>
                    {sp && <span style={{ fontSize:8,fontWeight:700,color:C.purple,background:C.purpleL,padding:"1px 5px",borderRadius:3 }}>중요</span>}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize:9,color:C.t4,marginTop:8 }}>* 단계를 눌러 완료/미완료를 전환하세요. 검토·제본은 별도 강조됩니다.</div>
          </div>

          <div style={{ fontSize:10,fontWeight:700,color:C.t2,marginBottom:10 }}>🏗 동별 수정</div>
          {bf.map((b,bi)=>(
            <div key={bi} style={{ padding:14,background:C.surface,borderRadius:10,border:`1px solid ${C.border}`,borderLeft:`3px solid ${tc.a}`,marginBottom:10 }}>
              <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:12 }}>
                <div style={{ width:20,height:20,borderRadius:"50%",background:tc.b,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:tc.a }}>{bi+1}</div>
                <span style={{ fontSize:13,fontWeight:700,color:C.t1,flex:1 }}>{b.b||`${bi+1}번 동`}</span>
                <div style={{ display:"flex",gap:4 }}>
                  {[{k:"보고서",f:"rep",ac:C.purple,bc:C.purpleL},{k:"FMS",f:"fmsD",ac:C.blue,bc:C.blueL}].map(x=>(
                    <button key={x.f} onClick={()=>setBf(p=>p.map((v,i)=>i!==bi?v:{...v,[x.f]:!v[x.f]}))}
                      style={{ padding:"3px 8px",borderRadius:5,fontSize:9,fontWeight:700,cursor:"pointer",
                        border:`1px solid ${b[x.f]?x.ac+"60":C.border}`,background:b[x.f]?x.bc:C.surfaceL,color:b[x.f]?x.ac:C.t4 }}>{b[x.f]?"✓ ":""}{x.k}</button>
                  ))}
                  {["직납","우편"].map(dv=>(
                    <button key={dv} onClick={()=>setBf(p=>p.map((v,i)=>i!==bi?v:{...v,delivery:v.delivery===dv?"":dv}))}
                      style={{ padding:"3px 7px",borderRadius:5,fontSize:9,fontWeight:700,cursor:"pointer",
                        border:`1px solid ${b.delivery===dv?C.green+"60":C.border}`,background:b.delivery===dv?C.greenL:C.surfaceL,color:b.delivery===dv?C.green:C.t4 }}>{dv[0]}</button>
                  ))}
                  <button onClick={()=>setBf(p=>p.filter((_,i)=>i!==bi))} style={{ padding:"3px 6px",borderRadius:5,fontSize:10,cursor:"pointer",border:`1px solid ${C.red}30`,background:C.redL,color:C.red,fontWeight:700 }}>✕</button>
                </div>
              </div>
              <div style={{ display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"1fr 1fr 1fr",gap:8,marginBottom:8 }}>
                <LI label="동명" val={b.b} on={v=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,b:v}))}/>
                <LI label="층수" val={b.floor} on={v=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,floor:v}))}/>
                <LI label="연면적㎡" val={b.area} on={v=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,area:v}))} type="number"/>
              </div>
              <div style={{ marginBottom:8 }}>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700,display:"block",marginBottom:3 }}>FMS 계정 (아이디 // 비밀번호)</label>
                <input value={b.fms} onChange={e=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,fms:e.target.value}))} placeholder="아이디 // 비밀번호"
                  style={{ width:"100%",padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:C.blue,fontSize:11,outline:"none",fontFamily:"monospace" }}/>
              </div>
              <div>
                <label style={{ fontSize:9,color:C.t3,fontWeight:700,display:"block",marginBottom:3 }}>특이사항 / 메모</label>
                <textarea value={b.note} onChange={e=>setBf(p=>p.map((x,i)=>i!==bi?x:{...x,note:e.target.value}))} placeholder="담당자 연락처, 주의사항..." rows={2}
                  style={{ width:"100%",padding:"7px 9px",background:C.surfaceL,border:BD,borderRadius:6,color:C.t1,fontSize:11,outline:"none",resize:"vertical",lineHeight:1.5 }}/>
              </div>
            </div>
          ))}
          <button onClick={()=>setBf(p=>[...p,{b:"",floor:"",area:"",fms:"",note:"",rep:false,fmsD:false,delivery:""}])}
            style={{ width:"100%",padding:9,borderRadius:8,border:`1.5px dashed ${C.border}`,background:"transparent",color:C.t3,fontSize:12,cursor:"pointer",marginBottom:8 }}>+ 동 추가</button>
        </div>

        <div style={{ padding:"14px 22px",borderTop:BD,flexShrink:0,display:"flex",gap:8 }}>
          <button onClick={del} title="현장 삭제" style={{ flexShrink:0,padding:"11px 14px",borderRadius:9,border:`1.5px solid ${C.red}40`,background:C.redL,color:C.red,fontSize:13,fontWeight:700,cursor:"pointer" }}>🗑 삭제</button>
          <button onClick={onClose} style={{ flex:1,padding:11,borderRadius:9,border:BD,background:"transparent",color:C.t3,fontSize:13,cursor:"pointer" }}>취소</button>
          <button onClick={save} style={{ flex:2,padding:11,borderRadius:9,background:saved?C.green:C.blue,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",transition:"background .3s",boxShadow:`0 4px 14px ${(saved?C.green:C.blue)}40` }}>
            {saved?"✓ 저장됨!":"✓ 저장 · 캘린더 자동 반영"}
          </button>
        </div>
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════
   다른 반기에서 현장 복사 (상반기 → 하반기 등)
══════════════════════════════════════════════════════════════ */
function CopyHalfModal({ db, setDb, toYr, toHalf, onClose, onDone, isMobile }) {
  const [sel, setSel] = useState(new Set());
  const [search, setSearch] = useState("");
  const [keepOrig, setKeepOrig] = useState(false);   // 원본 날짜·진행 그대로 이월

  const buckets = [];
  Object.keys(db||{}).filter(y=>!isLH(y)).sort((a,b)=>b-a).forEach(y => ["상반기","하반기"].forEach(h => {
    if (y===toYr && h===toHalf) return;
    const arr = db[y]?.[h] || [];
    if (arr.length) buckets.push({ y, h, arr });
  }));
  const destKeys = new Set((db[toYr]?.[toHalf]||[]).map(s=>`${(s.school||"").trim()}|${(s.no||"").toString().trim()}`));
  const keyOf = (bk,s) => `${bk.y}|${bk.h}|${s.id}`;
  const ms = s => !search || (s.school||"").includes(search) || (s.region||"").includes(search);
  const toggle = k => setSel(p => { const n=new Set(p); n.has(k)?n.delete(k):n.add(k); return n; });
  const bucketKeys = bk => bk.arr.filter(ms).map(s=>keyOf(bk,s));
  const allSelInBucket = bk => { const ks=bucketKeys(bk); return ks.length>0 && ks.every(k=>sel.has(k)); };
  const toggleBucket = bk => { const ks=bucketKeys(bk); setSel(p=>{ const n=new Set(p); const all=ks.every(k=>n.has(k)); ks.forEach(k=>all?n.delete(k):n.add(k)); return n; }); };

  /* 완수일이 목적지 반기에 속하는지 (1년계약 이월용) */
  const range = toHalf==="상반기" ? [1,6] : [7,12];
  const inDestHalf = (s) => {
    if (!s.end) return false;
    const y = String(s.end).slice(0,4); const m = parseInt(String(s.end).slice(5,7),10);
    return y===String(toYr) && m>=range[0] && m<=range[1];
  };
  const autoCandidates = [];
  buckets.forEach(bk => bk.arr.forEach(s => { if (inDestHalf(s) && !destKeys.has(`${(s.school||"").trim()}|${(s.no||"").toString().trim()}`)) autoCandidates.push(keyOf(bk,s)); }));
  const autoSelect = () => { setSel(new Set(autoCandidates)); setKeepOrig(true); };

  const doCopy = () => {
    const picked = [];
    buckets.forEach(bk => bk.arr.forEach(s => { if (sel.has(keyOf(bk,s))) picked.push(s); }));
    if (!picked.length) return;
    const copies = picked.map(s => keepOrig
      ? ({ ...s, id: `copy-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}-${Math.floor(Math.random()*9999)}`,
           progress: {},                                                                  // 진행단계 초기화
           buildings: (s.buildings||[]).map(b=>({ ...b, rep:false, fmsD:false, delivery:null })) })   // 날짜는 유지, 보고서·FMS·납품은 미완으로
      : ({ ...s, id: `copy-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}-${Math.floor(Math.random()*9999)}`,
           field:"", start:"", end:"", progress:{}, assignees:[], headcount:s.headcount||1,
           buildings: (s.buildings||[]).map(b=>({ ...b, rep:false, fmsD:false, delivery:null })) }));   // 새 점검으로 초기화
    setDb(prev => { const n={...prev}; n[toYr]={...(prev[toYr]||{})}; n[toYr][toHalf]=[...(prev[toYr]?.[toHalf]||[]), ...copies]; return n; });
    onDone(copies.length);
  };

  const selCount = sel.size;
  const hc = toHalf==="상반기"?C.blue:C.orange;

  return (
    <>
      <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(30,35,50,.4)",backdropFilter:"blur(2px)",zIndex:300 }}/>
      <div style={{ position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:isMobile?"94vw":560,maxWidth:"94vw",maxHeight:"88vh",
        background:C.surface,borderRadius:16,zIndex:301,display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,.3)",overflow:"hidden" }}>
        <div style={{ padding:"18px 20px",borderBottom:BD,flexShrink:0 }}>
          <div style={{ fontSize:17,fontWeight:900,color:C.t1 }}>📋 다른 반기에서 현장 복사</div>
          <div style={{ fontSize:12,color:C.t3,marginTop:4 }}>
            선택한 현장을 <b style={{color:hc}}>{toYr}년 {toHalf}</b>로 복사해요.
          </div>

          {autoCandidates.length>0 && (
            <div style={{ marginTop:12,padding:"11px 13px",background:hc+"0e",border:`1.5px solid ${hc}40`,borderRadius:10,display:"flex",alignItems:"center",gap:10 }}>
              <span style={{ fontSize:18 }}>⚡</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:12,fontWeight:800,color:hc }}>완수일이 {toYr}년 {toHalf}인 현장 {autoCandidates.length}개</div>
                <div style={{ fontSize:10,color:C.t3,marginTop:2 }}>1년 계약 등 하반기까지 이어지는 현장을 자동으로 골라줘요</div>
              </div>
              <button onClick={autoSelect} style={{ padding:"8px 14px",borderRadius:8,border:"none",background:hc,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap" }}>자동 선택</button>
            </div>
          )}

          <label style={{ marginTop:10,display:"flex",alignItems:"center",gap:8,cursor:"pointer",padding:"8px 11px",background:C.surfaceL,borderRadius:8,border:BD }}>
            <span onClick={()=>setKeepOrig(v=>!v)} style={{ width:38,height:22,borderRadius:11,background:keepOrig?C.green:C.borderD,position:"relative",transition:"background .15s",flexShrink:0 }}>
              <span style={{ position:"absolute",top:2,left:keepOrig?18:2,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left .15s",boxShadow:"0 1px 3px rgba(0,0,0,.3)" }}/>
            </span>
            <div style={{ flex:1 }} onClick={()=>setKeepOrig(v=>!v)}>
              <div style={{ fontSize:12,fontWeight:700,color:C.t1 }}>날짜·진행상태 그대로 이월</div>
              <div style={{ fontSize:10,color:C.t3,marginTop:1 }}>{keepOrig ? "완수일·날짜는 그대로, 보고서·FMS·납품은 미완으로 초기화 (이어지는 계약)" : "새 점검으로 날짜·진행·상태 모두 초기화해요"}</div>
            </div>
          </label>

          <div style={{ display:"flex",background:C.surfaceL,border:BD,borderRadius:8,padding:"7px 11px",gap:7,alignItems:"center",marginTop:10 }}>
            <span style={{ color:C.t4 }}>⌕</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="학교명·지역 검색"
              style={{ background:"transparent",border:"none",color:C.t1,fontSize:13,outline:"none",flex:1 }}/>
          </div>
        </div>

        <div style={{ flex:1,overflowY:"auto",padding:"12px 16px" }}>
          {buckets.length===0 && <div style={{ textAlign:"center",padding:"40px 0",color:C.t4,fontSize:13 }}>복사할 다른 반기 데이터가 없습니다.</div>}
          {buckets.map(bk => {
            const rows = bk.arr.filter(ms);
            if (!rows.length) return null;
            const bhc = bk.h==="상반기"?C.blue:C.orange;
            return (
              <div key={bk.y+bk.h} style={{ marginBottom:16 }}>
                <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8,position:"sticky",top:0,background:C.surface,padding:"4px 0",zIndex:1 }}>
                  <span style={{ fontSize:13,fontWeight:800,color:bhc }}>{bk.h==="상반기"?"🌱":"🍂"} {bk.y}년 {bk.h}</span>
                  <span style={{ fontSize:11,color:C.t4 }}>{rows.length}개</span>
                  <button onClick={()=>toggleBucket(bk)} style={{ marginLeft:"auto",padding:"4px 10px",borderRadius:6,fontSize:11,fontWeight:700,
                    border:`1px solid ${bhc}40`,background:allSelInBucket(bk)?bhc:C.surfaceL,color:allSelInBucket(bk)?"#fff":bhc,cursor:"pointer" }}>
                    {allSelInBucket(bk)?"전체 해제":"전체 선택"}
                  </button>
                </div>
                {rows.map(s => {
                  const k = keyOf(bk,s); const on = sel.has(k);
                  const dup = destKeys.has(`${(s.school||"").trim()}|${(s.no||"").toString().trim()}`);
                  return (
                    <div key={k} onClick={()=>toggle(k)} style={{ display:"flex",alignItems:"center",gap:10,padding:"9px 11px",borderRadius:8,cursor:"pointer",
                      border:`1.5px solid ${on?C.blue:C.border}`,background:on?C.blueL:C.surface,marginBottom:6 }}>
                      <div style={{ width:20,height:20,borderRadius:5,border:`2px solid ${on?C.blue:C.borderD}`,background:on?C.blue:"transparent",
                        display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff",fontSize:13,fontWeight:900 }}>{on?"✓":""}</div>
                      <span style={{ fontSize:13,fontWeight:700,color:C.t1,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{s.school}</span>
                      <span style={{ fontSize:11,color:C.t4 }}>{s.region} · {(s.buildings||[]).length}동</span>
                      {dup && <span style={{ fontSize:9,color:C.orange,fontWeight:700,background:C.orangeL,padding:"2px 6px",borderRadius:4,whiteSpace:"nowrap" }}>이미 있음</span>}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>

        <div style={{ padding:"14px 18px",borderTop:BD,flexShrink:0,display:"flex",gap:10,alignItems:"center" }}>
          <span style={{ fontSize:13,color:C.t2,fontWeight:600 }}>{selCount}개 선택됨</span>
